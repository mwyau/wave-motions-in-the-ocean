<!DOCTYPE html>
<html lang="$language">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$page_title</title>
  <meta name="description" content="$description">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E🌊%3C/text%3E%3C/svg%3E">
  <meta name="mathjax-upstream" content="$mathjax_upstream">
  <meta property="og:title" content="$social_title">
  <meta property="og:type" content="website">
  <meta property="og:url" content="$social_url">
  <meta property="og:image" content="$social_image">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="$social_image_alt">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="$social_title">
  <meta name="twitter:description" content="$description">
  <meta name="twitter:image" content="$social_image">
  <meta name="twitter:image:alt" content="$social_image_alt">
  $pandoc_styles
  <link rel="stylesheet" href="assets/wave.css?v=$asset_version">
  <script src="$mathjax_url" type="text/javascript"></script>
  <script defer src="assets/wave.js?v=$asset_version"></script>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="reader-header page-shell">
  <nav class="book-nav" aria-label="Book navigation">
    <span class="book-nav-links book-nav-start">
      <button class="toc-toggle" type="button" popovertarget="book-contents" data-toc-toggle>Contents</button>
      <a href="$previous_url"$previous_hidden aria-label="Previous: $previous_label"><span class="nav-long">← $previous_label</span><span class="nav-short">← Previous</span></a>
    </span>
    <span class="reader-context" data-reader-context aria-label="Current reading position">
      <span class="reader-context-chapter">$reader_chapter</span>
      <span class="reader-context-separator"$reader_title_hidden aria-hidden="true"> · </span>
      <span class="reader-context-title"$reader_title_hidden>$reader_title</span>
    </span>
    <span class="book-controls book-nav-end">
      <a href="$next_url"$next_hidden aria-label="Next: $next_label"><span class="nav-long">$next_label →</span><span class="nav-short">Next →</span></a>
      <a class="source-link" href="$source_url" aria-label="Source for this page at build revision">Source</a>
      <span class="dev-math-controls" data-dev-math-controls hidden role="group" aria-label="Development math renderer">
        <button class="math-mode-button toc-toggle" type="button" data-math-mode="mathjax" aria-pressed="true">MathJax</button>
        <span aria-hidden="true">|</span>
        <button class="math-mode-button toc-toggle" type="button" data-math-mode="mathml" aria-pressed="false">MathML</button>
      </span>
      <span class="book-control-divider" aria-hidden="true"></span>
      <button class="theme-cycle" type="button" data-theme-cycle><span class="appearance-label">Appearance: </span><span data-theme-label>Auto</span></button>
    </span>
  </nav>
</header>
<aside class="book-contents-rail" aria-label="Contents" data-book-toc-rail data-toc-scope hidden>
  <div class="book-contents-toolbar">
    <strong class="book-contents-title">Contents</strong>
    <button class="toc-expand" type="button" data-toc-expand>Expand all</button>
  </div>
  <nav class="book-contents-nav" aria-label="Book contents">$book_toc</nav>
</aside>
<aside class="book-contents-popover" id="book-contents" popover hidden aria-labelledby="book-contents-heading">
  <div class="book-contents-inner" data-toc-scope>
    <div class="book-contents-toolbar">
      <strong class="book-contents-title" id="book-contents-heading">Contents</strong>
      <span class="book-contents-actions">
        <button class="toc-expand" type="button" data-toc-expand>Expand all</button>
        <button class="toc-close" type="button" popovertarget="book-contents" popovertargetaction="hide" aria-label="Close contents">Close</button>
      </span>
    </div>
    <nav class="book-contents-nav" aria-label="Book contents">$book_toc</nav>
  </div>
</aside>
<main id="main-content">
$body
</main>
<footer class="build-info">Digital edition build: <a href="$build_url"><code>$build_label</code></a></footer>
</body>
</html>
