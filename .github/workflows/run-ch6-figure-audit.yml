name: Run Chapter 6 figure audit finalizer
# refreshed after the p.159 pre-state changed under the broader scientific audit

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: run-ch6-figure-audit-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.head_commit.message == 'Run Chapter 6 figure audit finalizer'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out newest main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install README sync dependency
        env:
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends pandoc

      - name: Apply reviewed p159 patch against current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wave-motions-figure-audit'
          git config user.email '5298134+mwyau@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('.github/workflows/finalize-ch6-figure-audit.yml')
          text = path.read_text()
          opener = "          cat > /tmp/apply_ch6_figure_audit.py <<'PY'\n"
          closer = "\n          PY\n\n          success=false"
          if opener not in text or closer not in text:
              raise SystemExit('cannot locate reviewed Chapter 6 patch')
          code = text.split(opener, 1)[1].split(closer, 1)[0]
          Path('/tmp/apply_ch6_figure_audit.py').write_text(textwrap.dedent(code))
          PY

          success=false
          for attempt in $(seq 1 20); do
            git fetch origin main
            git reset --hard origin/main
            python3 /tmp/apply_ch6_figure_audit.py
            python3 scripts/sync-views.py --readme
            python3 scripts/sync-views.py --check-readme
            rm -f \
              .github/workflows/finalize-ch6-figure-audit.yml \
              .github/workflows/run-ch6-figure-audit.yml
            git diff --check
            git add -- \
              reconstruction/chapter6.tex \
              reconstruction/ERRATA.md \
              reconstruction/FIGURES.md \
              README.md \
              .github/workflows/finalize-ch6-figure-audit.yml \
              .github/workflows/run-ch6-figure-audit.yml
            git diff --cached --check
            if git diff --cached --quiet; then
              final_sha=$(git rev-parse HEAD)
              echo "FINAL_SHA=$final_sha" >> "$GITHUB_ENV"
              success=true
              break
            fi
            git commit -m 'Correct continental shelf wave maximum'
            if git push origin HEAD:main; then
              final_sha=$(git rev-parse HEAD)
              echo "FINAL_SHA=$final_sha" >> "$GITHUB_ENV"
              success=true
              break
            fi
            echo 'main advanced before push; retrying from newest main'
          done
          test "$success" = true

      - name: Validate canonical publication build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 120); do
            run_id=$(gh run list --workflow publish.yml --commit "$FINAL_SHA" --event push --limit 10 \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 2
          done
          test -n "$run_id"
          echo "BUILD_RUN_ID=$run_id" >> "$GITHUB_ENV"
          gh run watch "$run_id" --exit-status

      - name: Record checkpoint on issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 9 --body "Chapter 6 p.159 integrated in \`$FINAL_SHA\` and canonical publication validation run \`$BUILD_RUN_ID\` passed. FIGURES.md is now 83 Validated / 6 Partial / 1 Pending / 15 N/A; only Ch.4 p.91 remains pending. Both temporary p.159 workflows deleted themselves in the source commit."
