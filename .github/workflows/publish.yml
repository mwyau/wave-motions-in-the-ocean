name: Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    concurrency:
      group: publish-build-${{ github.ref }}
      cancel-in-progress: false
    env:
      TINYTEX_VERSION: "2026.08"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Set up Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install "$(cat .python-version)"
          uv venv --python "$(cat .python-version)"
          uv pip sync requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install system tools
        env:
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            qpdf poppler-utils imagemagick ghostscript pandoc librsvg2-bin texinfo xz-utils

      - name: Cache TinyTeX
        id: tinytex-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.TinyTeX
          key: wave-motions-tinytex-2026.08-${{ runner.os }}-${{ hashFiles('tex-packages.txt') }}
          restore-keys: |
            wave-motions-tinytex-2026.08-${{ runner.os }}-

      - name: Cache build intermediates
        uses: actions/cache@v6.1.0
        with:
          path: .cache/wave-motions
          key: wave-motions-build-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            wave-motions-build-v2-${{ runner.os }}-

      - name: Detect restored TinyTeX
        id: tinytex-state
        shell: bash
        run: |
          if [ -d "$HOME/.TinyTeX/bin" ] && find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install TinyTeX if absent
        if: steps.tinytex-state.outputs.installed != 'true'
        uses: r-lib/actions/setup-tinytex@v2.12.1

      - name: Add TinyTeX to PATH
        shell: bash
        run: |
          set -euo pipefail
          TEXBIN=$(find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$TEXBIN"
          echo "$TEXBIN" >> "$GITHUB_PATH"
          echo "TEXBIN=$TEXBIN" >> "$GITHUB_ENV"

      - name: Install TeX dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TEXBIN:$PATH"
          tlmgr update --self
          mapfile -t PACKAGES < <(grep -Ev '^\s*(#|$)' tex-packages.txt)
          tlmgr install "${PACKAGES[@]}"

      - name: Build publication
        env:
          WAVE_SKIP_VALIDATION: "1"
        run: ./scripts/build.sh all

      - name: Check PDF integrity and pagination
        run: bash scripts/validate-publication.sh pdf-integrity

      - name: Check PDF destinations
        run: bash scripts/validate-publication.sh pdf-destinations

      - name: Check PDF text sentinels
        run: bash scripts/validate-publication.sh pdf-text

      - name: Render PDF smoke pages
        run: bash scripts/validate-publication.sh pdf-render

      - name: Verify publish root and downloads
        run: bash scripts/validate-publication.sh publish-root

      - name: Check build identity
        run: bash scripts/validate-publication.sh build-identity

      - name: Upload publication artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wave-motions-editions
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
