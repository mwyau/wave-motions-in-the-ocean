name: Publish

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
    paths:
      - "src/*.tex"
      - "src/*.bib"
      - "src/*.md"
      - "src/layout/**"
      - "src/figures/**"
      - "src/equations/**"
      - "src/images/**"
      - "references/chapman-rizzoli-1989/**"
      - "references/mit-ocw-2008/**"
      - "scripts/**"
      - "tests/**"
      - "Makefile"
      - ".python-version"
      - ".pre-commit-config.yaml"
      - "CITATION.cff"
      - "pyproject.toml"
      - "uv.lock"
      - "tex-packages.txt"
      - "README.md"
      - ".github/workflows/publish.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    concurrency:
      group: publish-build-${{ github.ref }}
      cancel-in-progress: false
    env:
      TINYTEX_VERSION: "2026.08"
      EPUBCHECK_VERSION: "5.3.0"
    outputs:
      pdf_artifact_id: ${{ steps.pdf_artifact.outputs.artifact-id }}
      epub_artifact_id: ${{ steps.epub_artifact.outputs.artifact-id }}
      html_artifact_id: ${{ steps.html_artifact.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release blocked: tag must be a stable semantic version such as v1.0.0; got $tag." >&2
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
          if [[ "$status" != "identical" && "$status" != "ahead" ]]; then
            echo "Release blocked: tag commit $GITHUB_SHA is not reachable from main (compare status: $status)." >&2
            exit 1
          fi
          echo "Release tag $tag points to a commit reachable from main ($status)."

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Cache prek environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/prek
          key: wave-motions-prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'pyproject.toml', 'uv.lock') }}
          restore-keys: |
            wave-motions-prek-${{ runner.os }}-

      - name: Install publication tools
        env:
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends qpdf poppler-utils pandoc
          curl -fL "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip" -o "$RUNNER_TEMP/epubcheck.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          EPUBCHECK_JAR="$RUNNER_TEMP/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar"
          test -s "$EPUBCHECK_JAR"
          echo "EPUBCHECK_JAR=$EPUBCHECK_JAR" >> "$GITHUB_ENV"
          java -jar "$EPUBCHECK_JAR" --version

      - name: Check sources and tests
        run: |
          uv sync --frozen
          make check

      - name: Cache TinyTeX
        id: tinytex_cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.TinyTeX
          key: wave-motions-tinytex-${{ env.TINYTEX_VERSION }}-${{ runner.os }}-${{ hashFiles('tex-packages.txt') }}

      - name: Install TinyTeX
        if: steps.tinytex_cache.outputs.cache-hit != 'true'
        uses: r-lib/actions/setup-tinytex@v2.13.0

      - name: Configure TinyTeX
        run: |
          TEXBIN=$(find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$TEXBIN"
          echo "$TEXBIN" >> "$GITHUB_PATH"
          if [[ "${{ steps.tinytex_cache.outputs.cache-hit }}" != "true" ]]; then
            "$TEXBIN/tlmgr" update --self
            grep -Ev '^\s*(#|$)' tex-packages.txt | xargs "$TEXBIN/tlmgr" install
          fi

      - name: Cache build intermediates
        uses: actions/cache@v6.1.0
        with:
          path: .cache/wave-motions
          key: wave-motions-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            wave-motions-build-${{ runner.os }}-

      - name: Run reference-style integration tests
        env:
          WAVE_REQUIRE_REFERENCE_TOOLS: "1"
        run: uv run --frozen python -m pytest -q tests/test_reference_style.py

      - name: Build publication
        run: make all

      - name: Validate publication
        run: uv run --frozen python scripts/validate.py all --require-epubcheck

      - name: Run publication QA
        env:
          QA_TARGET: ${{ startsWith(github.ref, 'refs/tags/v') && 'qa-release' || 'qa' }}
        run: make "$QA_TARGET"

      - name: Create HTML archive
        run: >-
          uv run --frozen python scripts/release.py archive
          --root release --output wave-motions-html.zip

      - name: Upload publication artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: wave-motions-publication
          path: release/
          retention-days: 14

      - name: Upload PDF artifact
        id: pdf_artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: release/wave-motions.pdf
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload proofread artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: release/wave-motions-facsimile.pdf
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload EPUB artifact
        id: epub_artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: release/wave-motions.epub
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload HTML artifact
        id: html_artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: wave-motions-html.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
        with:
          artifact_name: wave-motions-publication

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-26.04
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.pdf_artifact_id }},${{ needs.build.outputs.epub_artifact_id }},${{ needs.build.outputs.html_artifact_id }}
          path: artifact
          merge-multiple: true
          skip-decompress: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s artifact/wave-motions.pdf
          test -s artifact/wave-motions.epub
          test -s artifact/wave-motions-html.zip
          gh release create "$GITHUB_REF_NAME" \
            artifact/wave-motions-html.zip \
            artifact/wave-motions.pdf \
            artifact/wave-motions.epub \
            --verify-tag --generate-notes
