name: Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

# Keep production publishing linear. Pull-request refs use separate groups.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      TINYTEX_VERSION: "2026.08"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply audited errata cleanup
        if: github.event_name == 'push' && github.event.head_commit.message == 'Run errata cleanup through publish'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Recover the reviewed patch script from the temporary v2 workflow. The v2
          # failure was only a physical line-break mismatch in the p.129 source text.
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/finish-errata-tail-v2.yml').read_text()
          marker = "cat > /tmp/apply_errata_tail.py <<'PY'\n"
          script = workflow.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          Path('/tmp/apply_errata_tail.py').write_text(textwrap.dedent(script))
          PY

          success=false
          for attempt in $(seq 1 20); do
            git fetch origin main
            first=$(git rev-parse origin/main)
            sleep 3
            git fetch origin main
            second=$(git rev-parse origin/main)
            if [ "$first" != "$second" ]; then
              echo "main moved during quiet check; retrying"
              continue
            fi

            git reset --hard "$second"

            python3 - <<'PY'
          from pathlib import Path
          p = Path('reconstruction/chapter5.tex')
          text = p.read_text()
          old = "If $\\ell=0$, then\n$\\sigma=-\\beta/k$ and $c=\\sigma/k=-\\beta/k^2$."
          new = "If $\\ell=0$, then $\\sigma=-\\beta/k$ and $c=\\sigma/k=-\\beta/k^2$."
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

            python3 /tmp/apply_errata_tail.py
            python3 scripts/sync-views.py --readme
            python3 scripts/sync-views.py --check-readme
            git diff --check

            # Restore the canonical Publish workflow from the parent of the temporary
            # workflow-changing commit, then remove all transient errata machinery.
            publish_change=$(git log -1 --format=%H -- .github/workflows/publish.yml)
            git show "$publish_change^:.github/workflows/publish.yml" > .github/workflows/publish.yml
            rm -f \
              .github/workflows/errata-audit-corrections.yml \
              .github/workflows/finish-errata-tail.yml \
              .github/workflows/finish-errata-tail-v2.yml \
              .github/workflows/finish-errata-tail-v3.yml \
              .github/errata-tail.trigger \
              .github/errata-tail-v2.trigger \
              .github/errata-tail-v3.trigger \
              .github/errata-tail-publish.trigger

            git add -- \
              reconstruction/chapter4.tex \
              reconstruction/chapter5.tex \
              reconstruction/ERRATA.md \
              reconstruction/FIGURES.md \
              reconstruction/PLAN.md \
              README.md \
              .github/workflows/publish.yml \
              .github/workflows/errata-audit-corrections.yml \
              .github/workflows/finish-errata-tail.yml \
              .github/workflows/finish-errata-tail-v2.yml \
              .github/workflows/finish-errata-tail-v3.yml \
              .github/errata-tail.trigger \
              .github/errata-tail-v2.trigger \
              .github/errata-tail-v3.trigger \
              .github/errata-tail-publish.trigger
            git diff --cached --check
            git commit -m "Resolve audited source errata"

            if git push origin HEAD:main; then
              success=true
              break
            fi
            echo "main advanced before cleanup push; retrying from newest main"
          done
          test "$success" = true
          git push origin --delete __invalid_unused || true

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Set up Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install "$(cat .python-version)"
          uv venv --python "$(cat .python-version)"
          uv pip sync requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install system tools
        env:
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            qpdf poppler-utils imagemagick ghostscript pandoc librsvg2-bin texinfo xz-utils

      - name: Cache TinyTeX
        id: tinytex-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.TinyTeX
          key: wave-motions-tinytex-2026.08-${{ runner.os }}-${{ hashFiles('tex-packages.txt') }}
          restore-keys: |
            wave-motions-tinytex-2026.08-${{ runner.os }}-

      - name: Cache build intermediates
        uses: actions/cache@v6.1.0
        with:
          path: .cache/wave-motions
          key: wave-motions-build-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            wave-motions-build-v2-${{ runner.os }}-

      - name: Detect restored TinyTeX
        id: tinytex-state
        shell: bash
        run: |
          if [ -d "$HOME/.TinyTeX/bin" ] && find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install TinyTeX if absent
        if: steps.tinytex-state.outputs.installed != 'true'
        uses: r-lib/actions/setup-tinytex@v2.12.1

      - name: Add TinyTeX to PATH
        shell: bash
        run: |
          set -euo pipefail
          TEXBIN=$(find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$TEXBIN"
          echo "$TEXBIN" >> "$GITHUB_PATH"
          echo "TEXBIN=$TEXBIN" >> "$GITHUB_ENV"

      - name: Install TeX dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TEXBIN:$PATH"
          tlmgr update --self
          mapfile -t PACKAGES < <(grep -Ev '^\s*(#|$)' tex-packages.txt)
          tlmgr install "${PACKAGES[@]}"

      - name: Build and validate publication
        run: ./scripts/build.sh all

      - name: Verify publish root and downloads
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/wave-motions.pdf
          test -s dist/wave-motions-facsimile.pdf
          test -s dist/wave-motions.epub
          grep -q 'wave-motions.pdf' dist/index.html
          grep -q 'wave-motions-facsimile.pdf' dist/index.html
          grep -q 'wave-motions.epub' dist/index.html
          test ! -e dist/html

      - name: Upload publication artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wave-motions-editions
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
