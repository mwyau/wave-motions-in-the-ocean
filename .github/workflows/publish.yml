name: Publish

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
    paths:
      - "src/*.tex"
      - "src/*.bib"
      - "src/styles/**"
      - "src/figures/**"
      - "references/chapman-rizzoli-1989/**"
      - "references/mit-ocw-2008/**"
      - "scripts/**"
      - ".python-version"
      - ".pre-commit-config.yaml"
      - "requirements.txt"
      - "tex-packages.txt"
      - "README.md"
      - ".github/workflows/publish.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    concurrency:
      group: publish-build-${{ github.ref }}
      cancel-in-progress: false
    env:
      TINYTEX_VERSION: "2026.08"
      EPUBCHECK_VERSION: "5.3.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release blocked: tag must be a stable semantic version such as v1.0.0; got $tag." >&2
            exit 1
          fi

          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)
          case "$status" in
            identical|ahead)
              echo "Release tag $tag points to a commit reachable from main ($status)."
              ;;
            *)
              echo "Release blocked: tag commit $GITHUB_SHA is not reachable from main (compare status: $status)." >&2
              exit 1
              ;;
          esac

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Set up Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install "$(cat .python-version)"
          uv venv --python "$(cat .python-version)"
          uv pip sync requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install system tools
        env:
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            qpdf poppler-utils pandoc unzip xz-utils

      - name: Cache TinyTeX
        id: tinytex-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.TinyTeX
          key: wave-motions-tinytex-2026.08-${{ runner.os }}-${{ hashFiles('tex-packages.txt') }}
          restore-keys: |
            wave-motions-tinytex-2026.08-${{ runner.os }}-

      - name: Cache build intermediates
        uses: actions/cache@v6.1.0
        with:
          path: .cache/wave-motions
          key: wave-motions-build-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            wave-motions-build-v2-${{ runner.os }}-

      - name: Detect restored TinyTeX
        id: tinytex-state
        shell: bash
        run: |
          if [ -d "$HOME/.TinyTeX/bin" ] && find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install TinyTeX if absent
        if: steps.tinytex-state.outputs.installed != 'true'
        uses: r-lib/actions/setup-tinytex@v2.12.1

      - name: Add TinyTeX to PATH
        shell: bash
        run: |
          set -euo pipefail
          TEXBIN=$(find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$TEXBIN"
          echo "$TEXBIN" >> "$GITHUB_PATH"
          echo "TEXBIN=$TEXBIN" >> "$GITHUB_ENV"

      - name: Install TeX dependencies
        if: steps.tinytex-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TEXBIN:$PATH"
          tlmgr update --self
          mapfile -t PACKAGES < <(grep -Ev '^\s*(#|$)' tex-packages.txt)
          tlmgr install "${PACKAGES[@]}"

      - name: Build publication
        env:
          WAVE_SKIP_VALIDATION: "1"
        run: ./scripts/build.sh all

      - name: Install EPUBCheck
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          command -v java >/dev/null
          command -v curl >/dev/null
          curl -fL \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip" \
            -o "$RUNNER_TEMP/epubcheck.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          EPUBCHECK_JAR="$RUNNER_TEMP/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar"
          test -s "$EPUBCHECK_JAR"
          echo "EPUBCHECK_JAR=$EPUBCHECK_JAR" >> "$GITHUB_ENV"
          java -jar "$EPUBCHECK_JAR" --version

      - name: Validate publication
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python3 scripts/validate.py all --require-epubcheck

      - name: Check release gate
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/validate.py release

      - name: Package public edition
        run: python3 scripts/release.py package --dist dist --output release

      - name: Check source quality
        continue-on-error: true
        shell: bash
        run: |
          set +e
          status=0
          prek run --all-files || status=1
          node --check src/styles/wave-html.js || status=1
          if ! git diff --quiet; then
            echo "::warning title=Source quality::Quality hooks changed tracked files; commit their fixes."
            git diff --check || true
            status=1
          fi
          exit "$status"

      - name: Upload publication artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wave-motions-publication
          path: |
            release/
            dist/wave-motions-facsimile.pdf
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0

      - name: Prepare packaged edition for Pages
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-dist
          mkdir pages-dist
          unzip -q release/wave-motions-html.zip -d pages-dist

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: pages-dist/

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-26.04
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7.0.1

      - name: Download validated publication
        uses: actions/download-artifact@v8.0.1
        with:
          name: wave-motions-publication
          path: artifact

      - name: Verify release assets
        run: >-
          python3 scripts/release.py checksums --root artifact/release --check
          wave-motions.pdf wave-motions.epub wave-motions-html.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifact/release/* --verify-tag --generate-notes
