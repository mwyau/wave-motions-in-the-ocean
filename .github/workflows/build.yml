name: Build editions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache TinyTeX
        id: tinytex-cache
        uses: actions/cache@v5
        with:
          path: ~/.TinyTeX
          key: wave-motions-tinytex-${{ runner.os }}-${{ hashFiles('tex-packages.txt') }}
          restore-keys: |
            wave-motions-tinytex-${{ runner.os }}-

      - name: Cache build intermediates
        uses: actions/cache@v5
        with:
          path: .cache/wave-motions
          key: wave-motions-build-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            wave-motions-build-v2-${{ runner.os }}-

      - name: Detect restored TinyTeX
        id: tinytex-state
        shell: bash
        run: |
          if [ -d "$HOME/.TinyTeX/bin" ] && find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install TinyTeX if absent
        if: steps.tinytex-state.outputs.installed != 'true'
        uses: r-lib/actions/setup-tinytex@v2

      - name: Add TinyTeX to PATH
        shell: bash
        run: |
          set -euo pipefail
          TEXBIN=$(find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$TEXBIN"
          echo "$TEXBIN" >> "$GITHUB_PATH"
          echo "TEXBIN=$TEXBIN" >> "$GITHUB_ENV"

      - name: Install TeX dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TEXBIN:$PATH"
          mapfile -t PACKAGES < <(grep -Ev '^\s*(#|$)' tex-packages.txt)
          tlmgr install "${PACKAGES[@]}"

      - name: Install system validation tools
        env:
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            qpdf poppler-utils imagemagick ghostscript python3-pil pandoc librsvg2-bin

      - name: Build and validate
        run: ./scripts/build.sh all

      - name: Verify EPUB output
        run: test -s dist/wave-motions.epub

      - name: Upload PDFs, EPUB, and HTML
        uses: actions/upload-artifact@v6
        with:
          name: wave-motions-editions
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
