# One-time runner. This file and the prepared audit workflow delete themselves.
name: Run figure source-crop audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/figure-source-crop-audit-run.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-26.04
    env:
      TINYTEX_VERSION: "2026.08"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Set up Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install "$(cat .python-version)"
          uv venv --python "$(cat .python-version)"
          uv pip sync requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Apply prepared figure audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/figure-source-crop-audit.yml')
          text = workflow.read_text()
          opener = "          python3 - <<'PY'\n"
          closer = "\n          PY\n          git diff --check"
          start = text.index(opener) + len(opener)
          end = text.index(closer, start)
          code = text[start:end]
          # The embedded code is indented for YAML's block scalar. Normalize that
          # indentation before executing the already-prepared, reviewed audit plan.
          lines = code.splitlines()
          nonblank = [len(line) - len(line.lstrip()) for line in lines if line.strip()]
          indent = min(nonblank)
          code = "\n".join(line[indent:] if line.strip() else "" for line in lines) + "\n"
          exec(compile(code, str(workflow), 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/figure-source-crop-audit-run.yml').unlink()
          PY
          git diff --check

      - name: Cache TinyTeX
        id: tinytex-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.TinyTeX
          key: wave-motions-tinytex-2026.08-${{ runner.os }}-${{ hashFiles('tex-packages.txt') }}
          restore-keys: |
            wave-motions-tinytex-2026.08-${{ runner.os }}-

      - name: Detect restored TinyTeX
        id: tinytex-state
        shell: bash
        run: |
          if [ -d "$HOME/.TinyTeX/bin" ] && find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install TinyTeX if absent
        if: steps.tinytex-state.outputs.installed != 'true'
        uses: r-lib/actions/setup-tinytex@v2.12.1

      - name: Add TinyTeX to PATH
        shell: bash
        run: |
          set -euo pipefail
          TEXBIN=$(find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$TEXBIN"
          echo "$TEXBIN" >> "$GITHUB_PATH"
          echo "TEXBIN=$TEXBIN" >> "$GITHUB_ENV"

      - name: Install TeX and validation dependencies
        shell: bash
        env:
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail
          export PATH="$TEXBIN:$PATH"
          mapfile -t PACKAGES < <(grep -Ev '^\s*(#|$)' tex-packages.txt)
          tlmgr install "${PACKAGES[@]}"
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            qpdf poppler-utils imagemagick ghostscript pandoc librsvg2-bin

      - name: Compare source art with replacements
        shell: bash
        run: |
          set -euo pipefail
          for stem in \
            ch04-p069-nonrotating-transverse \
            ch04-p070-rotating-transverse \
            ch04-p072-phase-energy-theta \
            ch04-p072-phase-energy-phi \
            ch04-p073-rotation-only-limits \
            ch04-p074-stratification-only-limits \
            ch04-p075-rotation-stratification-limits \
            ch04-p076-waveguide-boundary-problem \
            ch05-p124-amphidromic-pattern \
            ch05-p126-kelvin-turning-corner; do
            python3 scripts/compare-figures.py "$stem" --dpi 180
          done

      - name: Build and validate all editions
        run: ./scripts/build.sh all

      - name: Commit audited figure batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            reconstruction/chapter4.tex \
            reconstruction/FIGURES.md \
            reconstruction/figures/ch04-p069-nonrotating-transverse.tikz \
            reconstruction/figures/ch04-p070-rotating-transverse.tikz \
            reconstruction/figures/ch04-p072-phase-energy-theta.tikz \
            reconstruction/figures/ch04-p072-phase-energy-phi.tikz \
            reconstruction/figures/ch04-p073-rotation-only-limits.tikz \
            reconstruction/figures/ch04-p074-stratification-only-limits.tikz \
            reconstruction/figures/ch04-p075-rotation-stratification-limits.tikz \
            reconstruction/figures/ch04-p076-waveguide-boundary-problem.tikz \
            .github/workflows/figure-source-crop-audit.yml \
            .github/workflows/figure-source-crop-audit-run.yml
          git commit -m "Audit retained source art and vector candidates"
          git pull --rebase origin main
          git push origin HEAD:main
