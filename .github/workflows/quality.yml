name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precommit:
    name: Pre-commit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Run pre-commit hooks
        run: uvx --from pre-commit==4.6.1 pre-commit run --all-files --show-diff-on-failure
