name: Audit numbering candidates

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: github.event.head_commit.message == 'Audit numbering candidates'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Classify durable equations and figure placements
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/numbering-report.md
          from pathlib import Path
          import re

          root = Path('reconstruction')
          display_re = re.compile(
              r'(?P<bracket>\\\[(?P<bracket_body>.*?)\\\])'
              r'|(?P<align>\\begin\{align\*\}(?P<align_body>.*?)\\end\{align\*\})',
              re.S,
          )
          durable_intro = (
              'dispersion relation', 'field equation', 'wave equation', 'vorticity equation',
              'continuity equation', 'equations of motion', 'governing equation',
              'governing equations', 'boundary condition', 'boundary conditions',
              'eigenvalue problem', 'orthogonality relation', 'conservation law',
              'conservation equation', 'phase speed', 'group velocity', 'wave action',
              'energy density', 'energy flux', 'radiation condition', 'snell',
              'matching relation', 'root condition', 'ray equation', 'ray equations',
          )
          durable_after = (
              'this is the dispersion relation', 'is the dispersion relation',
              'this is the wave equation', 'is the wave equation',
              'is the boundary condition', 'are the boundary conditions',
              'is an eigenvalue problem', 'is the orthogonality relation',
              'will be used later', 'will be used to',
          )
          definition_intro = (
              'we define', 'is defined as', 'are defined as', 'defined by',
              'we introduce', 'we write the definition',
          )

          def normalize(text: str) -> str:
              text = re.sub(r'%.*?(?:\n|$)', ' ', text)
              return re.sub(r'\s+', ' ', text).strip().lower()

          def immediate_before(text: str, pos: int) -> str:
              # Restrict the semantic trigger to the immediate prose clause. Do not let a
              # keyword from an earlier equation carry forward into later algebra.
              chunk = normalize(text[max(0, pos-300):pos])
              cuts = [chunk.rfind(mark) for mark in ('. ', '? ', '! ')]
              cut = max(cuts)
              if cut >= 0:
                  chunk = chunk[cut+2:]
              return chunk[-220:]

          def compact(body: str) -> str:
              body = re.sub(r'\s+', ' ', body).strip()
              body = body.replace('\\qquad', ' ').replace('\\;', ' ')
              return body[:110] + ('…' if len(body) > 110 else '')

          def classify(text: str, matches: list[re.Match[str]]) -> list[bool]:
              chosen: list[bool] = []
              for m in matches:
                  intro = immediate_before(text, m.start())
                  after = normalize(text[m.end():m.end()+180])
                  body = m.group('bracket_body') if m.group('bracket') else m.group('align_body')
                  use = False
                  if '\\boxed' in body:
                      use = True
                  if any(phrase in intro for phrase in durable_intro):
                      use = True
                  if any(phrase in after for phrase in durable_after):
                      use = True
                  if any(phrase in intro for phrase in definition_intro) and len(normalize(body)) <= 320:
                      use = True
                  if m.group('align') and re.search(
                      r'\b(equations?|conditions?|system)\b.{0,55}\b(are|become|reduce|becomes|is)\b',
                      intro,
                  ):
                      use = True
                  chosen.append(use)

              # A compact list of separately displayed boundary/eigen conditions belongs to
              # the same durable result. Propagate only across conjunction-sized prose gaps.
              for i in range(1, len(matches)):
                  gap = normalize(text[matches[i-1].end():matches[i].start()])
                  if chosen[i-1] and gap in ('', 'and', 'or', 'with', 'where', 'while'):
                      chosen[i] = True
              return chosen

          print('# Numbering candidate dry run — sparse rule')
          print()
          print('Policy: number durable results identified by the immediate introducing clause; do not carry keywords through later algebra.')
          print()
          total_eq = total_selected = total_fig = 0
          for chapter in range(1, 7):
              path = root / f'chapter{chapter}.tex'
              text = path.read_text()
              matches = list(display_re.finditer(text))
              selected = classify(text, matches)
              eq_count = len(matches)
              sel_count = sum(selected)
              total_eq += eq_count
              total_selected += sel_count

              figure_patterns = {
                  'wavevectorart': r'\\wavevectorart(?:\[[^]]+\])?\{[^}]+\}',
                  'sourceart': r'\\sourceart(?:\[[^]]+\])?\{[^}]+\}\{\d+\}\{[^}]+\}',
                  'raw-tikz': r'\\input\{figures/[^}]+\.tikz\}',
                  'raster': r'\\includegraphics(?:\[[^]]*\])?\s*\{figures/[^}]+\.(?:png|jpe?g)\}',
                  'direct-source': r'\\includegraphics\[[^]]*page=\d+[^]]*\]\s*\{\.\./source/[^}]+\}',
              }
              fig_counts = {name: len(re.findall(pattern, text, re.I | re.S)) for name, pattern in figure_patterns.items()}
              fig_count = sum(fig_counts.values())
              total_fig += fig_count

              print(f'## Chapter {chapter}: {sel_count} numbered candidates / {eq_count} display blocks; {fig_count} figure placements')
              print()
              print('Figure placement mix: ' + ', '.join(f'{k}={v}' for k, v in fig_counts.items()))
              print()
              for m, use in zip(matches, selected):
                  if not use:
                      continue
                  body = m.group('bracket_body') if m.group('bracket') else m.group('align_body')
                  page_before = text[:m.start()]
                  page_matches = list(re.finditer(r'Source printed page\s+(\d+)', page_before))
                  page = page_matches[-1].group(1) if page_matches else '?'
                  kind = 'system' if m.group('align') else 'display'
                  print(f'- p.{page} [{kind}] `{compact(body)}`')
              print()

          print(f'**Totals:** {total_selected} numbered candidates / {total_eq} display blocks; {total_fig} figure placements.')
          PY
          gh issue comment 14 --body-file /tmp/numbering-report.md
