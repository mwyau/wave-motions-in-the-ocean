name: Repair errata heading

on:
  push:
    branches: [main]
    paths: ['.github/errata-heading.trigger']

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run errata heading repair'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wave-motions-science-audit'
          git config user.email '5298134+mwyau@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('reconstruction/ERRATA.md')
          s=p.read_text()
          needle='\n### Printed page 19 — adiabatic entropy derivative\n'
          if s.count(needle) != 1:
              raise SystemExit('unexpected Chapter 2 first-entry count')
          if '\n## Chapter 2\n\n### Printed page 19 — adiabatic entropy derivative\n' not in s:
              s=s.replace(needle, '\n## Chapter 2\n'+needle, 1)
          p.write_text(s)
          PY
          grep -Fq '## Chapter 2' reconstruction/ERRATA.md
          rm -f .github/errata-heading.trigger .github/workflows/repair-errata-heading.yml
          git diff --check
          git add -- reconstruction/ERRATA.md .github/errata-heading.trigger .github/workflows/repair-errata-heading.yml
          git commit -m 'Restore Chapter 2 errata heading'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
