name: Verify source figure publication

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: verify-source-figure-publication
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.head_commit.message == 'Run final figure publication validation'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch and verify canonical Publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          success=false
          for attempt in $(seq 1 12); do
            # Wait for main to be unchanged for ten seconds before dispatching.
            while true; do
              a=$(git ls-remote origin refs/heads/main | awk '{print $1}')
              sleep 10
              b=$(git ls-remote origin refs/heads/main | awk '{print $1}')
              [ "$a" = "$b" ] && break
              echo 'main moved while settling; waiting again'
            done

            gh workflow run publish.yml --ref main
            sleep 3
            run_id=$(gh run list --workflow publish.yml --branch main --event workflow_dispatch --limit 1 \
              --json databaseId --jq '.[0].databaseId')
            test -n "$run_id"
            echo "Publish validation attempt $attempt: $run_id"

            if gh run watch "$run_id" --exit-status; then
              success=true
              break
            fi

            conclusion=$(gh run view "$run_id" --json conclusion --jq '.conclusion')
            if [ "$conclusion" = 'cancelled' ]; then
              echo 'Publish run was canceled by a newer main push; retrying'
              continue
            fi
            echo "Publish validation failed with conclusion: $conclusion"
            exit 1
          done
          test "$success" = true

      - name: Remove verifier and close coordination issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          success=false
          for attempt in $(seq 1 20); do
            git fetch origin main
            git reset --hard origin/main
            rm -f .github/workflows/verify-vectorization-publication.yml .github/verify-vectorization-publication.trigger
            git add -A
            if git diff --cached --quiet; then
              success=true
              break
            fi
            git commit -m 'Remove figure publication validation helper'
            if git push origin HEAD:main; then
              success=true
              break
            fi
          done
          test "$success" = true
          gh issue comment 6 --body 'Source-figure vectorization integrated in ec0292d6 and e6a61cb0. Canonical Publish workflow validation completed successfully; temporary vectorization automation removed.'
          gh issue close 6 --reason completed
