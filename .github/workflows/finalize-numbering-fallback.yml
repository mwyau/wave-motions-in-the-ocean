name: Finalize manual equation numbering fallback

on:
  push:
    branches: [main]
    paths:
      - ".github/issue14-numbering-fallback.trigger"
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'Run equation numbering fallback') ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 14 && github.event.comment.body == '/run-equation-numbering-fallback')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out newest main
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Set up Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install "$(cat .python-version)"
          uv venv --python "$(cat .python-version)"
          uv pip sync requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install publication tools
        env:
          NEEDRESTART_MODE: a
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils pandoc xz-utils

      - name: Cache TinyTeX
        id: tinytex-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.TinyTeX
          key: wave-motions-tinytex-2026.08-${{ runner.os }}-${{ hashFiles('tex-packages.txt') }}
          restore-keys: |
            wave-motions-tinytex-2026.08-${{ runner.os }}-

      - name: Detect TinyTeX
        id: tinytex-state
        shell: bash
        run: |
          if [ -d "$HOME/.TinyTeX/bin" ] && find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install TinyTeX if absent
        if: steps.tinytex-state.outputs.installed != 'true'
        uses: r-lib/actions/setup-tinytex@v2.12.1

      - name: Add TinyTeX to PATH
        shell: bash
        run: |
          set -euo pipefail
          TEXBIN=$(find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$TEXBIN"
          echo "$TEXBIN" >> "$GITHUB_PATH"
          echo "TEXBIN=$TEXBIN" >> "$GITHUB_ENV"

      - name: Install TeX dependencies
        if: steps.tinytex-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TEXBIN:$PATH"
          tlmgr update --self
          mapfile -t PACKAGES < <(grep -Ev '^\s*(#|$)' tex-packages.txt)
          tlmgr install "${PACKAGES[@]}"

      - name: Apply reviewed manual manifest and p159 result
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          root = Path('.')
          legacy = root / '.github/workflows/finalize-manual-numbering.yml'
          build_html = root / 'scripts/build-html.py'
          validate_math = root / 'scripts/validate-math.py'

          # Reuse the already reviewed, fail-closed manifest rather than duplicate it.
          # If the first finalizer happened to land during this fallback run, verify
          # its pipeline changes are present and only apply the remaining p.159 step.
          if legacy.exists():
              text = legacy.read_text()
              start_marker = "          python3 - <<'PY'\n"
              end_marker = "\n          PY\n"
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit('could not find reviewed migration script start')
              start += len(start_marker)
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit('could not find reviewed migration script end')
              lines = text[start:end].splitlines()
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
              tmp = Path('/tmp/issue14-reviewed-migration.py')
              tmp.write_text(script)
              subprocess.run([sys.executable, str(tmp)], check=True)
          else:
              if 'NATIVE_TAGGED_EQUATION_RE' not in build_html.read_text():
                  raise SystemExit('reviewed numbering migration is neither available nor integrated')
              if 'NATIVE_TAG_RE' not in validate_math.read_text():
                  raise SystemExit('canonical equation identity validation is not integrated')

          chapter6 = root / 'reconstruction/chapter6.tex'
          text = chapter6.read_text()
          body = r' k^2+b^2-\ell^2=2\ell k\frac{dk_n}{d\ell}.'
          plain = '\\[\n' + body + '\n\\]'
          wrapped = '\\begin{waveequation}\n' + body + '\n\\end{waveequation}'
          if plain in text:
              if text.count(plain) != 1:
                  raise SystemExit('p159 corrected branch-extremum display is not unique')
              text = text.replace(plain, wrapped, 1)
              chapter6.write_text(text)
          elif wrapped not in text:
              raise SystemExit('p159 corrected branch-extremum relation not found')

          expected = {1: 0, 2: 9, 3: 7, 4: 7, 5: 27, 6: 14}
          for chapter, count in expected.items():
              source = (root / f'reconstruction/chapter{chapter}.tex').read_text()
              actual = source.count(r'\begin{waveequation}') + source.count(r'\begin{wavealign}')
              if actual != count:
                  raise SystemExit(f'chapter {chapter}: expected {count} editorial wrappers, found {actual}')
          native = re.findall(r'\\tag\{(1\.[123])\}', (root / 'reconstruction/chapter1.tex').read_text())
          if native != ['1.1', '1.2', '1.3']:
              raise SystemExit(f'chapter 1 historical tags changed: {native}')
          PY
          python3 scripts/sync-views.py --readme
          python3 scripts/sync-views.py --check-readme
          python3 -m py_compile scripts/build-html.py scripts/validate-math.py
          git diff --check

      - name: Build and validate all editions
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build.sh all
          python3 scripts/validate-math.py
          python3 scripts/sync-views.py --check-readme

      - name: Commit and remove issue 14 automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch -- \
            .github/workflows/finalize-manual-numbering.yml \
            .github/issue14-numbering.trigger \
            .github/workflows/finalize-numbering-fallback.yml \
            .github/issue14-numbering-fallback.trigger
          git add -- \
            reconstruction/chapter1.tex reconstruction/chapter2.tex \
            reconstruction/chapter3.tex reconstruction/chapter4.tex \
            reconstruction/chapter5.tex reconstruction/chapter6.tex \
            scripts/build-html.py scripts/validate-math.py README.md
          git diff --cached --check
          git commit -m "Finalize manual equation numbering"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "main changed in overlapping files; refusing to race concurrent work" >&2
            exit 1
          fi
          git push origin HEAD:main
