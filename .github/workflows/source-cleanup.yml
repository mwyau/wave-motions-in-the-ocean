# One-time workflow; this workflow deletes itself after the reconciliation commit.
name: One-time errata reconciliation

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.issue.title == '[internal] one-time source cleanup'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Reconcile accepted errata with canonical TeX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "reconstruction/chapter1.tex",
              """For cases (a)--(d), the phase speed $c=\\sigma/|\\vec{k}|$ is independent of wavelength,
frequency or direction. Such waves are nondispersive or dispersionless because all waves
(for each case individually) travel with the same speed. In case (e), the phase speed $c$
is dependent upon the wavelength and the direction, so these waves are dispersive.""",
              """For cases (a), (b), and (d), the phase speed $c=\\sigma/|\\vec{k}|$ is independent
of wavelength, frequency or direction. In case (c),
$c=\\vec c_0\\cdot\\hat{\\vec k}$, so the phase speed is independent of wavelength and
frequency but depends on propagation direction relative to $\\vec c_0$. For any fixed
propagation direction, cases (a)--(d) are nondispersive with respect to wavenumber
magnitude. In case (e), the phase speed $c$ is dependent upon the wavelength and the
direction, so these waves are dispersive.""",
          )

          replace_once(
              "reconstruction/chapter4.tex",
              """After some algebra, the result is
\\[
 |\\vec k_r|=|\\vec k_i|\\left(\\frac{1+aR}{1-aR}\\right)
\\]
\\[
 m_r=\\pm m_i\\left(\\frac{1+aR}{1-aR}\\right)
 \\left(\\frac{R+a}{R-a}\\right)
\\]
where the signs have been taken from the sketch. This gives the new wavenumbers in
terms of the old ones.""",
              """After some algebra, the result is
\\[
 |\\vec k_r|=|\\vec k_i|\\left(\\frac{1+aR}{1-aR}\\right).
\\]
The incident and reflected wavenumbers lie on the two characteristic directions
$m_i=Rk_i$ and $m_r=-Rk_r$, so this also gives
\\[
 m_r=-m_i\\left(\\frac{1+aR}{1-aR}\\right).
\\]
The typeset source includes an additional factor $(R+a)/(R-a)$ in the expression for
$m_r$; that factor is inconsistent with the characteristic directions above and is
recorded in \\texttt{ERRATA.md}. This gives the new wavenumbers in terms of the old
ones.""",
          )

          replace_once(
              "reconstruction/chapter5.tex",
              "results in a sequence of free frequencies $\\sigma_1^2,\\sigma_2^2,\\sigma_3^2,\\ldots$",
              "results in a sequence of squared free frequencies $\\sigma_1^2,\\sigma_2^2,\\sigma_3^2,\\ldots$",
          )

          replace_once(
              "reconstruction/chapter5.tex",
              "Thus, in a westward propagating wave,\n\\[",
              "Thus, in a westward propagating wave with $\\ell=0$,\n\\[",
          )

          # This workflow was temporary; remove it in the same source commit.
          Path(".github/workflows/source-cleanup.yml").unlink()
          PY

          git diff --check
          grep -Fq 'case (c),' reconstruction/chapter1.tex
          grep -Fq 'm_r=-m_i' reconstruction/chapter4.tex
          grep -Fq 'squared free frequencies' reconstruction/chapter5.tex
          grep -Fq 'wave with $\ell=0$' reconstruction/chapter5.tex

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstruction/chapter1.tex reconstruction/chapter4.tex reconstruction/chapter5.tex .github/workflows/source-cleanup.yml
          git commit -m "Reconcile accepted errata with canonical TeX"
          git pull --rebase origin main
          git push origin HEAD:main
