# One-time workflow; remove after the cleanup commit lands.
name: One-time source cleanup

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.issue.title == '[internal] one-time source cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize errata and source comments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("reconstruction")
          errata_path = root / "ERRATA.md"
          errata = errata_path.read_text()
          migrated_heading = "## Migrated audit notes still requiring explicit schema normalization"

          if migrated_heading in errata:
              errata = errata.split(migrated_heading, 1)[0].rstrip() + "\n"
              entries = {
                  "## Chapter 2\n\n": r'''### Printed page 19 - adiabatic entropy derivative

- **Category:** `equation`
- **Status:** `accepted`
- **Location:** Chapter 2, printed page 19
- **Original:** $\partial S/\partial t=0$
- **Reconstruction:** $DS/Dt=0$
- **Reason/evidence:** The motions are described as adiabatic and the immediately following thermodynamic relations are written with material derivatives. Entropy conservation for a moving parcel is therefore $DS/Dt=0$, not a zero local time derivative at a fixed point.

### Printed page 19 - "infinitesmal"

- **Category:** `typographical`
- **Status:** `accepted`
- **Location:** Chapter 2, printed page 19
- **Original:** "infinitesmal"
- **Reconstruction:** "infinitesimal"
- **Reason/evidence:** Straightforward spelling correction; no scientific meaning is changed.

''',
                  "## Chapter 3\n\n": r'''### Printed page 54 - shorthand late-time envelope

- **Category:** `editorial`
- **Status:** `accepted`
- **Location:** Chapter 3, printed page 54
- **Original:** $\eta(x,t\to\infty)=t$
- **Reconstruction:** The late-time envelope is stated as $O(t)$ growth rather than as a literal equality to $t$.
- **Reason/evidence:** The source notation is dimensional shorthand for the asymptotic envelope scaling. Writing the growth as $O(t)$ preserves that intended statement without asserting the dimensionally incomplete equality $\eta=t$.

''',
                  "## Chapter 4\n\n": r'''### Printed page 68 - "f-plane approrimation"

- **Category:** `typographical`
- **Status:** `accepted`
- **Location:** Chapter 4, printed page 68
- **Original:** "f-plane approrimation"
- **Reconstruction:** "f-plane approximation"
- **Reason/evidence:** Straightforward spelling correction; no scientific meaning is changed.

### Printed page 86 - pressure derivative transcription

- **Category:** `transcription`
- **Status:** `accepted`
- **Location:** Chapter 4, printed page 86
- **Original:** A previous reconstruction read $w_{xtt}$.
- **Reconstruction:** $\rho_0 w_{zt}=p_{xx}$
- **Reason/evidence:** Reinspection of the high-resolution historical scan shows $\rho_0 w_{zt}=p_{xx}$. The earlier $w_{xtt}$ reading was a transcription error, not a source erratum.

''',
                  "## Chapter 5\n\n": r'''### Printed page 102 - "Bousinesq"

- **Category:** `typographical`
- **Status:** `accepted`
- **Location:** Chapter 5, printed page 102
- **Original:** "Bousinesq"
- **Reconstruction:** "Boussinesq"
- **Reason/evidence:** Straightforward spelling correction of the standard Boussinesq approximation name; no scientific meaning is changed.

''',
              }
              for anchor, addition in entries.items():
                  if anchor in errata:
                      errata = errata.replace(anchor, anchor + addition, 1)
              errata_path.write_text(errata)

          merged_block = re.compile(
              r"(?m)^% ===== merged from [^\n]+ =====\n(?:%[^\n]*\n)+\n"
          )
          stale_comment = re.compile(
              r"merged from|chapter0[1-6]-p\d|CHAPTER\d+_AUDIT\.md|"
              r"FIGURE_AUDIT\.md|verification\.tsv|pre-merge",
              re.I,
          )
          source_map = {
              1: "ChapmanRizzoli0_2.pdf",
              2: "ChapmanRizzoli0_2.pdf",
              3: "ChapmanRizzoli3.pdf",
              4: "ChapmanRizzoli4.pdf",
              5: "ChapmanRizzoli5.pdf",
              6: "ChapmanRizzoli6.pdf",
          }

          for number in range(1, 7):
              path = root / f"chapter{number}.tex"
              text = path.read_text()
              authority = re.search(r"^% Source authority: ([^,\n]+\.pdf)", text, re.M)
              source_pdf = authority.group(1) if authority else source_map[number]
              text, removed = merged_block.subn("", text)
              text = "\n".join(
                  line for line in text.splitlines()
                  if not (line.lstrip().startswith("%") and stale_comment.search(line))
              ).lstrip("\n") + "\n"
              text = re.sub(
                  r"\A% Wave Motions in the Ocean: Myrl's [Vv]iew\n"
                  r"(?:%[^\n]*\n){0,6}\n?",
                  "",
                  text,
              )
              header = (
                  "% Wave Motions in the Ocean: Myrl's View\n"
                  f"% Chapter {number}; historical source: source/{source_pdf}.\n"
                  "% Source-page comments preserve printed/physical page correspondence.\n"
                  "% Substantive corrections are documented in ERRATA.md.\n\n"
              )
              path.write_text(header + text)
              print(f"{path}: removed {removed} obsolete fragment header(s)")
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstruction/ERRATA.md reconstruction/chapter*.tex
          if git diff --cached --quiet; then
            echo "No cleanup changes produced"
            exit 0
          fi
          git commit -m "Normalize errata and clean reconstruction comments"
          git push origin HEAD:main
