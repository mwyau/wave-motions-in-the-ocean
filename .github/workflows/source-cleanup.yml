# One-time workflow; this workflow deletes itself after the reconciliation commit.
name: One-time errata reconciliation

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.issue.title == '[internal] one-time source cleanup'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Reconcile accepted errata with canonical TeX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "reconstruction/chapter1.tex",
              """For cases (a)--(d), the phase speed $c=\\sigma/|\\vec{k}|$ is independent of wavelength,
frequency or direction. Such waves are nondispersive or dispersionless because all waves
(for each case individually) travel with the same speed. In case (e), the phase speed $c$
is dependent upon the wavelength and the direction, so these waves are dispersive.""",
              """For cases (a), (b), and (d), the phase speed $c=\\sigma/|\\vec{k}|$ is independent
of wavelength, frequency or direction. In case (c),
$c=\\vec c_0\\cdot\\hat{\\vec k}$, so the phase speed is independent of wavelength and
frequency but depends on propagation direction relative to $\\vec c_0$. For any fixed
propagation direction, cases (a)--(d) are nondispersive with respect to wavenumber
magnitude. In case (e), the phase speed $c$ is dependent upon the wavelength and the
direction, so these waves are dispersive.""",
          )

          replace_once(
              "reconstruction/chapter4.tex",
              """After some algebra, the result is
\\[
 |\\vec k_r|=|\\vec k_i|\\left(\\frac{1+aR}{1-aR}\\right)
\\]
\\[
 m_r=\\pm m_i\\left(\\frac{1+aR}{1-aR}\\right)
 \\left(\\frac{R+a}{R-a}\\right)
\\]
where the signs have been taken from the sketch. This gives the new wavenumbers in
terms of the old ones.""",
              """After some algebra, the result is
\\[
 |\\vec k_r|=|\\vec k_i|\\left(\\frac{1+aR}{1-aR}\\right).
\\]
The incident and reflected wavenumbers lie on the two characteristic directions
$m_i=Rk_i$ and $m_r=-Rk_r$, so this also gives
\\[
 m_r=-m_i\\left(\\frac{1+aR}{1-aR}\\right).
\\]
The typeset source includes an additional factor $(R+a)/(R-a)$ in the expression for
$m_r$; that factor is inconsistent with the characteristic directions above and is
recorded in \\texttt{ERRATA.md}. This gives the new wavenumbers in terms of the old
ones.""",
          )

          replace_once(
              "reconstruction/chapter5.tex",
              "results in a sequence of free frequencies $\\sigma_1^2,\\sigma_2^2,\\sigma_3^2,\\ldots$",
              "results in a sequence of squared free frequencies $\\sigma_1^2,\\sigma_2^2,\\sigma_3^2,\\ldots$",
          )

          replace_once(
              "reconstruction/chapter5.tex",
              "Thus, in a westward propagating wave,\n\\[",
              "Thus, in a westward propagating wave with $\\ell=0$,\n\\[",
          )

          replace_once(
              "reconstruction/chapter5.tex",
              "The present solution also conserves energy, which was enough to convince Lamb (1832)\nthat the results were correct.",
              "The present solution also conserves energy, which was enough to convince Lamb (1932)\nthat the results were correct.",
          )

          replace_once(
              "reconstruction/ERRATA.md",
              """### Printed page 111 — “Lamb (1832)”

- **Category:** `reference`
- **Status:** `pending-review`
- **Location:** Chapter 5, printed page 111
- **Original:** “Lamb (1832)”
- **Reconstruction:** Unchanged pending review.
- **Reason/evidence:** The year cannot refer to Horace Lamb (1849--1934). Authoritative
  catalogues date the Cambridge sixth edition of *Hydrodynamics* to 1932, and later
  literature specifically cites Lamb (1932) for the long-wave step result. The current
  bibliography cites the 1945 Dover reprint of the same sixth edition. Resolve whether
  the intended in-text citation should be 1932 or should match the cited 1945 reprint
  before changing the canonical text.""",
              """### Printed page 111 — “Lamb (1832)”

- **Category:** `reference`
- **Status:** `accepted`
- **Location:** Chapter 5, printed page 111
- **Original:** “Lamb (1832)”
- **Reconstruction:** “Lamb (1932)”
- **Reason/evidence:** Horace Lamb was born in 1849, so 1832 is impossible. The sixth
  edition of *Hydrodynamics* was published by Cambridge University Press in 1932, and
  later wave literature specifically cites Lamb (1932, Art. 176) for the long-wave
  step matching result discussed here. The bibliography retains the valid 1945 Dover
  reprint of the same sixth edition; the in-text year records the original sixth-edition
  publication intended by the one-digit source typo.""",
          )

          Path(".github/workflows/source-cleanup.yml").unlink()
          PY

          git diff --check
          grep -Fq 'case (c),' reconstruction/chapter1.tex
          grep -Fq 'm_r=-m_i' reconstruction/chapter4.tex
          grep -Fq 'squared free frequencies' reconstruction/chapter5.tex
          grep -Fq 'wave with $\ell=0$' reconstruction/chapter5.tex
          grep -Fq 'Lamb (1932)' reconstruction/chapter5.tex
          grep -A6 -F 'Printed page 111 — “Lamb (1832)”' reconstruction/ERRATA.md | grep -Fq '**Status:** `accepted`'

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstruction/chapter1.tex reconstruction/chapter4.tex reconstruction/chapter5.tex reconstruction/ERRATA.md .github/workflows/source-cleanup.yml
          git commit -m "Reconcile accepted errata with canonical TeX"
          git pull --rebase origin main
          git push origin HEAD:main
