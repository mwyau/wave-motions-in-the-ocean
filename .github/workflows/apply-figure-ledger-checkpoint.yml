name: Apply figure equation audit ledger checkpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: figure-equation-audit-ledger
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply figure audit ledger checkpoint'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out newest main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply independently checked ledger updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wave-motions-figure-audit'
          git config user.email '5298134+mwyau@users.noreply.github.com'

          cat > /tmp/apply_figure_ledger.py <<'PY'
          from pathlib import Path
          import re

          path = Path('reconstruction/FIGURES.md')
          text = path.read_text()

          updates = {
              'ch01-p004-phase-speed.tikz': ('Validated', 'Independent phase check: constant-phase planes are normal to `k`, and adjacent planes separated by `2 pi` in phase have normal spacing `lambda=2 pi/|k|`; display angle and vector length are schematic only.'),
              'ch01-p008-wave-packet.tikz': ('Validated', 'The carrier `cos(250 x)` uses degree arguments in PGF, giving exact display period `360/250=1.44`, equal to the wavelength bracket `3.62-2.18`; the envelope scale is independently much larger than `k_0^{-1}`.'),
              'ch01-p010-stationary-phase.tikz': ('Validated', 'The displayed phase is quadratic in `k-k_0`; differentiation gives the unique stationary point at `k_0`, with local oscillation rate increasing in magnitude away from it.'),
              'ch01-p012-wave-crest-path.tikz': ('Validated', 'Rechecked against the crest-count/circulation argument: corrected crest segments cross the A-to-B region rather than terminating within it, so both boundary paths encounter the same continuous crest family.'),
              'ch01-p015-initial-wave-groups.tikz': ('Validated', 'Carrier periods are exactly the declared `lambda_1=0.54` and `lambda_2=0.45`; wavelength markers use those same parameters and the local-`k` plateau increments have the required inverse-wavelength ratio.'),
              'ch01-p016-ray-crossing.tikz': ('Validated', 'Later packet centers are generated by exact linear interpolation along the two straight homogeneous rays from the p.15 packet centers; the carrier wavelengths remain unchanged along each ray.'),
              'ch02-p021-solid-boundary-reflection.tikz': ('Validated', 'Independent reflection check: the tangential wavenumber is conserved while the normal component reverses sign, the two propagation vectors are equal-magnitude specular partners, and the incident crests are normal to the incident wavevector.'),
              'ch02-p022-specular-reflection.tikz': ('Validated', 'The wall normal is exactly perpendicular to the boundary and the incident/reflected vectors are constructed at equal and opposite angles about it with equal magnitudes, enforcing the corrected tangential-wavenumber relation.'),
              'ch04-p068-boundary-value-problem.tikz': ('Validated', 'The independently checked free-surface condition `(sigma^2-f^2) w_z+g nabla_H^2 w=0`, interior internal-wave equation, and bottom `w=0` condition are attached to the correct `z=0,-D` boundaries.'),
              'ch04-p069-dispersion-cone.tikz': ('Validated', 'From `m^2=R^2(k^2+ell^2)`, the cone radius is `|m|/R` and `tan(theta)=1/R`; the displayed angle is derived from the same radius/height rather than set independently.'),
              'ch04-p069-nonrotating-transverse.tikz': ('Validated', 'For `f=0`, the reconstructed velocity is generated exactly perpendicular to `k`; the vertical component relation `w=u sin(theta)` follows from that same geometry.'),
              'ch04-p070-rotating-transverse.tikz': ('Validated', 'The velocity is generated exactly transverse to `k`; `f_parallel` is the exact projection of vertical `f` onto `k` and `f_perp=f-f_parallel` is exactly normal to `k`.'),
              'ch04-p076-waveguide-boundary-problem.tikz': ('Validated', 'Independent substitution confirms the internal-wave field equation and the same free-surface/bottom conditions as p.68, with labels attached to the exact `z=0,-D` boundaries.'),
              'ch04-p078-case-a-intersections.tikz': ('Validated', 'Independent root solving of normalized `1/k=tanh(k)` gives `k=+/-1.1996786403`; the vector contains those two symmetric propagating intersections.'),
              'ch04-p078-case-a1-no-intersections.tikz': ('Validated', 'For normalized `-1/k=tanh(k)`, the two sides have opposite sign for every nonzero real `k`; an independent sign/root check confirms no real propagating intersection.'),
              'ch04-p085-topographic-generation.tikz': ('Validated', 'Rebuilt from one declared illustrative parameter set: `k=100 deg=1.745329` per display unit and `N/U=2` give `m=0.976640` and `k/m=1.787075`. Wavefronts obey `k x+m z=const`, `c_g` is tangent with the exact slope, and all `w=U h_x` arrows have the correct derivative sign.'),
              'ch04-p090-wavenumber-triangle.tikz': ('Validated', 'The revised subcritical construction uses common `R=1.25`, `a=0.32`; directions are `+/-atan(R)` and arrow lengths are generated with the exact ratio `q=(1+aR)/(1-aR)=2.333333`. It makes no supercritical magnitude claim.'),
              'ch04-p090-velocity-reflection.tikz': ('Validated', 'The revised subcritical velocity construction uses equal-base characteristic vectors and scales the reflected one by `q=(1+aR)/(1-aR)=2.333333`; independent calculation gives `|v_r|/|v_i|=q` and `n dot (v_i+v_r)=0` exactly.'),
              'ch04-p093-turning-profile.tikz': ('Validated', 'The smooth `R^2(z)` curve is explicitly an arbitrary input profile, not a solved quantity. All material equation constraints are checked: `R^2>0` gives oscillatory structure, `R^2<0` evanescence, and `R^2=0` is the turning level.'),
              'ch05-p110-depth-step-rays.tikz': ('Validated', 'The revised illustrative construction declares `D_1/D_2=0.60`; `alpha_T=asin[sqrt(D_1/D_2) sin(alpha_I)]` is generated from Snell law and `alpha_R=alpha_I` exactly. Ray lengths alone are schematic.'),
              'ch05-p114-ray-paths.tikz': ('Validated', 'With declared `D_1/D_2=0.10`, the critical angle is `18.43495 deg`; panel A uses `19.2 deg` and totally reflects, while panel B computes the shelf angle `7.73799 deg` from `25.2 deg` deep incidence and reflects specularly at the coast.'),
              'ch05-p117-forced-shelf-profile.tikz': ('Validated', 'The revised display sets `ell=0`, `D_1/D_2=0.10`, and `k_1 L=6 pi`, so `k_2/k_1=sqrt(D_1/D_2)`; choosing `B=C=A/2` makes both elevation and `D eta_x` continuous at the shelf break exactly.'),
              'ch05-p124-amphidromic-pattern.png': ('Validated', 'For equal counter-propagating Kelvin waves, independent superposition gives zeros at `y=a/2`, `x=(n+1/2) pi/k`, spacing `pi/k`, and one rotation per `2 pi/sigma`, matching the retained source field pattern.'),
              'ch05-p126-kelvin-turning-corner.png': ('Partial', 'Far-field Kelvin directions and the no-normal-flow requirement are checked. The detailed near-corner field requires an infinite Poincare-mode matching solution and is not uniquely reconstructed here, so retaining the historical raster is intentional.'),
              'ch05-p132-pressure-high.tikz': ('Validated', 'For geostrophic flow `u=-g eta_y/f`, `v=g eta_x/f`, differentiation gives `div u_g=-g beta eta_x/f^2`: convergence/rising pressure occurs west of the high at A and divergence/falling pressure east at B, with clockwise Northern Hemisphere circulation.'),
              'ch06-p156-bottom-slope-trapping.tikz': ('Validated', 'From the checked dispersion relation, for `omega<1` the sign of `k^2` is the sign of `S^2-omega^2`: propagation requires `omega<S`, while `omega>S` is evanescent. The reflection/trapping panels encode exactly those regimes.'),
              'ch06-p164-stratification-effect.tikz': ('Partial', 'Increasing stratification and the finite `omega=1` cutoff are independently constrained; the strong-S branch terminates exactly on the cutoff. Detailed curvature remains intentionally schematic for unspecified `D(x)`.'),
          }

          def set_asset(text, asset, state, audit):
              lines = text.splitlines()
              idx = [i for i, line in enumerate(lines) if line.startswith(f'| `{asset}` |')]
              if len(idx) != 1:
                  raise SystemExit(f'asset row mismatch for {asset}: {len(idx)}')
              i = idx[0]
              parts = lines[i].split('|')
              current = parts[4].strip().strip('*')
              if current not in {'Pending', 'Partial', state}:
                  print(f'preserving concurrently resolved {asset}: {current}')
                  return text
              parts[4] = f' **{state}** '
              parts[5] = f' {audit} '
              lines[i] = '|'.join(parts)
              return '\n'.join(lines) + '\n'

          for asset, (state, audit) in updates.items():
              text = set_asset(text, asset, state, audit)

          # Dense p.161 spectrum remains only partly reconstructible for arbitrary D(x).
          lines = text.splitlines()
          idx = [i for i, line in enumerate(lines) if line.startswith('| 6 | 161 |')]
          if len(idx) != 1:
              raise SystemExit(f'Ch6 p161 direct row mismatch: {len(idx)}')
          i = idx[0]
          parts = lines[i].split('|')
          if parts[5].strip().strip('*') in {'Pending', 'Partial'}:
              parts[5] = ' **Partial** '
              parts[6] = ' **source-pdf** — retain the information-dense full coastal spectrum. The theorem-level family content (one Kelvin wave, discrete shelf/edge families, Poincare continuum, no Yanai analogue) is checked, but every detailed branch/cutoff for general `D(x)` is not independently reconstructible from the notes. '
              lines[i] = '|'.join(parts)
          text = '\n'.join(lines) + '\n'

          # If issue #7 has already accepted the p.90 absolute-value correction, p.91
          # can be closed here without editing the errata/chapter files owned by #7.
          errata = Path('reconstruction/ERRATA.md').read_text()
          p90_accepted = ('### Printed page 90 — signed versus magnitude wavenumber ratio' in errata and
                          '- **Status:** `accepted`' in errata.split('### Printed page 90 — signed versus magnitude wavenumber ratio', 1)[1].split('## Chapter 5', 1)[0])
          if p90_accepted:
              lines = text.splitlines()
              idx = [i for i, line in enumerate(lines) if line.startswith('| 4 | 91 |')]
              if len(idx) != 1:
                  raise SystemExit(f'Ch4 p91 direct row mismatch: {len(idx)}')
              i = idx[0]; parts = lines[i].split('|')
              parts[5] = ' **Validated** '
              parts[6] = ' **source-pdf** — retain the historical multi-slope reflection sketch. Characteristic directions, critical-slope singularity, and sub/supercritical regimes are independently checked; the source magnitude-sign error across `aR=1` is documented and corrected in `ERRATA.md`. '
              lines[i] = '|'.join(parts)
              text = '\n'.join(lines) + '\n'

          # Likewise close the retained p.159 dispersion art only if its two source
          # mismatches have already been accepted in ERRATA.md by a non-ledger task.
          p159_accepted = ('### Printed page 159 — matching-condition figure labels' in errata and
                           '### Printed page 159 — maximum-frequency condition along a shelf-wave mode' in errata)
          if p159_accepted:
              lines = text.splitlines()
              idx = [i for i, line in enumerate(lines) if line.startswith('| 6 | 159 |')]
              if len(idx) != 1:
                  raise SystemExit(f'Ch6 p159 direct row mismatch: {len(idx)}')
              i = idx[0]; parts = lines[i].split('|')
              parts[5] = ' **Validated** '
              parts[6] = ' **source-pdf** — retain the historical full modal dispersion diagram. Coupled matching/dispersion branches were independently solved; for `b=L=f=1` the first maximum is at `ell=-2.42327665`, `k=2.50909274`. The historical fixed-`k` maximum condition and root-plot labels are documented source errata. '
              lines[i] = '|'.join(parts)
              text = '\n'.join(lines) + '\n'

          states = ('Validated', 'Partial', 'Pending', 'N/A')
          counts = {s: sum(1 for line in text.splitlines()
                           if line.startswith('|') and f'**{s}**' in line)
                    for s in states}
          pending = [line for line in text.splitlines() if line.startswith('|') and '**Pending**' in line]
          allowed_pending = [line for line in pending
                             if line.startswith('| 4 | 91 |') or line.startswith('| 6 | 159 |')]
          if len(allowed_pending) != len(pending):
              raise SystemExit('unexpected Pending rows remain:\n' + '\n'.join(pending))
          if counts['Partial'] != 6 or counts['N/A'] != 15:
              raise SystemExit(f'unexpected Partial/N/A counts: {counts}')
          if counts['Validated'] != 84 - len(pending):
              raise SystemExit(f'unexpected validation total: {counts}')

          summary = (f'Current snapshot across the {sum(counts.values())} tracked body/front-matter assets and direct source placements: '
                     f'**{counts["Validated"]} Validated, {counts["Partial"]} Partial, '
                     f'{counts["Pending"]} Pending, {counts["N/A"]} N/A**.')
          text, n = re.subn(
              r'Current snapshot across the \d+ tracked body/front-matter assets and direct source placements: '
              r'\*\*\d+ Validated, \d+ Partial, \d+ Pending, \d+ N/A\*\*\.',
              summary, text, count=1)
          if n != 1:
              raise SystemExit('validation snapshot anchor missing')
          path.write_text(text)
          print('figure validation snapshot:', counts)
          PY

          success=false
          for attempt in $(seq 1 20); do
            git fetch origin main
            git reset --hard origin/main
            python3 /tmp/apply_figure_ledger.py
            rm -f .github/workflows/apply-figure-ledger-checkpoint.yml .github/figure-ledger-checkpoint.trigger
            git diff --check
            git add -- reconstruction/FIGURES.md .github/workflows/apply-figure-ledger-checkpoint.yml .github/figure-ledger-checkpoint.trigger
            git diff --cached --check
            if git diff --cached --quiet; then
              success=true
              break
            fi
            git commit -m 'Record independent figure equation audit'
            if git push origin HEAD:main; then
              success=true
              break
            fi
            echo 'main advanced; retrying figure-ledger checkpoint'
          done
          test "$success" = true
