name: Apply frontispiece documentation update

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.number == 20 && github.event.comment.body == '/apply-frontispiece-doc'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Update confirmed frontispiece metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          python3 - <<'PY'
          from pathlib import Path

          path = Path('reconstruction/FIGURES.md')
          text = path.read_text()
          old = "| `frontmatter/salmon-hendershott-como-1980.jpeg` | modern front matter | **source photo / provenance-review-needed** | **N/A** | Course LXXX / Topics in Ocean Physics / July 1980 is supported. Do not assert a more specific Lake Como villa or photographer surname without photo-specific evidence. A photograph is not a vectorization candidate. |"
          new = "| `frontmatter/salmon-hendershott-como-1980.jpg` | modern front matter | **source photo / provenance-complete** | **N/A** | Rick Salmon (left) and Myrl Hendershott are confirmed at Villa Carlotta, Lake Como, during the International School of Physics `Enrico Fermi`, Course LXXX, *Topics in Ocean Physics*, July 1980. Photographer attribution remains unconfirmed. A photograph is not a vectorization candidate. |"
          if old not in text:
              raise SystemExit('frontispiece audit row no longer matches expected pre-state')
          path.write_text(text.replace(old, new, 1))
          PY

          rm -- .github/workflows/apply-frontispiece-doc.yml
          git add -- reconstruction/FIGURES.md .github/workflows/apply-frontispiece-doc.yml
          git diff --cached --check
          git commit -m "Confirm Villa Carlotta frontispiece metadata"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
