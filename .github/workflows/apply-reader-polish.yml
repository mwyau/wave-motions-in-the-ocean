name: Apply reader polish

on:
  push:
    paths:
      - .github/workflows/apply-reader-polish.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Prepare reader polish'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply frontispiece and HTML reader polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path

          figures = Path("reconstruction/FIGURES.md")
          text = figures.read_text()
          old = "| `frontmatter/salmon-hendershott-como-1980.jpeg` | modern front matter | **source photo / provenance-review-needed** | **N/A** | Course LXXX / Topics in Ocean Physics / July 1980 is supported. Do not assert a more specific Lake Como villa or photographer surname without photo-specific evidence. A photograph is not a vectorization candidate. |"
          new = "| `frontmatter/salmon-hendershott-como-1980.jpg` | modern front matter | **source photo / provenance-complete** | **N/A** | Rick Salmon (left) and Myrl Hendershott are confirmed at Villa Carlotta, Lake Como, during the International School of Physics `Enrico Fermi`, Course LXXX, *Topics in Ocean Physics*, July 1980. Photographer attribution remains unconfirmed. A photograph is not a vectorization candidate. |"
          if old not in text:
              raise SystemExit("frontispiece audit row no longer matches expected pre-state")
          figures.write_text(text.replace(old, new, 1))

          path = Path("scripts/enhance-html.py")
          text = path.read_text()

          old = "from __future__ import annotations\n\nimport re\nfrom pathlib import Path\n"
          new = "from __future__ import annotations\n\nimport html\nimport re\nfrom pathlib import Path\n\nfrom book_views import book_structure\n"
          if old not in text:
              raise SystemExit("enhance-html import block changed concurrently")
          text = text.replace(old, new, 1)

          old = 'ASSETS = OUT / "assets"\nREPOSITORY_URL = "https://github.com/mwyau/wave-motions-in-the-ocean"\n'
          new = 'ASSETS = OUT / "assets"\nBOOK_TITLE = "Wave Motions in the Ocean"\nREPOSITORY_URL = "https://github.com/mwyau/wave-motions-in-the-ocean"\n'
          if old not in text:
              raise SystemExit("enhance-html constants block changed concurrently")
          text = text.replace(old, new, 1)

          text = text.replace("  max-width: 72rem;\n", "  max-width: 60rem;\n", 1)

          old = '''.book-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: .65rem 1rem;
  border-color: var(--wave-rule);
}
.book-nav-links { display: flex; flex-wrap: wrap; gap: .2rem .55rem; align-items: center; }
.book-nav-links a { white-space: nowrap; }
.theme-toggle {
  min-height: 2.5rem;
  margin-left: auto;
'''
          new = '''.book-nav {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: .65rem 1.15rem;
  border-color: var(--wave-rule);
}
.book-context {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: .12rem;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.2;
}
.book-title {
  width: fit-content;
  color: var(--wave-text);
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .045em;
  text-decoration: none;
  text-transform: uppercase;
}
.book-title:visited { color: var(--wave-text); }
.book-location { color: var(--wave-muted); font-size: .9rem; font-weight: 600; }
.book-controls { min-width: 0; display: flex; align-items: center; gap: .8rem; }
.book-nav-links { min-width: 0; display: flex; flex-wrap: wrap; gap: .2rem .55rem; align-items: center; }
.book-nav-links a { display: inline-flex; align-items: center; min-height: 2.25rem; white-space: nowrap; }
.theme-toggle {
  flex: 0 0 auto;
  min-height: 2.5rem;
  margin-left: 0;
'''
          if old not in text:
              raise SystemExit("enhance-html navigation CSS changed concurrently")
          text = text.replace(old, new, 1)

          old = '''@media (max-width: 700px) {
  body {
    padding: max(.9rem, env(safe-area-inset-top)) max(.9rem, env(safe-area-inset-right)) 3rem max(.9rem, env(safe-area-inset-left));
    line-height: 1.56;
  }
  h1 { font-size: clamp(1.65rem, 7vw, 2.2rem); }
  h2 { font-size: clamp(1.35rem, 5.7vw, 1.75rem); }
  .book-nav { margin-bottom: 1.25rem; font-size: .9rem; }
  .book-nav-links { gap: .35rem .6rem; }
  .theme-toggle { min-height: 2.75rem; }
  figure { margin: 1rem 0; }
  img, svg { margin: .8rem auto; }
  .math.display, mjx-container[jax="CHTML"][display="true"] { padding-bottom: .55rem; }
}
'''
          new = '''@media (max-width: 700px) {
  body {
    padding: max(.9rem, env(safe-area-inset-top)) max(.9rem, env(safe-area-inset-right)) 3rem max(.9rem, env(safe-area-inset-left));
    line-height: 1.56;
  }
  h1 { font-size: clamp(1.65rem, 7vw, 2.2rem); }
  h2 { font-size: clamp(1.35rem, 5.7vw, 1.75rem); }
  .book-nav {
    grid-template-columns: minmax(0, 1fr);
    align-items: stretch;
    gap: .45rem;
    margin-bottom: 1.25rem;
    font-size: .9rem;
  }
  .book-context { gap: .08rem; }
  .book-title { font-size: .72rem; }
  .book-location { font-size: .86rem; line-height: 1.25; }
  .book-controls { width: 100%; gap: .55rem; }
  .book-nav-links {
    flex: 1 1 auto;
    flex-wrap: nowrap;
    gap: .65rem;
    overflow-x: auto;
    overscroll-behavior-inline: contain;
    padding-bottom: .12rem;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }
  .book-nav-links a { min-height: 2.75rem; }
  .theme-toggle { min-height: 2.75rem; }
  figure { margin: 1rem 0; }
  img, svg { margin: .8rem auto; }
  .math.display, mjx-container[jax="CHTML"][display="true"] { padding-bottom: .55rem; }
}
'''
          if old not in text:
              raise SystemExit("enhance-html mobile CSS changed concurrently")
          text = text.replace(old, new, 1)

          old = '''NAV_RE = re.compile(r'(<nav class="book-nav"[^>]*>)(.*?)(</nav>)', re.S)


def enhance_page(path: Path) -> None:
    text = path.read_text(errors="replace")
    text = text.replace(MATHJAX_UNPINNED, MATHJAX_PINNED)
    if "assets/wave.js" not in text:
        text = text.replace("</head>", '<script defer src="assets/wave.js"></script>\\n</head>')

    def nav_sub(match: re.Match[str]) -> str:
        inner = match.group(2).replace('href="index.html"', 'href="index.html#contents"')
        if REPOSITORY_URL not in inner:
            inner = inner.rstrip() + " · " + REPOSITORY_LINK
        if "data-theme-toggle" in inner:
            return match.group(1) + inner + match.group(3)
        return match.group(1) + '<span class="book-nav-links">' + inner + "</span>" + THEME_BUTTON + match.group(3)

    text = NAV_RE.sub(nav_sub, text)
    path.write_text(text)
'''
          new = '''NAV_RE = re.compile(r'(<nav class="book-nav"[^>]*>)(.*?)(</nav>)', re.S)


def page_context(path: Path) -> str:
    if path.name == "index.html":
        return "Front matter & contents"
    if path.name == "references.html":
        return "References"
    match = re.fullmatch(r"chapter([1-6])\\.html", path.name)
    if match:
        number = int(match.group(1))
        chapter = next(chapter for chapter in book_structure() if chapter.number == number)
        return f"Chapter {chapter.number} · {chapter.title}"
    raise ValueError(f"unexpected publication page: {path.name}")


def enhance_page(path: Path) -> None:
    text = path.read_text(errors="replace")
    text = text.replace(MATHJAX_UNPINNED, MATHJAX_PINNED)
    context = page_context(path)
    escaped_context = html.escape(context)
    document_title = BOOK_TITLE if path.name == "index.html" else f"{context} — {BOOK_TITLE}"
    text = re.sub(r"<title>.*?</title>", f"<title>{html.escape(document_title)}</title>", text, count=1, flags=re.S)
    if "assets/wave.js" not in text:
        text = text.replace("</head>", '<script defer src="assets/wave.js"></script>\\n</head>')

    nav_context = (
        '<span class="book-context">'
        f'<a class="book-title" href="index.html">{BOOK_TITLE}</a>'
        f'<span class="book-location">{escaped_context}</span>'
        '</span>'
    )

    def nav_sub(match: re.Match[str]) -> str:
        inner = match.group(2).replace('href="index.html"', 'href="index.html#contents"')
        if REPOSITORY_URL not in inner:
            inner = inner.rstrip() + " · " + REPOSITORY_LINK
        if "data-theme-toggle" in inner or "book-context" in inner:
            return match.group(1) + inner + match.group(3)
        controls = '<span class="book-controls"><span class="book-nav-links">' + inner + "</span>" + THEME_BUTTON + "</span>"
        return match.group(1) + nav_context + controls + match.group(3)

    text = NAV_RE.sub(nav_sub, text)
    path.write_text(text)
'''
          if old not in text:
              raise SystemExit("enhance-html page enhancement block changed concurrently")
          text = text.replace(old, new, 1)

          old = '''    for page in pages:
        text = page.read_text(errors="replace")
        if "assets/wave.js" not in text or "data-theme-toggle" not in text or REPOSITORY_URL not in text:
            raise SystemExit(f"HTML enhancement missing from {page.name}")
        if 'href="index.html#contents"' not in text:
            raise SystemExit(f"HTML contents navigation is missing from {page.name}")
        if MATHJAX_UNPINNED in text:
            raise SystemExit(f"unversioned MathJax URL remains in {page.name}")
'''
          new = '''    for page in pages:
        text = page.read_text(errors="replace")
        expected_context = html.escape(page_context(page))
        if "assets/wave.js" not in text or "data-theme-toggle" not in text or REPOSITORY_URL not in text:
            raise SystemExit(f"HTML enhancement missing from {page.name}")
        if 'class="book-context"' not in text or f'class="book-location">{expected_context}</span>' not in text:
            raise SystemExit(f"HTML reading context is missing from {page.name}")
        if 'href="index.html#contents"' not in text:
            raise SystemExit(f"HTML contents navigation is missing from {page.name}")
        if MATHJAX_UNPINNED in text:
            raise SystemExit(f"unversioned MathJax URL remains in {page.name}")
'''
          if old not in text:
              raise SystemExit("enhance-html validation block changed concurrently")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          python3 -m py_compile scripts/enhance-html.py scripts/book_views.py
          PYTHONPATH=scripts python3 - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("enhance_html", "scripts/enhance-html.py")
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          assert module.page_context(Path("index.html")) == "Front matter & contents"
          assert module.page_context(Path("references.html")) == "References"
          assert module.page_context(Path("chapter1.html")).startswith("Chapter 1 · ")

          with tempfile.TemporaryDirectory() as directory:
              page = Path(directory) / "chapter1.html"
              page.write_text('<html><head><title>old</title></head><body><nav class="book-nav"><a href="index.html#contents">Contents</a></nav></body></html>')
              module.enhance_page(page)
              rendered = page.read_text()
              assert 'class="book-context"' in rendered
              assert 'class="book-controls"' in rendered
              assert 'Wave Motions in the Ocean' in rendered
              assert 'Chapter 1 · ' in rendered
              assert 'data-theme-toggle' in rendered
              assert '<title>Chapter 1 · ' in rendered
          PY

          rm -- .github/workflows/apply-reader-polish.yml
          git add -- reconstruction/FIGURES.md scripts/enhance-html.py .github/workflows/apply-reader-polish.yml
          git diff --cached --check
          git commit -m "Polish HTML reader and frontispiece metadata"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
