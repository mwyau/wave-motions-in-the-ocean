name: Finalize figure equation audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize figure equation audit'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out current main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Apply independently checked equation audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wave-motions-figure-audit'
          git config user.email '5298134+mwyau@users.noreply.github.com'
          git fetch origin main
          git merge --ff-only origin/main
          python3 - <<'PY'
          from pathlib import Path
          import math, re

          # Independent numerical sanity checks retained at the commit gate.
          assert abs((3.62-2.18) - 360/250) < 1e-12
          def bisect(fn,a,b,n=100):
              fa=fn(a)
              for _ in range(n):
                  m=(a+b)/2; fm=fn(m)
                  if fa*fm <= 0: b=m
                  else: a=m; fa=fm
              return (a+b)/2
          r=bisect(lambda x: 1/x-math.tanh(x),1.0,1.4)
          assert abs(r-1.1996786402577) < 1e-10
          assert math.asin(math.sqrt(.1)) > math.radians(18.43)
          assert abs(math.degrees(math.asin(math.sqrt(.1)*math.sin(math.radians(25.2))))-7.73799036) < 1e-7
          # p.159 matched first-mode maximum for normalized b=L=f=1.
          def kroot(ell):
              return bisect(lambda k: math.tan(k)-k/(ell-1), math.pi/2+1e-7, math.pi-1e-7)
          def sig(ell):
              k=kroot(ell); return -2*ell/(ell*ell+k*k+1)
          lo,hi=-3.2,-1.7
          for _ in range(100):
              m1=(2*lo+hi)/3; m2=(lo+2*hi)/3
              if sig(m1) < sig(m2): lo=m1
              else: hi=m2
          ellmax=(lo+hi)/2; kmax=kroot(ellmax)
          assert abs(ellmax+2.42327665) < 2e-7
          assert abs(kmax-2.50909274) < 2e-7

          # Correct the Chapter 5 equatorial-ray WKB/group-ray derivation.
          p=Path('reconstruction/chapter5.tex'); ch=p.read_text()
          start=ch.index('We force a plane wave solution to satisfy the equation\nfor $v$')
          marker='This says that rays are sinusoids moving around the equator'
          end=ch.index(marker,start)+len(marker)
          new=r'''We use a local WKB form for the meridional phase,
\[
 v=v_0(y)\exp\left[-i\sigma t+ikx+i\int^y\ell(y')\,dy'\right].
\]
Then the local dispersion relation becomes (provided $v_0$ and $\ell$ vary slowly)
\[
 \ell^2(y)=\frac{\sigma^2}{gD}-k^2-\frac{\beta k}{\sigma}
 -\frac{\beta^2y^2}{gD}.
\]
A ray follows the group velocity, not the wavevector. Implicit differentiation of this
local dispersion relation gives
\[
 \frac{dy}{dx}=\frac{c_{gy}}{c_{gx}}
 =\frac{2\ell}{2k+\beta/\sigma}=\frac{\ell}{k_*},
 \qquad k_*\equiv k+\frac{\beta}{2\sigma}.
\]
We define the angle that the ray makes at the equator ($y=0$) by
\[
 \tan\theta_0=\frac{\ell(0)}{k_*}.
\]
Since
\[
 \ell^2(y)=\ell^2(0)-\frac{\beta^2y^2}{gD},
\]
we can integrate
\[
 \frac{dy}{[\ell^2(0)-\beta^2y^2/(gD)]^{1/2}}=\frac{dx}{k_*}
\]
to obtain
\[
 y=\frac{(gD)^{1/2}k_*}{\beta}\tan\theta_0
 \sin\left(
 \frac{\beta}{(gD)^{1/2}k_*}x+\mathrm{const}
 \right).
\]
Thus the group rays are sinusoids moving around the equator'''
          ch=ch[:start]+new+ch[end:]
          old=r''' \pm y_T=\pm\frac{(gD)^{1/2}k}{\beta}\tan\theta_0'''
          newbox=r''' \pm y_T=\pm\frac{(gD)^{1/2}k_*}{\beta}\tan\theta_0'''
          if ch.count(old)!=1: raise SystemExit('p147 turning formula anchor changed')
          ch=ch.replace(old,newbox,1)
          s=ch.index('If $k\\to0$, that is the waves squash together')
          e_marker='There the rays must turn back toward the equator.'
          e=ch.index(e_marker,s)+len(e_marker)
          repl=r'''If $k\to0$, the turning points still approach the inertial latitudes
\[
 -\sigma/\beta\le y\le\sigma/\beta,
\]
because setting $\ell=0$ in the local dispersion relation gives
$|y_T|=\sigma/\beta$. With the full group-velocity ray law, however,
$k_*\to\beta/(2\sigma)$ remains finite, so the ray does not become a strictly
north--south straight line. That straight-line statement follows only if ray direction
is identified with wavevector direction. The inertial latitudes remain the outer
turning bounds, where the rays turn back toward the equator.'''
          ch=ch[:s]+repl+ch[e:]
          p.write_text(ch)

          # Correct the Chapter 6 modal maximum: k is an eigenvalue k_n(ell).
          p=Path('reconstruction/chapter6.tex'); ch6=p.read_text()
          s=ch6.index('Each mode is constrained to be below some maximum frequency')
          e=ch6.index('At the maximum frequency, the group velocity is zero',s)
          repl=r'''Each mode is constrained to be below some maximum frequency where the
total derivative $d\sigma_n/d\ell=0$. Since the matching condition makes
$k=k_n(\ell)$ along a discrete mode, differentiating the dispersion relation gives
\[
 k^2+b^2-\ell^2=2\ell k\frac{dk_n}{d\ell}.
\]
The source expression $\ell=-(k^2+b^2)^{1/2}$ results from holding $k$ fixed while
differentiating and is therefore not the stationarity condition along a matched modal
branch; see \texttt{ERRATA.md}.

'''
          ch6=ch6[:s]+repl+ch6[e:]
          p.write_text(ch6)

          # Update errata: accept the independently resolved p.146--147 issues and add p.159.
          p=Path('reconstruction/ERRATA.md'); er=p.read_text()
          a=er.index('### Printed page 146 — local meridional phase with variable wavenumber')
          b=er.index('### Printed pages 146--147 — ray direction identified with wavevector direction',a)
          sec=r'''### Printed page 146 — local meridional phase with variable wavenumber

- **Category:** `equation`
- **Status:** `accepted`
- **Location:** Chapter 5, printed page 146
- **Original:** $v=v_0(y)\exp[-i\sigma t+ikx+i\ell(y)y]$ while treating $\ell(y)$ as
  the local meridional wavenumber.
- **Reconstruction:** $v=v_0(y)\exp[-i\sigma t+ikx+i\int^y\ell(y')\,dy']$.
- **Reason/evidence:** Ray theory defines local wavenumber as the gradient of phase.
  Differentiating the printed phase gives $\ell+y\ell_y$, not $\ell$. The integral
  phase has the required local meridional wavenumber exactly.

'''
          er=er[:a]+sec+er[b:]
          a=er.index('### Printed pages 146--147 — ray direction identified with wavevector direction')
          b=er.index('### Printed page 147 — turning coordinate written as $\\theta_T$',a)
          sec=r'''### Printed pages 146--147 — ray direction identified with wavevector direction

- **Category:** `equation`
- **Status:** `accepted`
- **Location:** Chapter 5, printed pages 146--147
- **Original:** The text defines the ray path by $dy/dx=\ell/k$ while retaining the
  local equatorial dispersion term $-\beta k/\sigma$, and says the $k\to0$ ray becomes
  a north--south straight line.
- **Reconstruction:** Rays follow group velocity,
  $dy/dx=2\ell/(2k+\beta/\sigma)=\ell/k_*$ with
  $k_*=k+\beta/(2\sigma)$. The resulting ray is sinusoidal with $k_*$ replacing $k$;
  for $k\to0$ the turning points still reach $\pm\sigma/\beta$, but the group ray
  retains a finite zonal component.
- **Reason/evidence:** Implicit differentiation of
  $F=\sigma^2/(gD)-k^2-\ell^2-\beta k/\sigma-\beta^2y^2/(gD)=0$
  gives $c_{gy}/c_{gx}=2\ell/(2k+\beta/\sigma)$. The printed slope is wavevector
  direction rather than the group-velocity direction required by the earlier ray theory.

'''
          er=er[:a]+sec+er[b:]
          a=er.index('### Printed page 147 — turning coordinate written as $\\theta_T$')
          b=er.index('### Chapter 5 section numbering in the contents',a)
          sec=r'''### Printed page 147 — turning coordinate written as $\theta_T$

- **Category:** `equation`
- **Status:** `accepted`
- **Location:** Chapter 5, printed page 147
- **Original:** $\pm\theta_T=\pm[(gD)^{1/2}k/\beta]\tan\theta_0$.
- **Reconstruction:**
  $\pm y_T=\pm[(gD)^{1/2}k_*/\beta]\tan\theta_0$ with
  $k_*=k+\beta/(2\sigma)$ and $\theta_0$ the group-ray angle.
- **Reason/evidence:** The right-hand side is a meridional distance, not an angular
  latitude. The additional $k_*$ correction follows from the independently checked
  group-velocity ray law above.

'''
          er=er[:a]+sec+er[b:]
          ch6head='## Chapter 6\n\n'
          if '### Printed page 159 — matching-condition figure labels' not in er:
              insert=r'''### Printed page 159 — matching-condition figure labels

- **Category:** `figure`
- **Status:** `accepted`
- **Location:** Chapter 6, printed page 159, upper figure
- **Original:** The straight matching line is labeled $-k/(\ell+b)$ and the near-horizontal
  limiting line is labeled $\ell=\infty$.
- **Reconstruction:** The vector root plot uses the derived matching relation
  $\tan kL=k/(\ell-b)=-k/(b-\ell)$. Under the chapter convention $\ell<0$, the
  near-horizontal limit is $\ell\to-\infty$.
- **Reason/evidence:** Continuity of $\psi$ and $\psi_x$ at $x=L$ gives the displayed
  matching relation directly. The source labels are incompatible with that derivation.

### Printed page 159 — maximum-frequency condition along a shelf-wave mode

- **Category:** `equation`
- **Status:** `accepted`
- **Location:** Chapter 6, printed page 159
- **Original:** $\ell|_{\sigma_{\max}}=-(k^2+b^2)^{1/2}$.
- **Reconstruction:** Along a discrete mode $k=k_n(\ell)$,
  $k^2+b^2-\ell^2=2\ell k\,dk_n/d\ell$.
- **Reason/evidence:** The source differentiates
  $\sigma=-2bf\ell/(\ell^2+k^2+b^2)$ while holding $k$ fixed, but the matching
  equation $\tan kL=k/(\ell-b)$ makes $k$ vary with $\ell$ on every modal branch.
  For the normalized check $b=L=f=1$, the first branch has its numerical maximum at
  $\ell=-2.42327665$, $k=2.50909274$; the fixed-$k$ source expression would instead
  give $\ell=-2.70102691$ at that $k$.

'''
              er=er.replace(ch6head,ch6head+insert,1)
          p.write_text(er)

          # Figure ledger updates. Only rows uniquely identified below are changed.
          p=Path('reconstruction/FIGURES.md'); fig=p.read_text()
          def set_asset(asset,state,audit):
              nonlocal_dummy=None
              lines=fig.splitlines()
              idx=[i for i,l in enumerate(lines) if l.startswith(f'| `{asset}` |')]
              if len(idx)!=1: raise SystemExit(f'asset row mismatch {asset}: {len(idx)}')
              i=idx[0]; parts=lines[i].split('|')
              parts[4]=f' **{state}** '
              parts[5]=f' {audit} '
              lines[i]='|'.join(parts)
              return '\n'.join(lines)+'\n'
          updates={
          'ch01-p004-phase-speed.tikz':('Validated','Independent phase check: constant-phase planes are normal to `k`, adjacent phase constants differ by `2 pi`, and therefore their normal separation is `lambda=2 pi/|k|`; vector-arrow length and display angle are schematic.'),
          'ch01-p008-wave-packet.tikz':('Validated','The carrier `cos(250 x)` uses degrees, so its exact display period is `360/250=1.44`, equal to the wavelength bracket `3.62-2.18`; the Gaussian envelope scale is independently much larger than `k_0^{-1}`.'),
          'ch01-p010-stationary-phase.tikz':('Validated','The display phase is quadratic in `k-k_0`; independent differentiation gives a unique stationary point at `k_0`, with local oscillation rate increasing in magnitude away from it.'),
          'ch01-p012-wave-crest-path.tikz':('Validated','The crest family was re-audited against the phase-circulation argument; all crest segments now cross the A-to-B region rather than terminating inside it, so the crest-count/path argument is geometrically consistent.'),
          'ch01-p015-initial-wave-groups.tikz':('Validated','Carrier periods are exactly the declared `lambda_1=0.54` and `lambda_2=0.45`; wavelength markers use the same parameters and plateau heights above the common baseline are proportional to `1/lambda`, hence to `|k|`.'),
          'ch01-p016-ray-crossing.tikz':('Validated','Later packet centers are constructed by exact linear interpolation along the two straight group rays from the p.15 packet centers; the preserved carrier wavelengths remain tied to their source packets.'),
          'ch02-p021-solid-boundary-reflection.tikz':('Validated','Independent vector check gives incident direction `(+,−)` and reflected direction `(+,+)` with equal 45-degree magnitudes about the vertical wall normal; incident crests are normal to the incident propagation direction.'),
          'ch02-p022-specular-reflection.tikz':('Validated','The wall normal is `wall angle+90 deg`, and incident/reflected directions are constructed at exactly `+/-34 deg` about it with equal lengths; this independently enforces equal incidence/reflection angles and tangential-wavenumber conservation.'),
          'ch04-p068-boundary-value-problem.tikz':('Validated','The independently checked free-surface condition `(sigma^2-f^2) w_z+g nabla_H^2 w=0`, interior internal-wave equation, and bottom `w=0` condition are attached to the correct `z=0,-D` boundaries.'),
          'ch04-p069-dispersion-cone.tikz':('Validated','From `m^2=R^2(k^2+ell^2)`, the cone radius is `|m|/R` and `tan(theta)=1/R`; the displayed angle is now derived from the same cone radius/height rather than rounded independently.'),
          'ch04-p069-nonrotating-transverse.tikz':('Validated','For `f=0`, the reconstructed `u` vector is now generated exactly perpendicular to `k`; the vertical component relation `w=u sin(theta)` follows from that same geometry.'),
          'ch04-p070-rotating-transverse.tikz':('Validated','The velocity is generated exactly transverse to `k`, while `f_parallel` is the exact projection of vertical `f` onto `k` and `f_perp=f-f_parallel` is exactly normal to `k`.'),
          'ch04-p076-waveguide-boundary-problem.tikz':('Validated','Independent substitution confirms the same internal-wave field equation and free-surface/bottom conditions as p.68; labels and arrows terminate at the exact `z=0,-D` boundaries.'),
          'ch04-p078-case-a-intersections.tikz':('Validated','Independent root solving of normalized `1/k=tanh k` gives `k=+/-1.1996786403`; the vector plots the correct odd branches and two symmetric propagating intersections.'),
          'ch04-p078-case-a1-no-intersections.tikz':('Validated','For normalized `-1/k=tanh k`, the two sides have opposite sign for every nonzero real `k`; an independent sign/root check confirms that no real propagating intersection exists.'),
          'ch05-p110-depth-step-rays.tikz':('Validated','The revised illustrative construction declares `D_1/D_2=0.60`; `alpha_T=asin[sqrt(D_1/D_2) sin(alpha_I)]` is generated from Snell law and `alpha_R=alpha_I` exactly. Ray lengths alone are schematic.'),
          'ch05-p114-ray-paths.tikz':('Validated','With declared `D_1/D_2=0.10`, the critical angle is `18.43495 deg`; panel A uses `19.2 deg` and therefore totally reflects, while panel B computes the shelf angle `7.73799 deg` from a `25.2 deg` deep-ocean incidence and reflects exactly at the coast.'),
          'ch05-p117-forced-shelf-profile.tikz':('Validated','The revised display sets `ell=0`, `D_1/D_2=0.10`, and `k_1 L=6 pi`, so `k_2/k_1=sqrt(D_1/D_2)`; choosing `B=C=A/2` makes both elevation and `D eta_x` continuous at the shelf break exactly.'),
          'ch05-p124-amphidromic-pattern.png':('Validated','For equal counter-propagating Kelvin waves, independent superposition gives zeros only at `y=a/2` and `x=(n+1/2) pi/k`, with spacing `pi/k`; phase evolution rotates once per `2 pi/sigma`, matching the retained source pattern.'),
          'ch05-p126-kelvin-turning-corner.png':('Partial','The far-field incident/reflected Kelvin directions and no-normal-flow requirement are checked, but the near-corner field requires an infinite Poincare-mode matching solution that is not uniquely reconstructed here. Retaining the source raster is intentional.'),
          'ch05-p132-pressure-high.tikz':('Validated','For geostrophic flow `u=-g eta_y/f`, `v=g eta_x/f`, independent differentiation gives `div u_g=-g beta eta_x/f^2`: convergence is west of a high (A), divergence east (B), with clockwise Northern Hemisphere circulation and the displayed pressure tendencies.'),
          'ch05-p147-equatorial-ray.tikz':('Validated','After correcting the WKB/group-ray derivation, `dy/dx=ell/k_*` with `k_*=k+beta/(2 sigma)` integrates to a sinusoid between exact turning latitudes `+/-sqrt(gD) k_* tan(theta_0)/beta`. The globe projection remains presentation-only.'),
          'ch06-p156-bottom-slope-trapping.tikz':('Validated','From the independently checked dispersion relation, `k^2` has the sign of `S^2-omega^2` for `omega<1`: propagation requires `omega<S`, while `omega>S` is evanescent. The reflection/trapping panels encode exactly those regime changes.'),
          'ch06-p164-stratification-effect.tikz':('Partial','Increasing stratification raises the schematic branch toward the inertial cutoff as derived; the strong-S branch now terminates exactly on `omega=1`. Detailed curvature remains schematic for unspecified `D(x)`.'),
          }
          for asset,(state,audit) in updates.items():
              fig=set_asset(asset,state,audit)
          def set_direct(chapter,page,state,disp):
              nonlocal_dummy=None
              lines=fig.splitlines()
              idx=[i for i,l in enumerate(lines) if l.startswith(f'| {chapter} | {page} |')]
              if len(idx)!=1: raise SystemExit(f'direct row mismatch {chapter} p{page}: {len(idx)}')
              i=idx[0]; parts=lines[i].split('|')
              parts[5]=f' **{state}** '; parts[6]=f' {disp} '
              lines[i]='|'.join(parts)
              return '\n'.join(lines)+'\n'
          fig=set_direct(4,91,'Partial','**source-pdf** — retain the multi-slope historical sketch. Subcritical signed/projection relations are independently checked, but the source magnitude formula across `aR=1` remains ambiguous and is documented in `ERRATA.md`; choosing a supercritical magnitude convention would add interpretation.')
          fig=set_direct(6,159,'Validated','**source-pdf** — retain the historical full modal dispersion diagram. Coupled matching/dispersion branches were independently solved; for `b=L=f=1` the first maximum is at `ell=-2.42327665`, `k=2.50909274`. The source fixed-`k` maximum condition is an audited erratum, not an unresolved validation gap.')
          fig=set_direct(6,161,'Partial','**source-pdf** — retain the information-dense full coastal spectrum. The theorem-level family content (one Kelvin wave, discrete shelf/edge families, Poincare continuum, no Yanai analogue) is checked, but every plotted branch/cutoff has not been independently reconstructed equation-by-equation.')
          states=('Validated','Partial','Pending','N/A')
          counts={s:sum(1 for l in fig.splitlines() if l.startswith('|') and f'**{s}**' in l) for s in states}
          total=sum(counts.values())
          if counts != {'Validated':79,'Partial':11,'Pending':0,'N/A':15}:
              raise SystemExit(f'unexpected final validation counts {counts}')
          summary=(f'Current snapshot across the {total} tracked body/front-matter assets and direct source placements: '
                   f'**{counts["Validated"]} Validated, {counts["Partial"]} Partial, '
                   f'{counts["Pending"]} Pending, {counts["N/A"]} N/A**.')
          fig,n=re.subn(r'Current snapshot across the \d+ tracked body/front-matter assets and direct source placements: '
                        r'\*\*\d+ Validated, \d+ Partial, \d+ Pending, \d+ N/A\*\*\.',summary,fig,count=1)
          if n!=1: raise SystemExit('summary anchor missing')
          p.write_text(fig)
          PY

          python3 scripts/sync-views.py --readme
          git diff --check
          git rm -- .github/workflows/finalize-figure-equation-audit.yml .github/figure-equation-audit-finalize.trigger
          git add -- reconstruction/chapter5.tex reconstruction/chapter6.tex reconstruction/ERRATA.md reconstruction/FIGURES.md README.md
          git commit -m 'Complete figure equation audit'
          git fetch origin main
          git rebase origin/main
          # Re-run deterministic checks after any successful rebase.
          python3 scripts/sync-views.py --readme
          git diff --check
          git push origin HEAD:main
