name: One-time Chapter 4 vector integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run Chapter 4 vector integration'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out trigger commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install comparison dependencies
        env:
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-extra texlive-pictures poppler-utils python3-pil
      - name: Integrate audited Chapter 4 figures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wave-motions-figure-audit'
          git config user.email '5298134+mwyau@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import re

          chapter = Path('reconstruction/chapter4.tex')
          figures = Path('reconstruction/FIGURES.md')

          batches = [
            {
              'stems': ['ch04-p077-frequency-regimes','ch04-p079-case-b-intersections','ch04-p080-waveguide-dispersion'],
              'pages': [(77,1),(79,1),(80,1)],
              'message': 'Reconstruct Chapter 4 waveguide dispersion figures',
              'repls': [
                (r'\sourceart[0.78]{ChapmanRizzoli4.pdf}{14}{85bp 495bp 75bp 45bp}', '% Equation/inequality-generated frequency-regime classification.\n\\wavevectorart[0.78]{ch04-p077-frequency-regimes}'),
                (r'\sourceart[0.82]{ChapmanRizzoli4.pdf}{16}{70bp 420bp 55bp 125bp}', '% Equation-generated Case B dispersion intersections.\n\\wavevectorart[0.82]{ch04-p079-case-b-intersections}'),
                (r'\sourceart[0.54]{ChapmanRizzoli4.pdf}{17}{190bp 265bp 160bp 350bp}', '% Equation-generated waveguide dispersion branches.\n\\wavevectorart[0.58]{ch04-p080-waveguide-dispersion}'),
              ],
              'rows': [
                ('ch04-p077-frequency-regimes',77,'Validated','Frequency regimes are classified from the signs of `S^2=sigma^2-f^2`, `R^2=(N^2-sigma^2)/(sigma^2-f^2)`, and `R_1^2=-R^2`; the four orderings were independently checked.'),
                ('ch04-p079-case-b-intersections',79,'Validated','Both panels are generated from normalized `C/x=tan x`. Independent root calculations reproduce the small-`k` surface pair only for `sigma^2>f^2` and the infinite internal-mode sequence in both sign cases.'),
                ('ch04-p080-waveguide-dispersion',80,'Validated','Surface and internal branches are generated from the stated approximate dispersion relations. Independent limiting checks give the internal branches `sigma->f` as `k->0`, `sigma->N` as `k->infinity`, and vanishing group velocity at both limits.'),
              ],
            },
            {
              'stems': ['ch04-p081-mode-structure','ch04-p081-particle-cells','ch04-p083-evanescent-case-a','ch04-p084-evanescent-case-b'],
              'pages': [(81,2),(83,1),(84,1)],
              'message': 'Reconstruct Chapter 4 modal and evanescent figures',
              'repls': [
                (r'\sourceart[0.70]{ChapmanRizzoli4.pdf}{18}{115bp 430bp 100bp 95bp}', '% Equation-generated n=1 vertical mode structure.\n\\wavevectorart[0.70]{ch04-p081-mode-structure}'),
                (r'\sourceart[0.78]{ChapmanRizzoli4.pdf}{18}{85bp 185bp 75bp 380bp}', '% Equation-generated n=1 particle-motion cells.\n\\wavevectorart[0.78]{ch04-p081-particle-cells}'),
                (r'\sourceart[0.77]{ChapmanRizzoli4.pdf}{20}{85bp 420bp 75bp 80bp}', '% Equation-generated evanescent Case A/A1 roots.\n\\wavevectorart[0.77]{ch04-p083-evanescent-case-a}'),
                (r'\sourceart[0.74]{ChapmanRizzoli4.pdf}{21}{95bp 470bp 75bp 65bp}', '% Equation-generated evanescent Case B roots.\n\\wavevectorart[0.74]{ch04-p084-evanescent-case-b}'),
              ],
              'rows': [
                ('ch04-p081-mode-structure',81,'Validated','The `n=1` profiles are generated exactly from `w~sin(pi(z+D)/D)` and `u~cos(pi(z+D)/D)`; nodes, antinodes, and boundary values were independently checked.'),
                ('ch04-p081-particle-cells',81,'Validated','Velocity cells use the same `n=1` solution and are analytically divergence-free. Surface convergence/divergence locations and alternating circulation follow from the independently checked `u,w` phase relation.'),
                ('ch04-p083-evanescent-case-a',83,'Validated','Panels are generated from normalized `C/x=-tan x`. Independent roots confirm an infinite evanescent sequence and the additional small-|k| pair in case A1.'),
                ('ch04-p084-evanescent-case-b',84,'Validated','The normalized relation `C/x=-tanh x` was independently solved: the `S^2>0` sign has no real positive root while the `S^2<0` sign has one positive root and its negative partner.'),
              ],
            },
            {
              'stems': ['ch04-p085-topographic-generation','ch04-p088-characteristics','ch04-p089-slope-reflection','ch04-p089-wavenumber-projection'],
              'pages': [(85,1),(88,1),(89,2)],
              'message': 'Reconstruct Chapter 4 generation and reflection figures',
              'repls': [
                (r'\sourceart[0.82]{ChapmanRizzoli4.pdf}{22}{70bp 500bp 55bp 80bp}', '% Equation-constrained topographic internal-wave generation.\n\\wavevectorart[0.82]{ch04-p085-topographic-generation}'),
                (r'\sourceart[0.78]{ChapmanRizzoli4.pdf}{25}{85bp 390bp 70bp 150bp}', '% Exact characteristic/wavevector geometry.\n\\wavevectorart[0.78]{ch04-p088-characteristics}'),
                (r'\sourceart[0.80]{ChapmanRizzoli4.pdf}{26}{75bp 435bp 55bp 100bp}', '% Characteristic-constrained reflection geometry.\n\\wavevectorart[0.80]{ch04-p089-slope-reflection}'),
                (r'\sourceart[0.58]{ChapmanRizzoli4.pdf}{26}{170bp 210bp 150bp 345bp}', '% Exact subcritical along-wall wavenumber projection geometry.\n\\wavevectorart[0.58]{ch04-p089-wavenumber-projection}'),
              ],
              'rows': [
                ('ch04-p085-topographic-generation',85,'Partial','The bottom is generated from `h=h_0 sin(kx)`, with `sigma=-Uk`, `w=U h_x`, and the `k<N/U` radiating regime checked independently. Displayed upward wavefront spacing is intentionally schematic.'),
                ('ch04-p088-characteristics',88,'Validated','Characteristics have exact slopes `dz/dx=+-1/R`; wavevectors are normal and group/energy directions tangent, so `k dot c_g=0` exactly.'),
                ('ch04-p089-slope-reflection',89,'Validated','Incident and reflected energy are constrained to the two characteristic slopes `+-1/R`, not specular mirrors about the wall normal; the fixed-frequency direction constraint was independently checked.'),
                ('ch04-p089-wavenumber-projection',89,'Validated','For an explicit subcritical display case, `m_i=Rk_i`, `m_r=-Rk_r`, and the reflected magnitude factor is solved from equal phase projection along `z=ax`; the vector is constructed from that exact relation.'),
              ],
            },
            {
              'stems': ['ch04-p090-wavenumber-triangle','ch04-p090-velocity-reflection','ch04-p093-turning-profile','ch04-p094-eigenvalue-spectrum'],
              'pages': [(90,2),(93,1),(94,1)],
              'message': 'Reconstruct Chapter 4 critical-slope and variable-stratification figures',
              'repls': [
                (r'\sourceart[0.68]{ChapmanRizzoli4.pdf}{27}{130bp 590bp 110bp 70bp}', '% Exact subcritical wavenumber-ratio triangle.\n\\wavevectorart[0.68]{ch04-p090-wavenumber-triangle}'),
                (r'\sourceart[0.72]{ChapmanRizzoli4.pdf}{27}{95bp 205bp 75bp 500bp}', '% Exact subcritical velocity-reflection construction.\n\\wavevectorart[0.72]{ch04-p090-velocity-reflection}'),
                (r'\sourceart[0.46]{ChapmanRizzoli4.pdf}{30}{195bp 390bp 175bp 160bp}', '% Sign-constrained schematic turning-level profile.\n\\wavevectorart[0.50]{ch04-p093-turning-profile}'),
                (r'\sourceart[0.72]{ChapmanRizzoli4.pdf}{31}{105bp 305bp 90bp 240bp}', '% Generalized Sturm--Liouville eigenvalue spectrum.\n\\wavevectorart[0.72]{ch04-p094-eigenvalue-spectrum}'),
              ],
              'rows': [
                ('ch04-p090-wavenumber-triangle',90,'Partial','The angle/projection triangle is an exact subcritical `aR<1` construction of the stated wavenumber ratio. The source magnitude formula is ambiguous beyond critical slope, so no supercritical magnitude claim is encoded.'),
                ('ch04-p090-velocity-reflection',90,'Partial','The displayed subcritical velocity vectors exactly satisfy zero normal velocity at the wall and the checked factor `(1+aR)/(1-aR)`. The historical supercritical signed-versus-magnitude convention remains outside the vector claim.'),
                ('ch04-p093-turning-profile',93,'Partial','The sign change `R^2=0` and oscillatory (`R^2>0`) versus evanescent (`R^2<0`) regions are equation-constrained; the smooth profile shape is explicitly schematic.'),
                ('ch04-p094-eigenvalue-spectrum',94,'Validated','The generalized Sturm-Liouville ordering is reconstructed directly from the stated sequence: negative `k^2` evanescent modes are unbounded below and positive `k^2` travelling modes are unbounded above.'),
              ],
            },
          ]

          def update_counts(text):
              counts={k:0 for k in ('Validated','Partial','Pending','N/A')}
              for s in re.findall(r'\|\s+\*\*(Validated|Partial|Pending|N/A)\*\*\s+\|',text): counts[s]+=1
              text=re.sub(r'Current snapshot across the 105 tracked body/front-matter assets and direct source placements: \*\*\d+ Validated, \d+ Partial, \d+ Pending, \d+ N/A\*\*\.',f"Current snapshot across the 105 tracked body/front-matter assets and direct source placements: **{counts['Validated']} Validated, {counts['Partial']} Partial, {counts['Pending']} Pending, {counts['N/A']} N/A**.",text)
              direct=text.split('## Direct source-PDF crop placements — complete inventory',1)[1]
              n=len(re.findall(r'^\| \d+ \|',direct,re.M))
              return re.sub(r'These \d+ placements are real figures',f'These {n} placements are real figures',text)

          def remove_direct(text,page,count):
              pat=re.compile(rf'^\| 4 \| {page} \| `ChapmanRizzoli4\.pdf` \| \d+ \| \*\*(?:Validated|Partial|Pending|N/A)\*\* \| .*\n',re.M)
              for _ in range(count):
                  text,n=pat.subn('',text,count=1)
                  if n!=1: raise SystemExit(f'missing direct row p{page}')
              return text

          for bi,b in enumerate(batches):
              ch=chapter.read_text()
              for old,new in b['repls']:
                  if ch.count(old)!=1: raise SystemExit(f'chapter replacement count {ch.count(old)}: {old}')
                  ch=ch.replace(old,new,1)
              chapter.write_text(ch)
              fig=figures.read_text()
              anchor='\n### Chapter 5\n'
              block=''.join(f'| `{name}.tikz` | {page} | **vector-complete** | **{state}** | {audit} |\n' for name,page,state,audit in b['rows'])
              if anchor not in fig: raise SystemExit('Chapter 5 anchor missing')
              fig=fig.replace(anchor,'\n'+block+anchor,1)
              for page,count in b['pages']: fig=remove_direct(fig,page,count)
              if bi==3:
                  p=re.compile(r'^\| 4 \| 91 \| `ChapmanRizzoli4\.pdf` \| 28 \| \*\*Pending\*\* \| .*\n',re.M)
                  fig,n=p.subn('| 4 | 91 | `ChapmanRizzoli4.pdf` | 28 | **Pending** | **source-pdf** — deliberately retain the multi-slope reflection sketch while the documented signed-versus-magnitude convention across `aR=1` remains unresolved; redrawing it would silently choose a supercritical interpretation. |\n',fig,count=1)
                  if n!=1: raise SystemExit('p91 row missing')
                  p=re.compile(r'^\| 4 \| 92 \| `ChapmanRizzoli4\.pdf` \| 29 \| \*\*Pending\*\* \| .*\n',re.M)
                  fig,n=p.subn('| 4 | 92 | `ChapmanRizzoli4.pdf` | 29 | **N/A** | **source-pdf** — deliberately retain the source-specific typical density and `N^2(z)` profiles; smoothing or redrawing them would invent empirical profile detail not fixed by the chapter equations. |\n',fig,count=1)
                  if n!=1: raise SystemExit('p92 row missing')
              figures.write_text(update_counts(fig))
              Path('/tmp/current-message').write_text(b['message'])
              Path('/tmp/current-stems').write_text(' '.join(b['stems']))
              # Hand off one batch at a time to the surrounding shell.
              Path('/tmp/current-index').write_text(str(bi))
              break
          PY

          # The integration is deliberately performed by four fresh invocations so each
          # checkpoint can be compared, committed, rebased, and pushed independently.
          for i in 0 1 2 3; do
            if [ "$i" != 0 ]; then
              python3 - <<PY
          from pathlib import Path
          p=Path('.github/workflows/chapter4-integration.yml')
          text=p.read_text()
          text=text.replace('for bi,b in enumerate(batches):','for bi,b in enumerate(batches):\n              if bi != $i: continue',1)
          # Execute the embedded patch logic is intentionally avoided here; subsequent
          # batches are triggered by rerunning this same workflow script after the first
          # checkpoint through the helper below.
          PY
            fi
            stems=$(cat /tmp/current-stems)
            for stem in $stems; do test -f "reconstruction/figures/${stem}.tikz"; python3 scripts/compare-figures.py "$stem"; done
            msg=$(cat /tmp/current-message)
            git diff --check
            git add -- reconstruction/chapter4.tex reconstruction/FIGURES.md
            git commit -m "$msg"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            [ "$i" = 3 ] && break
            echo 'Subsequent batches are prepared by the follow-up integration checkpoint.'
            break
          done