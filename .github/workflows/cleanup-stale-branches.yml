name: Cleanup stale branches

on:
  push:
    branches: [main]
    paths:
      - '.github/stale-branch-cleanup.trigger'

permissions:
  contents: write

concurrency:
  group: cleanup-stale-branches
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run stale branch cleanup'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Delete reviewed stale branches and self-remove
        shell: bash
        run: |
          set -euo pipefail

          stale_branches=(
            'audit/software-integration-20260820'
            'cleanup/agent-instructions'
            'cleanup/original-source-link'
            'cleanup/original-source-link-rebased'
            'cleanup/publication-validation'
            'cleanup/software-fixes'
            'diagnose-facsimile-186'
            '__invalid_unused'
            'typography-refinement-issue-23'
            'typography-refinement-issue-23-rebased'
          )

          for branch in "${stale_branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting stale branch: $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/stale-branch-cleanup.trigger .github/workflows/cleanup-stale-branches.yml
          git add -u -- .github/stale-branch-cleanup.trigger .github/workflows/cleanup-stale-branches.yml
          git commit -m 'Remove temporary branch cleanup'

          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done

          echo 'Failed to remove temporary cleanup files from latest main' >&2
          exit 1
