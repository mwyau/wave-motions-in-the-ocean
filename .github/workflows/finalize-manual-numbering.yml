name: Finalize manual equation numbering

on:
  push:
    branches: [main]
    paths:
      - ".github/issue14-numbering.trigger"

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Run manual equation numbering audit'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      TINYTEX_VERSION: "2026.08"
    steps:
      - name: Check out newest main
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Set up Python environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install "$(cat .python-version)"
          uv venv --python "$(cat .python-version)"
          uv pip sync requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install publication tools
        env:
          NEEDRESTART_MODE: a
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils pandoc xz-utils

      - name: Cache TinyTeX
        id: tinytex-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.TinyTeX
          key: wave-motions-tinytex-2026.08-${{ runner.os }}-${{ hashFiles('tex-packages.txt') }}
          restore-keys: |
            wave-motions-tinytex-2026.08-${{ runner.os }}-

      - name: Detect TinyTeX
        id: tinytex-state
        shell: bash
        run: |
          if [ -d "$HOME/.TinyTeX/bin" ] && find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install TinyTeX if absent
        if: steps.tinytex-state.outputs.installed != 'true'
        uses: r-lib/actions/setup-tinytex@v2.12.1

      - name: Add TinyTeX to PATH
        shell: bash
        run: |
          set -euo pipefail
          TEXBIN=$(find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$TEXBIN"
          echo "$TEXBIN" >> "$GITHUB_PATH"
          echo "TEXBIN=$TEXBIN" >> "$GITHUB_ENV"

      - name: Install TeX dependencies
        if: steps.tinytex-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TEXBIN:$PATH"
          tlmgr update --self
          mapfile -t PACKAGES < <(grep -Ev '^\s*(#|$)' tex-packages.txt)
          tlmgr install "${PACKAGES[@]}"

      - name: Apply manually adjudicated numbering
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from __future__ import annotations
          import re
          from pathlib import Path

          ROOT = Path('.')
          RECON = ROOT / 'reconstruction'

          WAVE_EQ = re.compile(r"\\begin\{waveequation\}(?P<body>.*?)\\end\{waveequation\}", re.S)
          WAVE_ALIGN = re.compile(r"\\begin\{wavealign\}(?P<body>.*?)\\end\{wavealign\}", re.S)
          DISPLAY = re.compile(r"\\\[(?P<body>.*?)\\\]", re.S)
          ALIGN = re.compile(r"\\begin\{align\*\}(?P<body>.*?)\\end\{align\*\}", re.S)

          def demote(text: str) -> str:
              text = WAVE_ALIGN.sub(lambda m: "\\begin{align*}" + m.group('body') + "\\end{align*}", text)
              text = WAVE_EQ.sub(lambda m: "\\[" + m.group('body') + "\\]", text)
              return text

          def promote(text: str, name: str, tokens: tuple[str, ...], exclude: tuple[str, ...] = ()) -> str:
              candidates: list[tuple[re.Match[str], str]] = []
              for rx, kind in ((DISPLAY, 'waveequation'), (ALIGN, 'wavealign')):
                  for m in rx.finditer(text):
                      body = m.group('body')
                      if all(token in body for token in tokens) and not any(token in body for token in exclude):
                          candidates.append((m, kind))
              if len(candidates) != 1:
                  previews = [re.sub(r'\s+', ' ', m.group('body').strip())[:180] for m, _ in candidates]
                  raise SystemExit(f"{name}: expected one display, found {len(candidates)}: {previews}")
              m, kind = candidates[0]
              body = m.group('body')
              replacement = f"\\begin{{{kind}}}" + body + f"\\end{{{kind}}}"
              return text[:m.start()] + replacement + text[m.end():]

          manifest: dict[int, list[tuple[str, tuple[str, ...], tuple[str, ...]]]] = {
              1: [],
              2: [
                  ('acoustic wave equation', (r'\frac{\partial^2p}{\partial t^2}-c^2\nabla^2p=0',), ()),
                  ('acoustic dispersion', (r'\sigma^2=c_0^2(k^2+\ell^2+m^2)',), ()),
                  ('acoustic waveguide dispersion', (r'\sigma^2/c_0^2=k^2+\ell^2+n^2\pi^2/D^2',), ()),
                  ('pressure reflection coefficient', (r'R=\frac{\rho_2c_2\cos\theta_I-\rho_1c_1\cos\theta_T}',), ()),
                  ('pressure transmission coefficient', (r'T=\frac{2\rho_2c_2\cos\theta_I}',), ()),
                  ('acoustic Snell law', (r'\frac{\sin\theta_I}{c_1}', r'\frac{\sin\theta_T}{c_2}'), ()),
                  ('acoustic critical angle', (r'\theta_{Ic}=\sin^{-1}(c_1/c_2)',), ()),
                  ('forced acoustic wave equation', (r'p_{tt}-c^2\nabla^2p=c^2', r'Q_t-\nabla\cdot\vec F'), ()),
                  ('sound-ray Snell invariant', (r'\frac{\sin\theta_0}{c_0}', r'\frac{\sin\theta}{c(z)}'), ()),
              ],
              3: [
                  ('nonlinear free-surface BVP', (r'\eta_t+\phi_x\eta_x+\phi_y\eta_y', r'\nabla^2\phi&=0', r'\phi_z&=0'), ()),
                  ('finite-depth gravity dispersion', (r'\sigma^2=gk\tanh kD',), ()),
                  ('two-fluid interfacial dispersion', (r'\sigma^2=gk\frac{\rho_2-\rho_1}{\rho_2+\rho_1}',), ()),
                  ('nonlinear shallow-water system', (r'h_t+(u_0h)_x+(v_0h)_y', r'u_{0t}+u_0u_{0x}', r'v_{0t}+u_0v_{0x}'), ()),
                  ('gravity-wave energy flux', (r'\overline{Eflux}=\overline E\,\vec c_g',), ()),
                  ('gravity-wave energy conservation', (r'\overline E_t+\nabla_H\cdot(\overline E\,\vec c_g)=0',), ()),
                  ('general current Doppler dispersion', (r'\sigma=\vec k\cdot\vec U(x,y,t)', r'\tanh|\vec k|D(x,y,t)'), ()),
              ],
              4: [
                  ('Boussinesq internal-wave equation', (r'w_{zz}-\left(\frac{N^2-\sigma^2}{\sigma^2-f^2}\right)(w_{xx}+w_{yy})=0',), ()),
                  ('internal-wave dispersion', (r'm^2=\left(\frac{N^2-\sigma^2}{\sigma^2-f^2}\right)(k^2+\ell^2)',), ()),
                  ('surface-waveguide root relation', (r'\frac{R_1(\sigma^2-f^2)}{gk}=\tanh(kR_1D)',), ()),
                  ('topographic vertical wavenumber', (r'm^2=k^2(N^2-\sigma^2)/\sigma^2', r'(N/U)^2-k^2'), ()),
                  ('critical-reflection wavenumber ratio', (r'|\vec k_r|=|\vec k_i|', r'\frac{1+aR}{1-aR}'), ()),
                  ('critical-reflection velocity ratio', (r'|\vec v_r|=|\vec v_i|', r'\frac{1+aR}{1-aR}'), ()),
                  ('variable-N modal nonorthogonality', (r'\int_{-D}^{0}\omega_i\omega_jR^2(z)', r'-\omega_i(0)\omega_j(0)g/(\sigma^2-f^2)'), ()),
              ],
              5: [
                  ('Laplace tidal/equivalent-depth system', (r'-i\sigma U-2\Omega\sin\theta\,V', r'G_{zz}+\frac{N^2-\sigma^2}{g d_n}G', r'G_z-\frac{1}{d_n}G'), ()),
                  ('linear rotating shallow-water system', (r'u_t-fv&=-g\eta_x', r'\eta_t+[uD]_x+[vD]_y&=0'), ()),
                  ('shallow-water dispersion', (r'\sigma^2=gD(k^2+\ell^2)=gDK^2',), ()),
                  ('rectangular-basin seiche spectrum', (r'\sigma^2', r'\frac{n^2}{a^2}+\frac{m^2}{b^2}', r'\pi^2'), ()),
                  ('step transmission coefficient', (r'A_T=2A_I/(1+D_1k_1/D_2k_2)',), ()),
                  ('step reflection coefficient', (r'A_R=A_I(1-D_1k_1/D_2k_2)/(1+D_1k_1/D_2k_2)',), ()),
                  ('shallow-water Snell law', (r'\frac{\sin\alpha_I}{c_I}=\frac{\sin\alpha_T}{c_T}',), ()),
                  ('step critical angle', (r'\sin\alpha_I\'', r'\left(\frac{D_1}{D_2}\right)^{1/2}'), ()),
                  ('edge-wave dispersion', (r'\tan k_1L=k_2D_2/k_1D_1',), ()),
                  ('coastal-seiche resonance', (r'\sigma=\frac{(gD_1)^{1/2}}{L}', r'n\pi+\pi/2'), ()),
                  ('Poincare/Sverdrup dispersion', (r'\sigma^2=gD(k^2+\ell^2)+f^2',), ()),
                  ('rotating-wall reflection amplitude', (r'\frac{a_r}{a_i}', r'\frac{\sigma k+i f\ell}{\sigma k-i f\ell}'), ()),
                  ('Kelvin-wave dispersion', (r'\sigma^2=gD\ell^2',), ()),
                  ('Poincare channel-mode dispersion', (r'k^2=\frac{\sigma^2-f^2}{gD}', r'\left(\frac{m\pi}{a}\right)^2'), ()),
                  ('Rossby vorticity equation', (r'(v_x-u_y)_t+\beta v=0',), ()),
                  ('Rossby dispersion', (r'\sigma=-\frac{\beta k}{k^2+\ell^2}',), (r'\Rightarrow',)),
                  ('Rossby group velocity', (r'\vec c_g=\frac{\beta}{K^2}', r'\cos(2\gamma)', r'\sin(2\gamma)'), ()),
                  ('divergent planetary dispersion', (r'\sigma=-\frac{g\beta D}{f^2}k',), (r'\Rightarrow',)),
                  ('general midlatitude planetary dispersion', (r'\left(k+\frac{\beta}{2\sigma}\right)^2+\ell^2', r'+\frac{\sigma^2-f^2}{gD}'), ()),
                  ('standard low-frequency Rossby dispersion', (r'\sigma=-\frac{\beta k}', r'k^2+\ell^2+f^2/gD'), ()),
                  ('equatorial beta-plane system', (r'u_t-\beta yv&=-g\eta_x', r'v_t+\beta yu&=-g\eta_y', r'\eta_t+D(u_x+v_y)&=0'), ()),
                  ('equatorial Hermite dispersion', (r'\frac{(gD)^{1/2}}{\beta}', r'\frac{\sigma^2}{gD}-k^2-\frac{\beta k}{\sigma}', r'=2m+1'), ()),
                  ('dimensionless equatorial cubic', (r'\omega^2-\lambda^2-\lambda/\omega=2m+1',), ()),
                  ('Yanai factorization', (r'(\lambda+\omega)[\lambda-(\omega-1/\omega)]=0',), ()),
                  ('equatorial Kelvin dispersion', (r'\sigma=(gD)^{1/2}k',), (r'\pm',)),
                  ('equatorial WKB meridional wavenumber', (r'\ell^2(y)=\frac{\sigma^2}{gD}-k^2-\frac{\beta k}{\sigma}', r'-\frac{\beta^2y^2}{gD}'), ()),
                  ('equatorial turning latitude', (r'\pm y_T', r'\frac{(gD)^{1/2}k}{\beta}\tan\theta_0'), ()),
              ],
              6: [
                  ('reduced topographic-Rossby BVP', (r'p_{xx}+p_{yy}+\frac{1}{S^2}p_{zz}', r'i\omega p_z', r'\delta S^2p_x'), ()),
                  ('stratified topographic-Rossby dispersion', (r'\omega=-\frac{\delta kS^2}{\mu\tanh\mu}',), ()),
                  ('dimensional topographic-Rossby dispersion', (r'\sigma=-\frac{\alpha kf}', r'H\{(n\pi/L)^2+k^2\}'), ()),
                  ('bottom-trapped offshore decay', (r'm=\frac{\ell}{\omega}', r'\frac{S^2}{1-\omega^2+S^2}'), ()),
                  ('bottom-trapped along-slope dispersion', (r'k=\frac{\ell}{\omega}', r'(S^2-\omega^2)(1-\omega^2)'), ()),
                  ('continental-shelf dispersion', (r'\sigma=-\frac{2bf\ell}{\ell^2+k^2+b^2}',), ()),
                  ('general shelf-wave eigen-equation', (r'(D\eta_x)_x-K\eta=0', r'K=\frac{f\ell}{\sigma}D_x'), ()),
                  ('stratified coastal-trapped BVP', (r'p_{xx}-\ell^2p+\frac{1-\omega^2}{S^2}p_{zz}', r'S^2D_x', r'p&\to0'), ()),
                  ('weak-stratification shelf reduction', (r'(Dp_{0x})_x', r'\frac{\ell}{\omega}D_x+\ell^2D'), ()),
                  ('strong-stratification coastal dispersion', (r'\omega=-\frac{S\ell}{n\pi}',), ()),
                  ('wind-forced shelf eigenproblem', (r'\left(\frac{F_x}{D}\right)_x', r'\frac{fD_x}{cD^2}F=0'), ()),
                  ('shelf-mode orthogonality', (r'\int_0^L\frac{D_x}{D^2}F_nF_m', r'=\delta_{nm}'), ()),
                  ('forced modal evolution', (r'\frac{1}{c_n}\phi_{nt}-\phi_{ny}=-b_n\tau^y',), ()),
              ],
          }

          expected_wrappers = {1: 0, 2: 9, 3: 7, 4: 7, 5: 27, 6: 13}
          for chapter in range(1, 7):
              path = RECON / f'chapter{chapter}.tex'
              text = demote(path.read_text())
              for name, tokens, exclude in manifest[chapter]:
                  text = promote(text, f'chapter {chapter}: {name}', tokens, exclude)
              wrappers = text.count(r'\begin{waveequation}') + text.count(r'\begin{wavealign}')
              if wrappers != expected_wrappers[chapter]:
                  raise SystemExit(f'chapter {chapter}: wrapper count {wrappers}, expected {expected_wrappers[chapter]}')
              if chapter == 1:
                  tags = re.findall(r'\\tag\{(1\.[123])\}', text)
                  if tags != ['1.1', '1.2', '1.3']:
                      raise SystemExit(f'chapter 1 historical tags changed: {tags}')
              elif r'\tag{' in text:
                  raise SystemExit(f'chapter {chapter}: unexpected native equation tag')
              path.write_text(text)
              print(f'chapter {chapter}: {wrappers} editorial wrappers')

          # Flowing editions: preserve historical native tags and use upright labels.
          path = ROOT / 'scripts' / 'build-html.py'
          text = path.read_text()
          anchor = '''WAVE_NUMBERED_RE = re.compile(\n    r"\\\\begin\\{(?P<env>waveequation|wavealign)\\}(?P<body>.*?)"\n    r"\\\\end\\{(?P=env)\\}",\n    re.S,\n)\nFIGURE_MARK_RE = re.compile(r"\\\\wavefiguremark")'''
          replacement = '''WAVE_NUMBERED_RE = re.compile(\n    r"\\\\begin\\{(?P<env>waveequation|wavealign)\\}(?P<body>.*?)"\n    r"\\\\end\\{(?P=env)\\}",\n    re.S,\n)\nNATIVE_TAGGED_EQUATION_RE = re.compile(\n    r"\\\\begin\\{equation\\}(?P<body>.*?)\\\\tag\\{(?P<tag>\\d+\\.\\d+)\\}(?P<tail>.*?)"\n    r"\\\\end\\{equation\\}",\n    re.S,\n)\nFIGURE_MARK_RE = re.compile(r"\\\\wavefiguremark")'''
          if text.count(anchor) != 1:
              raise SystemExit('build-html regex anchor changed')
          text = text.replace(anchor, replacement, 1)

          old = '''    equation_number = 0\n    def numbered_equation_sub(m: re.Match[str]) -> str:\n        nonlocal equation_number\n        equation_number += 1\n        body = m.group("body").strip()\n        if m.group("env") == "wavealign":\n            body = r"\\begin{aligned}" + body + r"\\end{aligned}"\n        label = f"({chapter_number}.{equation_number})"\n        return (\n            "\\\\[\\n" + body + "\\n\\\\]\\n"\n            "\\\\begin{flushright}\\n\\\\textit{" + label + "}\\n\\\\end{flushright}"\n        )\n\n    text = WAVE_NUMBERED_RE.sub(numbered_equation_sub, text)'''
          new = '''    native_labels: list[str] = []\n    def native_equation_sub(m: re.Match[str]) -> str:\n        tag = m.group("tag")\n        if not tag.startswith(f"{chapter_number}."):\n            raise SystemExit(f"chapter {chapter_number}: native equation tag {tag} has wrong chapter")\n        native_labels.append(f"({tag})")\n        body = (m.group("body") + m.group("tail")).strip()\n        return (\n            "\\\\[\\n" + body + "\\n\\\\]\\n"\n            "\\\\begin{flushright}\\n\\\\textup{(" + tag + ")}\\n\\\\end{flushright}"\n        )\n\n    text = NATIVE_TAGGED_EQUATION_RE.sub(native_equation_sub, text)\n\n    equation_number = 0\n    def numbered_equation_sub(m: re.Match[str]) -> str:\n        nonlocal equation_number\n        equation_number += 1\n        body = m.group("body").strip()\n        if m.group("env") == "wavealign":\n            body = r"\\begin{aligned}" + body + r"\\end{aligned}"\n        label = f"({chapter_number}.{equation_number})"\n        return (\n            "\\\\[\\n" + body + "\\n\\\\]\\n"\n            "\\\\begin{flushright}\\n\\\\textup{" + label + "}\\n\\\\end{flushright}"\n        )\n\n    text = WAVE_NUMBERED_RE.sub(numbered_equation_sub, text)\n    if native_labels and equation_number:\n        raise SystemExit(f"chapter {chapter_number}: mixed native and editorial equation numbering is unsupported")'''
          if text.count(old) != 1:
              raise SystemExit('build-html numbering transform anchor changed')
          text = text.replace(old, new, 1)
          old_fig = 'f"\\\\textit{{Figure {chapter_number}.{figure_number}}}\\n"'
          new_fig = 'f"\\\\textsf{{Figure {chapter_number}.{figure_number}}}\\n"'
          if text.count(old_fig) != 1:
              raise SystemExit('build-html figure-label anchor changed')
          text = text.replace(old_fig, new_fig, 1)
          path.write_text(text)

          # Validator: canonical labels come from historical native tags OR editorial wrappers.
          path = ROOT / 'scripts' / 'validate-math.py'
          text = path.read_text()
          old = 'NUMBERED_ENV_RE = re.compile(r"\\\\\\\\begin\\\\{(?:waveequation|wavealign)\\\\}")\n'
          new = old + 'NATIVE_TAG_RE = re.compile(r"\\\\\\\\tag\\\\{(?P<tag>\\\\d+\\\\.\\\\d+)\\\\}")\n'
          if text.count(old) != 1:
              raise SystemExit('validate-math numbered-env anchor changed')
          text = text.replace(old, new, 1)
          old_func = '''def canonical_equation_labels() -> dict[int, tuple[str, ...]]:\n    labels: dict[int, tuple[str, ...]] = {}\n    for chapter_number in range(1, 7):\n        path = RECON / f"chapter{chapter_number}.tex"\n        text = strip_tex_comments(path.read_text())\n        count = len(NUMBERED_ENV_RE.findall(text))\n        if count == 0:\n            fail(f"{path.name}: no selected numbered equations found")\n        labels[chapter_number] = tuple(\n            f"({chapter_number}.{index})" for index in range(1, count + 1)\n        )\n    return labels\n'''
          new_func = '''def canonical_equation_labels() -> dict[int, tuple[str, ...]]:\n    labels: dict[int, tuple[str, ...]] = {}\n    for chapter_number in range(1, 7):\n        path = RECON / f"chapter{chapter_number}.tex"\n        text = strip_tex_comments(path.read_text())\n        wrapper_count = len(NUMBERED_ENV_RE.findall(text))\n        native = tuple(f"({m.group('tag')})" for m in NATIVE_TAG_RE.finditer(text))\n        if native and wrapper_count:\n            fail(f"{path.name}: mixes historical native tags with editorial numbering wrappers")\n        if native:\n            expected = tuple(f"({chapter_number}.{index})" for index in range(1, len(native) + 1))\n            if native != expected:\n                fail(f"{path.name}: native equation tags are not contiguous/in order: {native}")\n            labels[chapter_number] = native\n        elif wrapper_count:\n            labels[chapter_number] = tuple(\n                f"({chapter_number}.{index})" for index in range(1, wrapper_count + 1)\n            )\n        else:\n            fail(f"{path.name}: no selected numbered equations found")\n    return labels\n'''
          if text.count(old_func) != 1:
              raise SystemExit('validate-math canonical-label function changed')
          text = text.replace(old_func, new_func, 1)
          path.write_text(text)
          PY

          python3 scripts/sync-views.py --readme
          python3 scripts/sync-views.py --check-readme
          python3 -m py_compile scripts/build-html.py scripts/validate-math.py
          git diff --check

      - name: Build and validate all editions
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build.sh all
          python3 scripts/validate-math.py
          python3 scripts/sync-views.py --check-readme

      - name: Commit audited numbering
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-manual-numbering.yml .github/issue14-numbering.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refine equation numbering by scientific importance"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "main changed in overlapping files; refusing to race concurrent work" >&2
            exit 1
          fi
          git push origin HEAD:main
          final_sha=$(git rev-parse HEAD)
          gh issue comment 14 --body "Manual equation-numbering integration landed at \`$final_sha\`. The migration replaced the heuristic selection with the A/B scientific-importance audit, preserved historical Ch.1 tags (1.1)–(1.3), harmonized flowing-edition label typography, and made validation derive canonical identity from native tags or editorial wrappers. Full \`./scripts/build.sh all\`, \`validate-math.py\`, README synchronization, and diff checks passed before integration. Ch.6 p.159 remains deliberately untouched while #9 owns that source block; #14 stays open for that one B-level matching-condition wrapper and a final post-#9 publication check."
