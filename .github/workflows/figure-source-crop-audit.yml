# One-time workflow; deletes itself after the figure source-crop audit commit.
name: One-time figure source-crop audit

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.issue.title == '[internal] figure source-crop audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply audited vector replacements and ledger dispositions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          vectors = {'reconstruction/figures/ch04-p069-nonrotating-transverse.tikz': '% wave-source: pdf=ChapmanRizzoli4.pdf; page=6; trim=220bp 60bp 195bp 610bp\n% Source: Wave Motions in the Ocean, printed p.69 (physical p.6).\n% For f=0, particle velocity u is perpendicular to k; vertical component w=u sin(theta).\n\\begin{center}\n\\begin{tikzpicture}[x=1cm,y=1cm,>=stealth,line cap=round,line join=round,font=\\small]\n  \\coordinate (O) at (0,0);\n  \\draw (-0.55,0)--(3.25,0);\n  \\draw[->,line width=0.8pt] (O)--(2.75,0.85) node[right] {$\\vec k$};\n  \\draw[->,line width=0.8pt] (O)--(-0.55,1.75) node[left] {$\\vec u$};\n  % Unit-vector component in the vertical direction, as in the source sketch.\n  \\draw[dashed,->] (O)--(0,1.95) node[above right] {$\\hat k\\sin\\theta$};\n  \\draw (0.52,0.16) arc[start angle=17,end angle=90,radius=0.55];\n  \\node at (0.30,0.53) {$\\theta$};\n  \\draw[->,line width=0.7pt] (O)--(-0.35,-1.10);\n  \\node[anchor=west] at (0.75,-0.48) {$w=u\\sin\\theta$};\n\\end{tikzpicture}\n\\end{center}\n',
 'reconstruction/figures/ch04-p070-rotating-transverse.tikz': "% wave-source: pdf=ChapmanRizzoli4.pdf; page=7; trim=185bp 350bp 170bp 240bp\n% Source: Wave Motions in the Ocean, printed p.70 (physical p.7).\n% Rotation-vector decomposition relative to k for N=0.\n\\begin{center}\n\\begin{tikzpicture}[x=1cm,y=1cm,>=stealth,line cap=round,line join=round,font=\\small]\n  \\coordinate (O) at (0,0);\n  \\def\\ang{18}\n  \\draw (-0.65,0)--(3.35,0);\n  \\draw[->,line width=0.8pt] (O)--(2.95,0.96) node[right] {$\\vec k$};\n  \\draw[->,line width=0.8pt] (O)--(-0.56,1.72) node[left] {$\\vec u$};\n  \\draw[->,line width=0.75pt] (O)--(0,2.20) node[above] {$\\vec f$};\n  % f_parallel is along k; f_perp is normal to k.\n  \\draw[->,line width=0.65pt] (O)--(1.03,0.33) node[below right] {$\\vec f_{\\parallel}$};\n  \\draw[->,line width=0.65pt] (1.03,0.33)--(0,2.20) node[midway,right] {$\\vec f_{\\perp}$};\n  \\draw (0.56,0.18) arc[start angle=18,end angle=90,radius=0.59];\n  \\node at (0.32,0.57) {$\\theta$};\n  \\node[anchor=west] at (1.55,0.73) {$\\hat k\\prime$};\n\\end{tikzpicture}\n\\end{center}\n",
 'reconstruction/figures/ch04-p072-phase-energy-phi.tikz': '% wave-source: pdf=ChapmanRizzoli4.pdf; page=9; trim=105bp 95bp 95bp 520bp\n% Source: Wave Motions in the Ocean, printed p.72 (physical p.9), lower pair.\n% c_g is energy propagation; phase propagation is perpendicular to c_g.\n\\begin{center}\n\\begin{tikzpicture}[x=1cm,y=1cm,>=stealth,line cap=round,line join=round,font=\\small]\n  \\foreach \\dx/\\title/\\pdir in {0/{$f>N$}/-55,5.1/{$f<N$}/125} {\n    \\begin{scope}[shift={(\\dx,0)}]\n      \\node[draw,inner sep=3pt] at (1.55,2.75) {\\title};\n      \\draw (0,-0.30)--(0,2.35);\n      \\draw (-0.55,0)--(3.35,0);\n      \\draw[->,line width=0.8pt] (0,0)--(2.65,1.65) node[right] {$\\vec c_g$};\n      \\node[anchor=west] at (2.12,1.02) {(energy)};\n      \\draw (0,0.62) arc[start angle=90,end angle=31.9,radius=0.62];\n      \\node at (0.35,0.58) {$\\phi$};\n      \\draw[->,line width=0.8pt] (1.28,0.80)--++(\\pdir:1.15);\n      \\node at ($(1.28,0.80)+(\\pdir:1.43)$) {phases};\n    \\end{scope}\n  }\n\\end{tikzpicture}\n\\end{center}\n',
 'reconstruction/figures/ch04-p072-phase-energy-theta.tikz': '% wave-source: pdf=ChapmanRizzoli4.pdf; page=9; trim=90bp 470bp 80bp 60bp\n% Source: Wave Motions in the Ocean, printed p.72 (physical p.9), upper pair.\n% k (phase propagation) and energy propagation are perpendicular; sign reverses across f=N.\n\\begin{center}\n\\begin{tikzpicture}[x=1cm,y=1cm,>=stealth,line cap=round,line join=round,font=\\small]\n  \\foreach \\dx/\\title/\\edir in {0/{$f>N$}/135,5.2/{$f<N$}/-45} {\n    \\begin{scope}[shift={(\\dx,0)}]\n      \\node[draw,inner sep=3pt] at (1.65,2.75) {\\title};\n      \\draw (0,-0.35)--(0,2.35);\n      \\draw (-0.55,0)--(3.35,0);\n      \\draw[->,line width=0.8pt] (0,0)--(2.75,1.55) node[right] {$\\vec k$};\n      \\node[anchor=west] at (2.28,0.95) {(phases)};\n      \\draw (0,0.57) arc[start angle=90,end angle=29.4,radius=0.57];\n      \\node at (0.35,0.55) {$\\theta$};\n      \\draw[->,line width=0.8pt] (1.35,0.76)--++(\\edir:1.25);\n      \\node at ($(1.35,0.76)+(\\edir:1.55)$) {energy};\n      % short crest marker normal to k\n      \\draw[line width=0.7pt] (1.08,0.99)--(1.55,0.16);\n    \\end{scope}\n  }\n\\end{tikzpicture}\n\\end{center}\n',
 'reconstruction/figures/ch04-p073-rotation-only-limits.tikz': '% wave-source: pdf=ChapmanRizzoli4.pdf; page=10; trim=150bp 305bp 135bp 255bp\n% Source: Wave Motions in the Ocean, printed p.73 (physical p.10).\n% Endpoint limits for rotation only (N=0).\n\\begin{center}\n\\begin{tikzpicture}[x=1cm,y=1cm,>=stealth,line cap=round,line join=round,font=\\small]\n  \\draw[->,line width=0.8pt] (0,0)--(0,3.15);\n  \\draw[->,line width=0.8pt] (0,0)--(4.35,0);\n  \\node[anchor=west,align=left] at (0.18,2.72) {$\\phi=0^\\circ$\\\\$\\sigma=0$ (steady: Taylor columns)\\\\$|\\vec c_g|\\ne0$\\\\wavenumber = arbitrary horizontal, $m=0$};\n  \\node[anchor=west,align=left] at (4.05,1.30) {$\\phi=90^\\circ$\\\\$\\sigma=f$ (inertial oscillations)\\\\$|\\vec c_g|=0$\\\\wavenumber = vertical, $k=\\ell=0$};\n\\end{tikzpicture}\n\\end{center}\n',
 'reconstruction/figures/ch04-p074-stratification-only-limits.tikz': '% wave-source: pdf=ChapmanRizzoli4.pdf; page=11; trim=150bp 320bp 130bp 230bp\n% Source: Wave Motions in the Ocean, printed p.74 (physical p.11).\n% Endpoint limits for stratification only (f=0).\n\\begin{center}\n\\begin{tikzpicture}[x=1cm,y=1cm,>=stealth,line cap=round,line join=round,font=\\small]\n  \\draw[->,line width=0.8pt] (0,0)--(0,3.15);\n  \\draw[->,line width=0.8pt] (0,0)--(4.35,0);\n  \\node[anchor=west,align=left] at (0.18,2.72) {$\\phi=0^\\circ$\\\\$\\sigma=N$ (buoyancy oscillations)\\\\$|\\vec c_g|=0$\\\\wavenumber = arbitrary horizontal, $m=0$};\n  \\node[anchor=west,align=left] at (4.05,1.30) {$\\phi=90^\\circ$\\\\$\\sigma=0$ (steady)\\\\$|\\vec c_g|\\ne0$\\\\wavenumber = vertical, $k=\\ell=0$};\n\\end{tikzpicture}\n\\end{center}\n',
 'reconstruction/figures/ch04-p075-rotation-stratification-limits.tikz': '% wave-source: pdf=ChapmanRizzoli4.pdf; page=12; trim=145bp 360bp 135bp 180bp\n% Source: Wave Motions in the Ocean, printed p.75 (physical p.12).\n% Endpoint limits with both rotation and constant stratification.\n\\begin{center}\n\\begin{tikzpicture}[x=1cm,y=1cm,>=stealth,line cap=round,line join=round,font=\\small]\n  \\draw[->,line width=0.8pt] (0,0)--(0,3.25);\n  \\draw[->,line width=0.8pt] (0,0)--(4.50,0);\n  \\node[anchor=west,align=left] at (0.18,2.90) {$\\phi=0^\\circ$\\\\$\\sigma=N$ (buoyancy oscillations)\\\\$|\\vec c_g|=0$\\\\wavenumber = arbitrary horizontal, $m=0$\\\\(columnar structure)};\n  \\node[anchor=west,align=left] at (4.10,1.42) {$\\phi=90^\\circ$\\\\$\\sigma=f$ (inertial oscillations)\\\\$|\\vec c_g|=0$\\\\wavenumber = vertical, $k=\\ell=0$\\\\(layers uncoupled)};\n\\end{tikzpicture}\n\\end{center}\n',
 'reconstruction/figures/ch04-p076-waveguide-boundary-problem.tikz': '% wave-source: pdf=ChapmanRizzoli4.pdf; page=13; trim=105bp 330bp 90bp 245bp\n% Source: Wave Motions in the Ocean, printed p.76 (physical p.13).\n% Waveguide field equation and free-surface/flat-bottom boundary conditions.\n\\begin{center}\n\\begin{tikzpicture}[x=1cm,y=1cm,>=stealth,line cap=round,line join=round,font=\\small]\n  % Free surface: slight waviness is purely schematic.\n  \\draw[line width=0.8pt,samples=120,domain=0:7.2] plot (\\x,{2.35+0.035*sin(420*\\x)});\n  \\node[anchor=west] at (7.35,2.35) {$z=0$};\n  \\node[align=center] at (3.70,3.12) {$(\\sigma^2-f^2)w_z+g(w_{xx}+w_{yy})=0$};\n  \\draw[->] (2.40,2.87)--(2.25,2.42);\n\n  \\node at (3.65,1.40) {$w_{zz}-\\dfrac{N^2-\\sigma^2}{\\sigma^2-f^2}(w_{xx}+w_{yy})=0$};\n\n  \\draw[line width=0.8pt] (0,0)--(7.2,0);\n  \\node[anchor=west] at (7.35,0) {$z=-D$};\n  \\node at (2.55,-0.62) {$w=0$};\n  \\draw[->] (2.55,-0.42)--(2.20,-0.05);\n\\end{tikzpicture}\n\\end{center}\n'}
          for path, content in vectors.items():
              p = Path(path)
              if p.exists():
                  raise SystemExit(f"refusing to overwrite existing vector: {path}")
              p.write_text(content)

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match for {old!r}, found {count}")
              p.write_text(text.replace(old, new, 1))

          replacements = {
              r'\sourceart[0.40]{ChapmanRizzoli4.pdf}{6}{220bp 60bp 195bp 610bp}': r'\wavevectorart[0.46]{ch04-p069-nonrotating-transverse}',
              r'\sourceart[0.46]{ChapmanRizzoli4.pdf}{7}{185bp 350bp 170bp 240bp}': r'\wavevectorart[0.52]{ch04-p070-rotating-transverse}',
              r'\sourceart[0.76]{ChapmanRizzoli4.pdf}{9}{90bp 470bp 80bp 60bp}': r'\wavevectorart[0.76]{ch04-p072-phase-energy-theta}',
              r'\sourceart[0.70]{ChapmanRizzoli4.pdf}{9}{105bp 95bp 95bp 520bp}': r'\wavevectorart[0.72]{ch04-p072-phase-energy-phi}',
              r'\sourceart[0.64]{ChapmanRizzoli4.pdf}{10}{150bp 305bp 135bp 255bp}': r'\wavevectorart[0.72]{ch04-p073-rotation-only-limits}',
              r'\sourceart[0.64]{ChapmanRizzoli4.pdf}{11}{150bp 320bp 130bp 230bp}': r'\wavevectorart[0.72]{ch04-p074-stratification-only-limits}',
              r'\sourceart[0.62]{ChapmanRizzoli4.pdf}{12}{145bp 360bp 135bp 180bp}': r'\wavevectorart[0.72]{ch04-p075-rotation-stratification-limits}',
              r'\sourceart[0.72]{ChapmanRizzoli4.pdf}{13}{105bp 330bp 90bp 245bp}': r'\wavevectorart[0.76]{ch04-p076-waveguide-boundary-problem}',
          }
          for old, new in replacements.items():
              replace_once('reconstruction/chapter4.tex', old, new)

          fp = Path('reconstruction/FIGURES.md')
          text = fp.read_text()
          marker = '| `ch04-p069-dispersion-cone.tikz` | 69 | **vector-complete** | Cone satisfies `m^2=R^2(k^2+ell^2)` and the projected axes/angle are consistent. |'
          new_rows = '\n'.join([
              '| `ch04-p069-nonrotating-transverse.tikz` | 69 | **vector-complete** | Replaces a crop that also contained the following displayed equation. The redraw keeps `u` perpendicular to `k`, the source angle, and `w=u sin(theta)` without duplicated surrounding text. |',
              '| `ch04-p070-rotating-transverse.tikz` | 70 | **vector-complete** | Replaces a crop that extended into the following algebra. `f` is decomposed into components parallel/perpendicular to `k`; `u` remains transverse and the source `k-hat-prime` direction is retained. |',
              '| `ch04-p072-phase-energy-theta.tikz` | 72 | **vector-complete** | Upper `f>N` / `f<N` pair: phase direction and energy direction are perpendicular; the energy arrow reverses side exactly as in the source. |',
              '| `ch04-p072-phase-energy-phi.tikz` | 72 | **vector-complete** | Lower `f>N` / `f<N` pair: `c_g` is the energy direction and phase propagation is perpendicular; replacing the crop prevents the first prose line below the source drawing from entering the figure. |',
              '| `ch04-p073-rotation-only-limits.tikz` | 73 | **vector-complete** | Rotation-only endpoint sketch is reconstructed from the stated limits (`phi=0` Taylor-column limit and `phi=90 deg` inertial limit), excluding the duplicated equation above and prose below. |',
              '| `ch04-p074-stratification-only-limits.tikz` | 74 | **vector-complete** | Stratification-only endpoint sketch preserves the buoyancy-oscillation and steady limits without surrounding source prose. |',
              '| `ch04-p075-rotation-stratification-limits.tikz` | 75 | **vector-complete** | Combined rotation/stratification endpoint sketch preserves the buoyancy and inertial limits and their wavenumber orientations. |',
              '| `ch04-p076-waveguide-boundary-problem.tikz` | 76 | **vector-complete** | Replaces an over-tall crop. The free-surface condition, interior field equation, flat-bottom `w=0`, and `z=0,-D` boundaries are now isolated vector content with no section text and no clipped lower annotation. |',
          ])
          first_new = new_rows.splitlines()[0]
          if first_new not in text:
              if marker not in text:
                  raise SystemExit('FIGURES Chapter 4 insertion marker missing')
              text = text.replace(marker, marker + '\n' + new_rows, 1)

          if 'These 56 placements are real figures even though no separate image file is committed.' not in text:
              raise SystemExit('FIGURES direct-placement count marker missing')
          text = text.replace('These 56 placements are real figures even though no separate image file is committed.',
                              'These 48 placements are real figures even though no separate image file is committed.', 1)
          audit_para = ('The 2026-08-20 source-art pass also treats crop isolation as part of acceptance: '
                        'surrounding prose/equations must not be embedded in a figure, and no scientific label or line may be cut by the trim. '
                        'Eight Chapter 4 crops (printed pp. 69--76) failed or were unnecessarily fragile under that criterion and were replaced by isolated vectors. '
                        'The remaining direct crops below are classified explicitly as vector candidates or deliberate source-art retentions.\n\n')
          anchor = 'Chapter 5 p.97 is a particularly important example:'
          if audit_para not in text:
              pos = text.find(anchor)
              if pos < 0:
                  raise SystemExit('FIGURES direct-crop audit anchor missing')
              text = text[:pos] + audit_para + text[pos:]

          old124 = '| `ch05-p124-amphidromic-pattern.png` | 124 | **edited-raster** | Native embedded 300-ppi CCITT page strips were extracted and deskewed; only the final lossless PNG is retained. Pixel-level source comparison remains an appropriate future provenance check, not a reason to redraw the field. |'
          new124 = '| `ch05-p124-amphidromic-pattern.png` | 124 | **edited-raster** | Native 300-ppi CCITT source art is cropped to the figure band and deskewed losslessly; no surrounding page prose is intended in the retained raster. A future vector version is plausible only by plotting the superposed Kelvin-wave solution and amphidromic geometry, not by tracing the scan. |'
          old126 = '| `ch05-p126-kelvin-turning-corner.png` | 126 | **edited-raster** | Native embedded 300-ppi CCITT page strips were extracted and deskewed; only the final lossless PNG is retained. |'
          new126 = '| `ch05-p126-kelvin-turning-corner.png` | 126 | **edited-raster** | Native 300-ppi CCITT source art is cropped to the figure band and deskewed losslessly; no surrounding page prose is intended in the retained raster. Vectorization should be attempted only from the Kelvin-plus-Poincare boundary-value solution, because a freehand trace could alter the near-corner field. |'
          if old124 in text: text = text.replace(old124, new124, 1)
          if old126 in text: text = text.replace(old126, new126, 1)

          converted_ch4 = {69, 70, 72, 73, 74, 75, 76}
          def disposition(ch: int, printed: int) -> str:
              if ch == 2 and printed in {34, 35}:
                  extra = ' The p.35 crop was already tightened specifically to exclude duplicated prose.' if printed == 35 else ''
                  return '**source-pdf** — retain the source-specific sound-speed profile; generic smoothing would invent profile detail.' + extra
              if ch == 5 and printed == 113:
                  return '**source-pdf** — retain the historical labels because this figure participates in the documented source erratum; a corrected redraw would erase evidence.'
              if ch == 6 and printed == 161:
                  return '**source-pdf** — retain the information-dense full coastal-wave spectrum until every branch/cutoff is reconstructed equation-by-equation.'
              if ch == 5 and printed == 97:
                  return '**vector-candidate (high-risk)** — feasible only with exact spherical projection/tangency construction for longitude/latitude circles and local `u/v/z`; keep source art until then.'
              reasons = {2: 'simple analytic acoustic-wave geometry/dispersion; suitable for a constrained TikZ redraw',
                         3: 'analytic surface-wave geometry or equation-defined schematic; suitable for a constrained redraw',
                         4: 'analytic internal-wave diagram/dispersion sketch; suitable for equation- or geometry-driven TikZ',
                         6: 'analytic topographic/coastal-wave geometry or dispersion sketch; suitable for a constrained redraw'}
              return f'**vector-candidate** — {reasons.get(ch, "simple analytic source figure")}; source crop remains authoritative until replacement is compared.'

          out = []
          in_inventory = False
          row_re = re.compile(r'^\|\s*(\d+)\s*\|\s*(\d+)\s*\|\s*`[^`]+`\s*\|\s*(\d+)\s*\|')
          for line in text.splitlines():
              if line.startswith('## Direct source-PDF crop placements'):
                  in_inventory = True
              if in_inventory:
                  m = row_re.match(line)
                  if m:
                      ch, printed, phys = map(int, m.groups())
                      if ch == 4 and printed in converted_ch4:
                          continue
                      parts = [p.strip() for p in line.split('|')]
                      if len(parts) >= 7:
                          parts[5] = disposition(ch, printed)
                          line = '| ' + ' | '.join(parts[1:-1]) + ' |'
              out.append(line)
          fp.write_text('\n'.join(out) + '\n')
          Path('.github/workflows/figure-source-crop-audit.yml').unlink()
          PY
          git diff --check

      - name: Install comparison dependencies
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install TeX and image tools
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PACKAGES < <(grep -Ev '^\s*(#|$)' tex-packages.txt)
          tlmgr install "${PACKAGES[@]}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils python3-pil

      - name: Regenerate source/vector comparisons
        shell: bash
        run: |
          set -euo pipefail
          for stem in \
            ch04-p069-nonrotating-transverse \
            ch04-p070-rotating-transverse \
            ch04-p072-phase-energy-theta \
            ch04-p072-phase-energy-phi \
            ch04-p073-rotation-only-limits \
            ch04-p074-stratification-only-limits \
            ch04-p075-rotation-stratification-limits \
            ch04-p076-waveguide-boundary-problem \
            ch05-p124-amphidromic-pattern \
            ch05-p126-kelvin-turning-corner; do
            python3 scripts/compare-figures.py "$stem" --dpi 180
          done

      - name: Commit audited figure batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            reconstruction/chapter4.tex \
            reconstruction/FIGURES.md \
            reconstruction/figures/ch04-p069-nonrotating-transverse.tikz \
            reconstruction/figures/ch04-p070-rotating-transverse.tikz \
            reconstruction/figures/ch04-p072-phase-energy-theta.tikz \
            reconstruction/figures/ch04-p072-phase-energy-phi.tikz \
            reconstruction/figures/ch04-p073-rotation-only-limits.tikz \
            reconstruction/figures/ch04-p074-stratification-only-limits.tikz \
            reconstruction/figures/ch04-p075-rotation-stratification-limits.tikz \
            reconstruction/figures/ch04-p076-waveguide-boundary-problem.tikz \
            .github/workflows/figure-source-crop-audit.yml
          git commit -m "Audit retained source art and vector candidates"
          git pull --rebase origin main
          git push origin HEAD:main
