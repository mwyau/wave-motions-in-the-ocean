name: Finalize Chapter 6 figure audit

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: finalize-ch6-figure-audit
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.issue.number == 9 && github.event.comment.body == '/finalize-ch6-figure-audit'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out newest main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply independently checked Chapter 6 audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wave-motions-figure-audit'
          git config user.email '5298134+mwyau@users.noreply.github.com'

          cat > /tmp/apply_ch6_figure_audit.py <<'PY'
          from pathlib import Path
          import math
          import re

          def bisect(fn, a, b, n=140):
              fa = fn(a)
              fb = fn(b)
              if fa * fb > 0:
                  raise SystemExit(f'root not bracketed: {a}, {b}, {fa}, {fb}')
              for _ in range(n):
                  m = (a + b) / 2
                  fm = fn(m)
                  if fa * fm <= 0:
                      b = m
                      fb = fm
                  else:
                      a = m
                      fa = fm
              return (a + b) / 2

          def kroot(ell, n=1):
              return bisect(
                  lambda k: math.tan(k) - k / (ell - 1),
                  (n - 0.5) * math.pi + 1e-9,
                  n * math.pi - 1e-9,
              )

          def sigma(ell, n=1):
              k = kroot(ell, n)
              return -2 * ell / (ell * ell + k * k + 1)

          def branch_maximum(n, lo, hi):
              for _ in range(140):
                  m1 = (2 * lo + hi) / 3
                  m2 = (lo + 2 * hi) / 3
                  if sigma(m1, n) < sigma(m2, n):
                      lo = m1
                  else:
                      hi = m2
              ell = (lo + hi) / 2
              k = kroot(ell, n)
              return ell, k, sigma(ell, n)

          maxima = [
              branch_maximum(1, -3.2, -1.7),
              branch_maximum(2, -6.5, -4.0),
              branch_maximum(3, -10.0, -6.5),
              branch_maximum(4, -14.0, -9.0),
          ]
          ellmax, kmax, sigmax = maxima[0]
          assert abs(ellmax + 2.42327667) < 3e-7
          assert abs(kmax - 2.50909274) < 3e-7
          assert abs(sigmax - 0.36806052) < 3e-7
          fixed_k = -math.sqrt(kmax * kmax + 1)
          assert abs(fixed_k + 2.70102691) < 3e-7
          assert all(maxima[i][2] > maxima[i + 1][2] > 0 for i in range(3))
          assert all(maxima[i][0] > maxima[i + 1][0] for i in range(3))

          chapter = Path('reconstruction/chapter6.tex')
          text = chapter.read_text()
          old = r'''Each mode is constrained to be below some maximum frequency where
$\partial\sigma/\partial\ell=0$. This occurs at
\[
 \ell\big|_{\sigma_{\max}}=-(k^2+b^2)^{1/2}.
\]
'''
          new = r'''Each mode is constrained to be below some maximum frequency where the alongshore
group velocity $d\sigma_n/d\ell$ vanishes along that matched mode. Because the matching
condition makes $k=k_n(\ell)$, differentiating the dispersion relation along a branch gives
\[
 k^2+b^2-\ell^2=2\ell k\frac{dk_n}{d\ell}.
\]
The source obtains $\ell=-(k^2+b^2)^{1/2}$ by differentiating at fixed $k$; that is not
the stationarity condition along a matched modal branch and is recorded in
\texttt{ERRATA.md}.
'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('Chapter 6 p159 source block changed unexpectedly')
              chapter.write_text(text.replace(old, new, 1))

          errata = Path('reconstruction/ERRATA.md')
          er = errata.read_text()
          heading = '### Printed page 159 — modal maximum differentiated at fixed cross-shelf wavenumber'
          start = er.find(heading)
          if start < 0:
              raise SystemExit('Current p159 erratum heading is missing')
          next_heading = er.find('\n### ', start + len(heading))
          if next_heading < 0:
              raise SystemExit('Cannot delimit current p159 erratum')
          section = er[start:next_heading]
          section, n = re.subn(r'- \*\*Status:\*\* `pending-review`', '- **Status:** `accepted`', section, count=1)
          if n == 0 and '- **Status:** `accepted`' not in section:
              raise SystemExit('Unexpected p159 erratum status')
          old_recon = ('- **Reconstruction:** Unchanged pending canonical correction; issue #9 independently\n'
                       '  identified the same source error from the figure-equation audit.')
          new_recon = ('- **Reconstruction:** The canonical chapter now differentiates along the matched modal branch,\n'
                       '  giving $k^2+b^2-\\ell^2=2\\ell k\\,dk_n/d\\ell$.')
          if new_recon not in section:
              if section.count(old_recon) != 1:
                  raise SystemExit('Unexpected p159 Reconstruction text')
              section = section.replace(old_recon, new_recon, 1)
          er = er[:start] + section + er[next_heading:]

          # The historical upper p.159 matching-condition sketch carries labels that
          # contradict the matching relation derived on p.158. Preserve the historical
          # error in the ledger while keeping the corrected equation-generated vector.
          fig_heading = '### Printed page 159 — matching-condition figure labels'
          if fig_heading not in er:
              insert_at = er.find(heading)
              figure_erratum = r'''### Printed page 159 — matching-condition figure labels

- **Category:** `figure`
- **Status:** `accepted`
- **Location:** Chapter 6, printed page 159, upper figure
- **Original:** The straight matching line is labeled $-k/(\ell+b)$ and the near-horizontal
  limiting line is labeled $\ell=\infty$.
- **Reconstruction:** The equation-generated root plot uses the derived matching relation
  $\tan kL=k/(\ell-b)=-k/(b-\ell)$. Under the chapter convention $\ell<0$, the
  near-horizontal limit is $\ell\to-\infty$.
- **Reason/evidence:** Continuity of $\psi$ and $\psi_x$ at $x=L$ gives the displayed
  matching relation directly. The source labels are incompatible with that derivation;
  the corrected vector remains tied to the source page through its `wave-source` record.

'''
              er = er[:insert_at] + figure_erratum + er[insert_at:]
          errata.write_text(er)

          figures = Path('reconstruction/FIGURES.md')
          fig = figures.read_text()
          lines = fig.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith('| 6 | 159 | `ChapmanRizzoli6.pdf` | 12 |')]
          if len(matches) != 1:
              raise SystemExit(f'Expected one direct p159 row, found {len(matches)}')
          i = matches[0]
          parts = lines[i].split('|')
          current = parts[5].strip()
          if current == '**Pending**':
              parts[5] = ' **Validated** '
              parts[6] = (' **source-pdf** — deliberately retain the historical full modal dispersion diagram. '
                          'The coupled matching/dispersion branches were independently solved: for `b=L=f=1` '
                          'the first branch maximum is `ell=-2.42327667`, `k=2.50909274`, `sigma=0.36806052`, '
                          'and the first four branches preserve the source ordering and one-maximum shape. '
                          'The source fixed-`k` maximum condition is a documented historical equation error. ')
              lines[i] = '|'.join(parts)
              fig = '\n'.join(lines) + '\n'
          elif current != '**Validated**':
              raise SystemExit(f'Unexpected direct p159 state: {current}')

          states = ('Validated', 'Partial', 'Pending', 'N/A')
          counts = {s: sum(1 for line in fig.splitlines() if line.startswith('|') and f'**{s}**' in line) for s in states}
          expected = {'Validated': 83, 'Partial': 6, 'Pending': 1, 'N/A': 15}
          if counts != expected:
              raise SystemExit(f'Unexpected post-p159 counts: {counts}')
          summary = ('Current snapshot across the 105 tracked body/front-matter assets and direct source placements: '
                     '**83 Validated, 6 Partial, 1 Pending, 15 N/A**.')
          fig, n = re.subn(
              r'Current snapshot across the 105 tracked body/front-matter assets and direct source placements: '
              r'\*\*\d+ Validated, \d+ Partial, \d+ Pending, \d+ N/A\*\*\.',
              summary,
              fig,
              count=1,
          )
          if n != 1:
              raise SystemExit('FIGURES summary anchor missing')
          figures.write_text(fig)
          PY

          success=false
          for attempt in $(seq 1 20); do
            git fetch origin main
            git reset --hard origin/main
            python3 /tmp/apply_ch6_figure_audit.py
            python3 scripts/sync-views.py --readme
            python3 scripts/sync-views.py --check-readme
            rm -f .github/workflows/finalize-ch6-figure-audit.yml
            git diff --check
            git add -- reconstruction/chapter6.tex reconstruction/ERRATA.md reconstruction/FIGURES.md README.md .github/workflows/finalize-ch6-figure-audit.yml
            git diff --cached --check
            if git diff --cached --quiet; then
              final_sha=$(git rev-parse HEAD)
              echo "FINAL_SHA=$final_sha" >> "$GITHUB_ENV"
              success=true
              break
            fi
            git commit -m 'Correct continental shelf wave maximum'
            if git push origin HEAD:main; then
              final_sha=$(git rev-parse HEAD)
              echo "FINAL_SHA=$final_sha" >> "$GITHUB_ENV"
              success=true
              break
            fi
            echo 'main advanced before push; retrying from newest main'
          done
          test "$success" = true

      - name: Validate canonical publication build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 120); do
            run_id=$(gh run list --workflow publish.yml --commit "$FINAL_SHA" --event push --limit 10 \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 2
          done
          test -n "$run_id"
          echo "BUILD_RUN_ID=$run_id" >> "$GITHUB_ENV"
          gh run watch "$run_id" --exit-status

      - name: Record checkpoint on issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 9 --body "Chapter 6 p.159 integrated in \`$FINAL_SHA\` and canonical publication validation run \`$BUILD_RUN_ID\` passed. FIGURES.md is now 83 Validated / 6 Partial / 1 Pending / 15 N/A; only Ch.4 p.91 remains pending. The p.159 source equation/figure-label errors are recorded in ERRATA.md, and the temporary p.159 finalizer deleted itself in the source commit."
