name: Import cover image

on:
  push:
    paths:
      - .github/workflows/import-cover-image.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download The Met Open Access image
        run: |
          set -euo pipefail
          dest=reconstruction/figures/frontmatter/great-wave-met-dp130155.jpg
          mkdir -p "$(dirname "$dest")"
          curl -fL --retry 5 --retry-delay 2 \
            https://images.metmuseum.org/CRDImages/as/original/DP130155.jpg \
            -o "$dest"
          test -s "$dest"
          test "$(stat -c %s "$dest")" -gt 1000000
          python3 - <<'PY'
          from pathlib import Path
          p = Path("reconstruction/figures/frontmatter/great-wave-met-dp130155.jpg")
          data = p.read_bytes()
          if not (data.startswith(b"\xff\xd8") and data.endswith(b"\xff\xd9")):
              raise SystemExit("download is not a complete JPEG")
          print(f"Downloaded {p}: {len(data)} bytes")
          PY

      - name: Commit image
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reconstruction/figures/frontmatter/great-wave-met-dp130155.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import Met Open Access cover image"
          git push
