name: One-time Chapter 3 figure integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out current main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply audited Chapter 3 vector batches
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "Run Chapter 3 figure integration" ]; then
            exit 0
          fi
          git config user.name 'wave-motions-figure-audit'
          git config user.email '5298134+mwyau@users.noreply.github.com'

          awk '
            /cat > \/tmp\/vector_helpers.py <<.PY./ {capture=1; next}
            capture && /^          PY$/ {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/vectorize-source-candidates.yml > /tmp/vector_helpers.py
          python3 -m py_compile /tmp/vector_helpers.py

          python3 - <<'PY'
          import sys
          sys.path.insert(0, '/tmp')
          from vector_helpers import gen_batch1, patch
          gen_batch1()
          rows = [
            '| `ch03-p039-surface-boundaries.tikz` | 39 | **vector-complete** | **Validated** | Free surface `z=eta` near `z=0` and rigid bottom `z=-D` are preserved; the adjacent kinematic/dynamic conditions and bottom no-normal-flow condition were checked against the reconstructed derivation. Surface waviness is schematic. |',
            '| `ch03-p042-surface-wave-dispersion.tikz` | 42 | **vector-complete** | **Validated** | The curve is generated from normalized `S=sqrt(K tanh K)`. Independent limiting checks recover `S~K` for `K<<1` and `S~sqrt(K)` for `K>>1`, with positive monotone branch and correct asymptotic ordering. |',
            '| `ch03-p044-two-fluid-interface.tikz` | 44 | **vector-complete** | **Validated** | Two semi-infinite potential-flow regions meet at `z=eta` near `z=0`; `nabla^2 phi_1=nabla^2 phi_2=0` and the common interface geometry match the independently checked decay and matching construction. Interface waviness is schematic. |',
          ]
          patch([
            (r'\sourceart[0.66]{ChapmanRizzoli3.pdf}{3}{150bp 505bp 125bp 80bp}', r'% Vector reconstruction; source PDF ChapmanRizzoli3.pdf, physical page 3, trim=150bp 505bp 125bp 80bp.\n\wavevectorart[0.66]{ch03-p039-surface-boundaries}', 'ch03-p039-surface-boundaries'),
            (r'\sourceart[0.40]{ChapmanRizzoli3.pdf}{7}{225bp 250bp 225bp 475bp}', r'% Vector reconstruction; source PDF ChapmanRizzoli3.pdf, physical page 7, trim=225bp 250bp 225bp 475bp.\n\wavevectorart[0.50]{ch03-p042-surface-wave-dispersion}', 'ch03-p042-surface-wave-dispersion'),
            (r'\sourceart[0.64]{ChapmanRizzoli3.pdf}{9}{165bp 500bp 130bp 85bp}', r'% Vector reconstruction; source PDF ChapmanRizzoli3.pdf, physical page 9, trim=165bp 500bp 130bp 85bp.\n\wavevectorart[0.64]{ch03-p044-two-fluid-interface}', 'ch03-p044-two-fluid-interface'),
          ], rows, [(3,39,'ChapmanRizzoli3.pdf',3,1),(3,42,'ChapmanRizzoli3.pdf',7,1),(3,44,'ChapmanRizzoli3.pdf',9,1)], first_ch3=True)
          PY
          git diff --check
          git add -- reconstruction/chapter3.tex reconstruction/FIGURES.md reconstruction/figures/ch03-p039-surface-boundaries.tikz reconstruction/figures/ch03-p042-surface-wave-dispersion.tikz reconstruction/figures/ch03-p044-two-fluid-interface.tikz
          git commit -m 'Reconstruct Chapter 3 boundary and dispersion figures'
          git fetch origin main && git rebase origin/main && git push origin HEAD:main

          python3 - <<'PY'
          import sys
          sys.path.insert(0, '/tmp')
          from vector_helpers import gen_batch2, patch
          gen_batch2()
          anchor='| `ch03-p044-two-fluid-interface.tikz` | 44 | **vector-complete** | **Validated** | Two semi-infinite potential-flow regions meet at `z=eta` near `z=0`; `nabla^2 phi_1=nabla^2 phi_2=0` and the common interface geometry match the independently checked decay and matching construction. Interface waviness is schematic. |'
          rows=[
            '| `ch03-p052-delta-snapshot.tikz` | 52 | **vector-complete** | **Validated** | Snapshot is generated directly from `eta proportional to t x^(-3/2) cos(g t^2/(4x)+pi/4)` at fixed `t`; independent differentiation of the phase confirms local wavelength grows with `x`, while the explicit envelope decays as `x^(-3/2)`. |',
            '| `ch03-p052-delta-wavestaff.tikz` | 52 | **vector-complete** | **Validated** | Fixed-position record is generated from the same asymptotic solution: amplitude envelope grows linearly in `t` and instantaneous frequency grows in magnitude with `t`, so oscillations tighten while the envelope expands. |',
          ]
          patch([
            (r'\sourceart[0.66]{ChapmanRizzoli3.pdf}{17}{145bp 445bp 140bp 285bp}', r'% Equation-generated vector reconstruction of the fixed-time asymptotic snapshot.\n\wavevectorart[0.66]{ch03-p052-delta-snapshot}', 'ch03-p052-delta-snapshot'),
            (r'\sourceart[0.62]{ChapmanRizzoli3.pdf}{17}{160bp 250bp 150bp 470bp}', r'% Equation-generated vector reconstruction of the fixed-position wavestaff record.\n\wavevectorart[0.62]{ch03-p052-delta-wavestaff}', 'ch03-p052-delta-wavestaff'),
          ], rows, [(3,52,'ChapmanRizzoli3.pdf',17,2)], insert_after=anchor)
          PY
          git diff --check
          git add -- reconstruction/chapter3.tex reconstruction/FIGURES.md reconstruction/figures/ch03-p052-delta-snapshot.tikz reconstruction/figures/ch03-p052-delta-wavestaff.tikz
          git commit -m 'Reconstruct Chapter 3 dispersive initial-value figures'
          git fetch origin main && git rebase origin/main && git push origin HEAD:main

          python3 - <<'PY'
          import sys
          sys.path.insert(0, '/tmp')
          from vector_helpers import gen_batch3, patch
          gen_batch3()
          anchor='| `ch03-p052-delta-wavestaff.tikz` | 52 | **vector-complete** | **Validated** | Fixed-position record is generated from the same asymptotic solution: amplitude envelope grows linearly in `t` and instantaneous frequency grows in magnitude with `t`, so oscillations tighten while the envelope expands. |'
          rows=[
            '| `ch03-p055-ship-wave-geometry.tikz` | 55 | **vector-complete** | **Validated** | Triangle components are constructed exactly so `rho(t)^2=r^2+V^2t^2+2Vtr cos(theta)` for `t<0`; horizontal and vertical projections reproduce the source labels rather than tracing the scan. |',
            '| `ch03-p056-kelvin-wake.tikz` | 56 | **vector-complete** | **Validated** | Both crest families are generated from constant `P(t_+)` and `P(t_-)` after substituting the stationary times. The independently evaluated cusp condition `cos^2(theta)=8/9` gives `theta=19 deg 28 min`; phase constants only set crest spacing. |',
            '| `ch03-p056-shallow-mach-cone.tikz` | 56 | **vector-complete** | **Validated** | Wave circles have radius `c|t|` and centers displaced by `V|t|`; common tangency therefore gives the exact cone relation `sin(theta)=c/V`. The displayed `c/V=0.4` is illustrative. |',
          ]
          patch([
            (r'\sourceart[0.73]{ChapmanRizzoli3.pdf}{20}{120bp 520bp 95bp 75bp}', r'% Constraint-generated ship/source geometry.\n\wavevectorart[0.73]{ch03-p055-ship-wave-geometry}', 'ch03-p055-ship-wave-geometry'),
            (r'\sourceart[0.70]{ChapmanRizzoli3.pdf}{21}{125bp 400bp 115bp 135bp}', r'% Stationary-phase Kelvin-wake crest reconstruction.\n\wavevectorart[0.70]{ch03-p056-kelvin-wake}', 'ch03-p056-kelvin-wake'),
            (r'\sourceart[0.69]{ChapmanRizzoli3.pdf}{21}{130bp 170bp 105bp 430bp}', r'% Nondispersive Mach-cone reconstruction.\n\wavevectorart[0.69]{ch03-p056-shallow-mach-cone}', 'ch03-p056-shallow-mach-cone'),
          ], rows, [(3,55,'ChapmanRizzoli3.pdf',20,1),(3,56,'ChapmanRizzoli3.pdf',21,2)], insert_after=anchor)
          PY
          git diff --check
          git add -- reconstruction/chapter3.tex reconstruction/FIGURES.md reconstruction/figures/ch03-p055-ship-wave-geometry.tikz reconstruction/figures/ch03-p056-kelvin-wake.tikz reconstruction/figures/ch03-p056-shallow-mach-cone.tikz
          git commit -m 'Reconstruct Chapter 3 ship-wave figures'
          git fetch origin main && git rebase origin/main && git push origin HEAD:main

          python3 - <<'PY'
          import sys
          sys.path.insert(0, '/tmp')
          from vector_helpers import gen_batch4, patch
          gen_batch4()
          anchor='| `ch03-p056-shallow-mach-cone.tikz` | 56 | **vector-complete** | **Validated** | Wave circles have radius `c|t|` and centers displaced by `V|t|`; common tangency therefore gives the exact cone relation `sin(theta)=c/V`. The displayed `c/V=0.4` is illustrative. |'
          rows=[
            '| `ch03-p061-following-current-dispersion.tikz` | 61 | **vector-complete** | **Validated** | Curves and marked roots independently solve normalized `sqrt(k tanh k)=1-Uk`; increasing following current shifts the physical root to smaller `k`, and the upper wave is generated from those local roots so its wavelength lengthens. |',
            '| `ch03-p062-opposing-current-blocking.tikz` | 62 | **vector-complete** | **Validated** | Curves solve `sqrt(k tanh k)=1+|U|k`. Independent tangency calculation gives the blocking limit from `f(k)-k fprime(k)=1`; the small-`k` root moves to larger `k` as the opposing current strengthens. |',
            '| `ch03-p063-shear-current-refraction.tikz` | 63 | **vector-complete** | **Validated** | Deep-water ray is integrated from the absolute group velocity while enforcing constant `sigma` and `ell`, `k^2=(sigma-ell V)^4/g^2-ell^2`, and `ell=K sin(theta)`. The component triangle terminates exactly at the wavevector tip; the chosen smooth `V(x)` profile is illustrative. |',
          ]
          patch([
            (r'\sourceart[0.80]{ChapmanRizzoli3.pdf}{26}{70bp 80bp 55bp 325bp}', r'% Equation-generated following-current reconstruction.\n\wavevectorart[0.80]{ch03-p061-following-current-dispersion}', 'ch03-p061-following-current-dispersion'),
            (r'\sourceart[0.80]{ChapmanRizzoli3.pdf}{27}{75bp 330bp 55bp 95bp}', r'% Equation-generated opposing-current/blocking reconstruction.\n\wavevectorart[0.80]{ch03-p062-opposing-current-blocking}', 'ch03-p062-opposing-current-blocking'),
            (r'\sourceart[0.48]{ChapmanRizzoli3.pdf}{28}{145bp 480bp 110bp 65bp}', r'% Equation-generated shear-current refraction reconstruction.\n\wavevectorart[0.48]{ch03-p063-shear-current-refraction}', 'ch03-p063-shear-current-refraction'),
          ], rows, [(3,61,'ChapmanRizzoli3.pdf',26,1),(3,62,'ChapmanRizzoli3.pdf',27,1),(3,63,'ChapmanRizzoli3.pdf',28,1)], insert_after=anchor)
          PY
          git diff --check
          git add -- reconstruction/chapter3.tex reconstruction/FIGURES.md reconstruction/figures/ch03-p061-following-current-dispersion.tikz reconstruction/figures/ch03-p062-opposing-current-blocking.tikz reconstruction/figures/ch03-p063-shear-current-refraction.tikz
          git commit -m 'Reconstruct Chapter 3 current-refraction figures'
          git fetch origin main && git rebase origin/main && git push origin HEAD:main
