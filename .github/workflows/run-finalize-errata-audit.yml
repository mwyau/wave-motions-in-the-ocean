name: Run final errata audit

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: finalize-audited-source-errata-comment
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.issue.number == 7 && github.event.comment.body == '/finalize-audited-source-errata'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out newest main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install README sync dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Apply reviewed issue 7 patch in checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('.github/workflows/finalize-errata-audit.yml')
          text = path.read_text()
          opener = "          cat > /tmp/apply_errata.py <<'PY'\n"
          closer = "\n          PY\n\n          success=false"
          if opener not in text or closer not in text:
              raise SystemExit('cannot locate reviewed errata patch in finalizer')
          code = text.split(opener, 1)[1].split(closer, 1)[0]
          Path('/tmp/apply_errata.py').write_text(textwrap.dedent(code))
          PY

          success=false
          for attempt in $(seq 1 20); do
            git fetch origin main
            git reset --hard origin/main
            python3 /tmp/apply_errata.py

            # Issue #9 owns FIGURES.md reconciliation after #7 releases ERRATA.md.
            git restore -- reconstruction/FIGURES.md

            python3 scripts/sync-views.py --readme
            python3 scripts/sync-views.py --check-readme
            git diff --check

            # Checkpoint 1: scientific source corrections.
            git add -- reconstruction/chapter4.tex reconstruction/chapter5.tex README.md
            git diff --cached --check
            if ! git diff --cached --quiet; then
              git commit -m "Correct audited wave relations"
            fi

            # Checkpoint 2: records and all #7-owned temporary automation.
            rm -f \
              .github/workflows/finalize-errata-audit.yml \
              .github/workflows/run-finalize-errata-audit.yml \
              .github/workflows/run-audited-errata-finalizer.yml \
              .github/errata-audit-finalize.trigger

            git add -- \
              reconstruction/ERRATA.md \
              reconstruction/PLAN.md \
              .github/workflows/finalize-errata-audit.yml \
              .github/workflows/run-finalize-errata-audit.yml \
              .github/workflows/run-audited-errata-finalizer.yml \
              .github/errata-audit-finalize.trigger
            git diff --cached --check
            if ! git diff --cached --quiet; then
              git commit -m "Resolve audited source errata records"
            fi

            if git diff --quiet && git diff --cached --quiet && git push origin HEAD:main; then
              final_sha=$(git rev-parse HEAD)
              echo "FINAL_SHA=$final_sha" >> "$GITHUB_ENV"
              success=true
              break
            fi
          done
          test "$success" = true

      - name: Dispatch canonical publication validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish.yml --ref main
          run_id=""
          for _ in $(seq 1 90); do
            run_id=$(gh run list --workflow publish.yml --branch main --event workflow_dispatch --limit 30 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"$FINAL_SHA\") | .databaseId" | head -n1)
            [ -n "$run_id" ] && break
            sleep 2
          done
          test -n "$run_id"
          echo "PUBLISH_RUN_ID=$run_id" >> "$GITHUB_ENV"
          gh run watch "$run_id" --exit-status

      - name: Record completion and close issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Completed #7 at $FINAL_SHA. Canonical Publish run $PUBLISH_RUN_ID passed. The source corrections were committed separately from ERRATA/PLAN and temporary-automation cleanup; FIGURES.md was left to #9 as coordinated."
          gh issue close "${{ github.event.issue.number }}" --reason completed
