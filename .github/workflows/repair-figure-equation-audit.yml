name: Repair one-time figure equation audit checkpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair figure equation audit checkpoint'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Repair stale p16 assertion and retrigger audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wave-motions-figure-audit'
          git config user.email '5298134+mwyau@users.noreply.github.com'
          git fetch origin main
          git merge --ff-only origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/figure-equation-audit-checkpoint.yml')
          t=p.read_text()
          old="""          assert abs((2.02-1.72)/(6.75-1.60) - (2.02-1.875)/(6.75-4.26)) < 1e-12
"""
          new="""          rayfrac=(3.15-.95)/(6.10-.95)
          x1=1.75+(6.35-1.75)*rayfrac
          x2=6.05+(6.35-6.05)*rayfrac
          assert abs((x1-1.75)/(3.15-.95) - (6.35-1.75)/(6.10-.95)) < 1e-12
          assert abs((x2-6.05)/(3.15-.95) - (6.35-6.05)/(6.10-.95)) < 1e-12
"""
          if t.count(old) != 1:
              raise SystemExit('stale p16 assertion not found exactly once')
          p.write_text(t.replace(old,new,1))
          PY
          rm -- .github/workflows/repair-figure-equation-audit.yml
          rm -f -- .github/figure-equation-audit-retry.trigger
          git diff --check
          git add -- .github/workflows/figure-equation-audit-checkpoint.yml .github/workflows/repair-figure-equation-audit.yml .github/figure-equation-audit-retry.trigger
          git commit -m 'Run independent equation figure audit checkpoint'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
