name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub recommends allowing an in-progress production Pages deployment to
# finish. New pushes may replace a queued run, but must not interrupt the
# deployment that is already publishing the site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache TinyTeX
        id: tinytex-cache
        uses: actions/cache@v5
        with:
          path: ~/.TinyTeX
          key: wave-motions-tinytex-${{ runner.os }}-${{ hashFiles('tex-packages.txt') }}
          restore-keys: |
            wave-motions-tinytex-${{ runner.os }}-

      - name: Detect restored TinyTeX
        id: tinytex-state
        shell: bash
        run: |
          if [ -d "$HOME/.TinyTeX/bin" ] && find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | grep -q .; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install TinyTeX if absent
        if: steps.tinytex-state.outputs.installed != 'true'
        uses: r-lib/actions/setup-tinytex@v2

      - name: Add TinyTeX to PATH
        shell: bash
        run: |
          set -euo pipefail
          TEXBIN=$(find "$HOME/.TinyTeX/bin" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$TEXBIN"
          echo "$TEXBIN" >> "$GITHUB_PATH"
          echo "TEXBIN=$TEXBIN" >> "$GITHUB_ENV"

      - name: Install TeX dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TEXBIN:$PATH"
          mapfile -t PACKAGES < <(grep -Ev '^\s*(#|$)' tex-packages.txt)
          tlmgr install "${PACKAGES[@]}"

      - name: Install system validation tools
        env:
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            qpdf poppler-utils imagemagick ghostscript python3-pil pandoc

      - name: Build PDFs and generated HTML site
        run: ./scripts/build.sh all

      - name: Verify Pages root and downloads
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/html/index.html
          test -s dist/html/wave-motions-1989-facsimile.pdf
          test -s dist/html/wave-motions-1989-modern.pdf
          grep -q 'wave-motions-1989-facsimile.pdf' dist/html/index.html
          grep -q 'wave-motions-1989-modern.pdf' dist/html/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload generated HTML as Pages root
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated HTML site
        id: deployment
        uses: actions/deploy-pages@v5
