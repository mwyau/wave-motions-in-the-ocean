name: One-time errata audit corrections

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  correct:
    if: github.event.head_commit.message == 'Apply audited errata corrections'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply audited corrections
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          def replace_section(path: str, heading: str, next_heading: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(heading) != 1:
                  raise SystemExit(f'{path}: heading match count is {text.count(heading)}: {heading!r}')
              start = text.index(heading)
              end = text.index(next_heading, start + len(heading))
              p.write_text(text[:start] + replacement.rstrip() + '\n\n' + text[end:])

          # Chapter 4: preserve signed component relations while making magnitude
          # formulas valid on both forward- and backward-reflection branches.
          replace_once(
              'reconstruction/chapter4.tex',
              r'''After some algebra, the result is
\[
 |\vec k_r|=|\vec k_i|\left(\frac{1+aR}{1-aR}\right).
\]
The incident and reflected wavenumbers lie on the two characteristic directions''',
              r'''After some algebra, the result for the wavenumber magnitudes is
\[
 |\vec k_r|=|\vec k_i|\left|\frac{1+aR}{1-aR}\right|.
\]
The corresponding signed horizontal-component relation is
$k_r/k_i=(1+aR)/(1-aR)$. The incident and reflected wavenumbers lie on the two characteristic directions'''
          )
          replace_once(
              'reconstruction/chapter4.tex',
              r'''Again we can use geometry to obtain
\[
 |\vec v_r|=|\vec v_i|\left(\frac{1+aR}{1-aR}\right).
\]
''',
              r'''Again we can use geometry to obtain
\[
 |\vec v_r|=|\vec v_i|\left|\frac{1+aR}{1-aR}\right|.
\]
The source omits the outer absolute value in both magnitude ratios; this fails on the
$aR>1$ branch and is recorded in \texttt{ERRATA.md}.
'''
          )

          # Chapter 5, p. 113: the matching equations retain their form, not their
          # literal D1/D2 labels, when incidence is reversed.
          replace_once(
              'reconstruction/chapter5.tex',
              "In this case, the reflected and transmitted amplitudes are still given by the above\n"
              "formulas and Snell's law still holds.",
              "In this case, the same matching formulas apply only after interchanging the incident\n"
              "and transmitted region labels; Snell's law still holds."
          )

          # Chapter 5, p. 129: sigma/k and sigma/ell are coordinate-axis phase-plane
          # intersection speeds, not components of the normal phase-velocity vector.
          replace_once(
              'reconstruction/chapter5.tex',
              "The phase speed $c$ \\emph{always} has\n"
              "a westward component for whatever value of $\\ell$ we choose. In general",
              "For general $\\ell$, the phase planes still have no eastward zonal phase-velocity\n"
              "component. The coordinate-axis phase speeds (phase-plane intersection speeds, where\n"
              "defined) are"
          )
          replace_once(
              'reconstruction/chapter5.tex',
              r''' =-\frac{\beta k}{\ell(k^2+\ell^2)}.
\]
These waves are called \emph{Rossby waves}.''',
              r''' =-\frac{\beta k}{\ell(k^2+\ell^2)}.
\]
These are not vector components. The normal phase-velocity vector is
$\vec c_p=\sigma\vec k/(k^2+\ell^2)$, whose zonal component is nonpositive for the
Rossby dispersion relation. These waves are called \emph{Rossby waves}.'''
          )

          # Chapter 5, pp. 146--147: use an integrated WKB phase and group-velocity
          # rays consistently with the retained beta*k/sigma term. Also correct the
          # k=0 and nonzero-k turning-point consequences of that ray equation.
          p = Path('reconstruction/chapter5.tex')
          text = p.read_text()
          start_marker = "We know that trapping means that a wave decays exponentially away from some boundary.\n"
          end_marker = "\\sourcepagebreak\n\n% -----------------------------------------------------------------------------\n% Source printed page 148 / source physical page 53\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = r'''We know that trapping means that a wave decays exponentially away from some boundary.
We have seen that this corresponds to the total reflection of wave rays as well.
Therefore, it is useful to examine these equatorial waves with the ray method discussed
earlier in the course. At leading local-plane-wave/WKB order, write the phase so that
$\ell(y)$ is the meridional phase gradient,
\[
 v=v_0(y)\exp\left[-i\sigma t+ikx+i\int^y\ell(y')\,dy'\right].
\]
Neglecting derivatives of the slowly varying amplitude and local wavenumber gives,
with $c=(gD)^{1/2}$,
\[
 \ell^2(y)=\frac{\sigma^2}{c^2}-k^2-\frac{\beta k}{\sigma}
 -\frac{\beta^2y^2}{c^2}.
\]
A ray follows the group velocity. Retaining the same local dispersion relation and
defining
\[
 k_*\equiv k+\frac{\beta}{2\sigma},
\]
implicit differentiation gives
\[
 \frac{dy}{dx}=\frac{c_{gy}}{c_{gx}}
 =\frac{2\ell}{2k+\beta/\sigma}
 =\frac{\ell}{k_*}.
\]
For $k_*\ne0$, define the group-ray angle at the equator by
\[
 \tan\theta_0=\frac{\ell(0)}{k_*}.
\]
Integrating the ray equation then gives
\[
 y=\frac{c k_*}{\beta}\tan\theta_0
 \sin\left(\frac{\beta}{c k_*}x+\mathrm{const}\right).
\]
Thus generic rays are sinusoids about the equator. If $k_*=0$, then $c_{gx}=0$ and
$x$ is not a valid parameter for the ray. The historical phase and ray expressions use
$\ell(y)y$ and $dy/dx=\ell/k$; these corrections are documented in
\texttt{ERRATA.md}.

\sourcepagebreak

% -----------------------------------------------------------------------------
% Source printed page 147 / source physical page 52
% -----------------------------------------------------------------------------
% Vector reconstruction; source PDF ChapmanRizzoli5.pdf, physical page 52, trim=175bp 505bp 150bp 45bp.
\wavevectorart[0.55]{ch05-p147-equatorial-ray}

The generic rays go back and forth between the two turning coordinates $\pm y_T$,
being continuously refracted by the varying $f=\beta y$, which models the curvature
of the earth. The turning points are where $\ell=0$, so
\[
 \boxed{
 y_T=\frac{c}{\beta}
 \left(\frac{\sigma^2}{c^2}-k^2-\frac{\beta k}{\sigma}\right)^{1/2}
 =\frac{c}{\beta}|k_*\tan\theta_0|
 }.
\]
The source denotes this dimensional meridional distance by $\theta_T$; see
\texttt{ERRATA.md}.

For $k=0$, the turning points reduce exactly to the inertial latitudes,
$y=\pm|\sigma|/\beta$. The corrected group-velocity ray is not a straight
north--south line, however, because then $k_*=\beta/(2\sigma)$ and $c_{gx}\ne0$.
For $\sigma k>0$, nonzero $k$ moves the turning points equatorward. For
$\sigma k<0$, the retained $\beta k/\sigma$ term can instead move them poleward or
equatorward depending on the branch. The inertial latitudes are therefore the familiar
gravity-wave turning scale when the Rossby-coupling term is negligible, but they are
not a universal hard bound for every equatorial branch when that term is retained.
Beyond a given turning coordinate the WKB meridional wavenumber becomes imaginary and
the wave is evanescent rather than abruptly terminated. Furthermore, the decay scale
is very different for the barotropic waves versus their baroclinic counterparts. An
analysis of the Hermite functions shows that

'''
          p.write_text(text[:start] + replacement + text[end:])

          # ERRATA: resolve every remaining pending item, correct the false contents
          # finding, and make the evidence literal to the audited reconstruction.
          replace_section(
              'reconstruction/ERRATA.md',
              '### Printed page 90 — signed versus magnitude wavenumber ratio\n',
              '## Chapter 5\n',
              r'''### Printed page 90 — signed versus magnitude reflection ratios

- **Category:** `equation`
- **Status:** `accepted`
- **Location:** Chapter 4, printed pages 90--91
- **Original:** The source writes both
  $|\vec k_r|=|\vec k_i|(1+aR)/(1-aR)$ and
  $|\vec v_r|=|\vec v_i|(1+aR)/(1-aR)$ as magnitude relations.
- **Reconstruction:** The signed component relation is retained as
  $k_r/k_i=(1+aR)/(1-aR)$, while the magnitude relations use
  $|(1+aR)/(1-aR)|$.
- **Reason/evidence:** Equality of phase along the wall $z=ax$, together with
  $m_i=Rk_i$ and $m_r=-Rk_r$, gives the signed component ratio directly. Magnitudes
  cannot be negative, so the outer absolute value is required. The following source
  page explicitly depicts both forward and backward reflection on opposite sides of
  the critical $aR\simeq1$ regime, so there is no global $aR<1$ restriction that makes
  the printed magnitude equations valid.'''
          )
          replace_section(
              'reconstruction/ERRATA.md',
              '### Printed page 111 — “Lamb (1832)”\n',
              '### Printed page 113 — reversed depth and cross-step-wavenumber labels\n',
              r'''### Printed page 111 — “Lamb (1832)”

- **Category:** `reference`
- **Status:** `accepted`
- **Location:** Chapter 5, printed page 111
- **Original:** “Lamb (1832)”
- **Reconstruction:** “Lamb (1932)”
- **Reason/evidence:** Cambridge University Press records *Hydrodynamics*, sixth
  edition, as a 1932 publication. The bibliography's 1945 Dover volume is the later
  reprint of that sixth edition, so retaining the historical bibliography entry is
  compatible with correcting the in-text edition year to 1932.'''
          )
          replace_section(
              'reconstruction/ERRATA.md',
              '### Printed page 113 — reversed-incidence amplitude coefficients\n',
              '### Printed page 116 — “waves modes”\n',
              r'''### Printed page 113 — reversed-incidence amplitude coefficients

- **Category:** `equation`
- **Status:** `accepted`
- **Location:** Chapter 5, printed page 113
- **Original:** On reversing the incidence direction, the text says that the reflected
  and transmitted amplitudes are “still given by the above formulas.”
- **Reconstruction:** The text states that the same matching formulas apply only after
  interchanging the incident and transmitted region labels.
- **Reason/evidence:** For shallow-side incidence, elevation and transport matching give
  $A_I+A_R=A_T$ and
  $D_1k_1(A_I-A_R)=D_2k_2A_T$. Hence
  $A_R/A_I=(D_1k_1-D_2k_2)/(D_1k_1+D_2k_2)$ and
  $A_T/A_I=2D_1k_1/(D_1k_1+D_2k_2)$. The matching structure is unchanged, but the
  preceding deep-side-incidence coefficients do not remain literally unchanged.'''
          )
          replace_section(
              'reconstruction/ERRATA.md',
              '### Printed page 129 — coordinate phase speeds described as components\n',
              '### Printed page 130 — “aditional”\n',
              r'''### Printed page 129 — coordinate phase speeds described as components

- **Category:** `editorial`
- **Status:** `accepted`
- **Location:** Chapter 5, printed page 129
- **Original:** After stating that phase speed has a westward component, the text writes
  $c_x=\sigma/k$ and $c_y=\sigma/\ell$ as though these were vector components.
- **Reconstruction:** $\sigma/k$ and $\sigma/\ell$ are identified as coordinate-axis
  phase-plane intersection speeds, and the text distinguishes them from the normal
  phase-velocity vector $\vec c_p=\sigma\vec k/|\vec k|^2$.
- **Reason/evidence:** A constant phase satisfies $kx+\ell y-\sigma t=\mathrm{const}$,
  so holding one coordinate fixed gives the axis-intersection speeds $\sigma/k$ and
  $\sigma/\ell$. The true zonal vector component for the Rossby dispersion relation is
  $c_{px}=\sigma k/(k^2+\ell^2)=-\beta k^2/(k^2+\ell^2)^2\le0$, preserving the
  westward-zonal conclusion without misidentifying the coordinate speeds as components.'''
          )
          replace_section(
              'reconstruction/ERRATA.md',
              '### Printed page 146 — local meridional phase with variable wavenumber\n',
              '### Printed pages 146--147 — ray direction identified with wavevector direction\n',
              r'''### Printed page 146 — local meridional phase with variable wavenumber

- **Category:** `equation`
- **Status:** `accepted`
- **Location:** Chapter 5, printed page 146
- **Original:** $v=v_0(y)\exp[-i\sigma t+ikx+i\ell(y)y]$ while treating $\ell(y)$ as
  the local meridional wavenumber.
- **Reconstruction:** The WKB phase is written as
  $\exp[i\int^y\ell(y')\,dy']$, with $\ell$ explicitly the meridional phase gradient.
- **Reason/evidence:** Ray theory defines local wavenumber as the gradient of phase. If
  $\Theta_y=\ell(y)$, the phase must contain $\int^y\ell(y')\,dy'$. Differentiating
  the printed phase instead gives $\Theta_y=\ell+y\ell_y$.'''
          )
          replace_section(
              'reconstruction/ERRATA.md',
              '### Printed pages 146--147 — ray direction identified with wavevector direction\n',
              '### Printed page 147 — turning coordinate written as $\\theta_T$\n',
              r'''### Printed pages 146--147 — ray direction identified with wavevector direction

- **Category:** `equation`
- **Status:** `accepted`
- **Location:** Chapter 5, printed pages 146--147
- **Original:** The text defines the ray path by $dy/dx=\ell/k$ while retaining the
  local equatorial dispersion term $-\beta k/\sigma$. It consequently describes the
  $k\to0$ ray as a straight north--south line and treats nonzero $k$ as moving the
  turning latitude equatorward.
- **Reconstruction:** With $k_*=k+\beta/(2\sigma)$, rays follow
  $dy/dx=c_{gy}/c_{gx}=\ell/k_*$. For $k_*\ne0$ the resulting path is sinusoidal and
  the turning coordinate is set by $\ell=0$. At $k=0$ the turning points remain the
  inertial latitudes but the group ray is not a straight north--south line; for nonzero
  $k$ the turning-point shift is branch dependent.
- **Reason/evidence:** For
  $F=\sigma^2/(gD)-k^2-\ell^2-\beta k/\sigma-\beta^2y^2/(gD)=0$, implicit
  differentiation gives
  $c_{gy}/c_{gx}=2\ell/(2k+\beta/\sigma)$. The printed $\ell/k$ is recovered only if
  the $\beta k/\sigma$ term is also neglected consistently. If $k_*=0$, then
  $c_{gx}=0$ and an $x$-parameterized ray is singular. At $k=0$,
  $k_*=\beta/(2\sigma)$ and $y_T=|\sigma|/\beta$, so the source's straight-ray
  conclusion does not follow. Finally,
  $y_T^2=[\sigma^2-(gD)k^2-(gD)\beta k/\sigma]/\beta^2$, making the sign of the
  nonzero-$k$ shift dependent on the branch rather than universally equatorward.'''
          )
          replace_section(
              'reconstruction/ERRATA.md',
              '### Printed page 147 — turning coordinate written as $\\theta_T$\n',
              '### Chapter 5 section numbering in the contents\n',
              r'''### Printed page 147 — turning coordinate written as $\theta_T$

- **Category:** `equation`
- **Status:** `accepted`
- **Location:** Chapter 5, printed page 147
- **Original:**
  $\pm\theta_T=\pm[(gD)^{1/2}k/\beta]\tan\theta_0$
- **Reconstruction:** With $c=(gD)^{1/2}$ and
  $k_*=k+\beta/(2\sigma)$, the dimensional turning distance is
  $y_T=(c/\beta)[\sigma^2/c^2-k^2-\beta k/\sigma]^{1/2}
  =(c/\beta)|k_*\tan\theta_0|$.
- **Reason/evidence:** With $\beta$ defined per unit meridional distance, the turning
  coordinate has dimensions of length and is the beta-plane coordinate $y$, not an
  angular latitude. The revised formula also incorporates the independently checked
  group-velocity ray direction from the preceding erratum.'''
          )
          replace_section(
              'reconstruction/ERRATA.md',
              '### Chapter 5 section numbering in the contents\n',
              '## Chapter 6\n',
              r'''### Chapter 5 section numbering in the contents — earlier audit finding

- **Category:** `transcription`
- **Status:** `reverted`
- **Location:** Historical table of contents; Kelvin waves entry
- **Original:** `5.8 Kelvin waves`
- **Reconstruction:** `5.8 Kelvin waves`
- **Reason/evidence:** Direct reinspection of the historical contents scan shows that
  the entry itself reads `5.8`, between sections 5.7 and 5.9. The earlier audit reading
  `5.5 Kelvin waves` was erroneous; there is no source/reconstruction deviation.'''
          )

          errata = Path('reconstruction/ERRATA.md').read_text()
          if '- **Status:** `pending-review`' in errata:
              raise SystemExit('ERRATA.md still contains a pending-review status')
          if '```tex' in errata:
              raise SystemExit('ERRATA.md contains forbidden fenced tex math')

          # The p.147 vector remains valid under the corrected group-ray equation; make
          # that equation audit explicit without changing the source-faithful drawing.
          replace_once(
              'reconstruction/FIGURES.md',
              '| `ch05-p147-equatorial-ray.tikz` | 147 | **vector-complete** | **Validated** | Sinusoidal ray and its extrema were checked against the equation-defined turning latitudes. |',
              '| `ch05-p147-equatorial-ray.tikz` | 147 | **vector-complete** | **Validated** | Sinusoidal form and extrema were independently rechecked against the corrected group-velocity ray relation `dy/dx=ell/k_*`, with `k_*=k+beta/(2 sigma)`, for generic nonzero `k_*`; the extrema satisfy `ell=0`. Source `theta_T` figure labels remain intentionally historical while the surrounding dimensional algebra uses `y_T`. |'
          )

          # PLAN.md is remaining work only; resolving the last pending errata item makes
          # this line complete rather than future work.
          replace_once(
              'reconstruction/PLAN.md',
              '- Resolve or normalize remaining `pending-review` items in `ERRATA.md`.\n',
              ''
          )
          PY

          git diff --check
          test "$(grep -R -c -- '- \*\*Status:\*\* `pending-review`' reconstruction/ERRATA.md)" = "0"

      - name: Commit audited corrections and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reconstruction/chapter4.tex reconstruction/chapter5.tex \
            reconstruction/ERRATA.md reconstruction/FIGURES.md reconstruction/PLAN.md
          git rm -- .github/workflows/errata-audit-corrections.yml
          git diff --cached --check
          git commit -m "Resolve audited source errata"
          git pull --rebase origin main
          git push origin HEAD:main
