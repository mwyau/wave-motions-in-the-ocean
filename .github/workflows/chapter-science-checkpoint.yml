name: Chapter science checkpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/chapter1-science.patch'

permissions:
  contents: write

concurrency:
  group: chapter-science-checkpoint
  cancel-in-progress: false

jobs:
  chapter1:
    if: github.event.head_commit.message == 'Run Chapter 1 science checkpoint'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Apply reviewed Chapter 1 corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wave-motions-science-audit'
          git config user.email '5298134+mwyau@users.noreply.github.com'
          python3 .github/ch1-science-worker.py
          # Chapter edits do not alter front matter or the generated contents, but run
          # the required synchronization check when its dependency is available.
          if command -v pandoc >/dev/null 2>&1; then
            python3 scripts/sync-views.py --readme
          fi
          git diff --check
          grep -Fq '+\arg A\right)' reconstruction/chapter1.tex
          grep -Fq 'phase-velocity vector' reconstruction/chapter1.tex
          grep -Fq 'Theta$ itself need not' reconstruction/chapter1.tex
          python3 - <<'PY'
          from pathlib import Path
          s=Path('reconstruction/ERRATA.md').read_text()
          for title in (
              'Printed page 3 — complex-amplitude phase from a one-argument arctangent',
              'Printed page 4 — scalar phase speed described as directed',
              'Printed pages 11--12 — WKB scale separation of phase and amplitude',
          ):
              i=s.index('### '+title)
              j=s.find('\n### ', i+4)
              if j < 0: j=s.find('\n## ', i+4)
              block=s[i:j]
              assert '- **Status:** `accepted`' in block, title
          PY
          rm -f .github/ch1-science-worker.py .github/chapter1-science.patch .github/workflows/chapter-science-checkpoint.yml
          git add -- reconstruction/chapter1.tex reconstruction/ERRATA.md README.md .github/ch1-science-worker.py .github/chapter1-science.patch .github/workflows/chapter-science-checkpoint.yml
          git commit -m 'Correct Chapter 1 phase and WKB conventions'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
