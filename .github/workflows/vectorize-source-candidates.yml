              thetaK = math.acos(math.sqrt(8/9))
              def branch(theta, sign):
                  c = math.cos(theta)
                  d = math.sqrt(max(c*c-8/9, 0))
                  q = -1.5*(c + sign*d)
                  R = math.sqrt(max(1+q*q+2*q*c, 0))
                  return R/(q*q)
              curves=[]
              for C in [10,14,18,22,26]:
                  th=linspace(-thetaK*0.997, thetaK*0.997, 150)
                  curves.append([(8.85-C*branch(t,1)*math.cos(t),
                                  2.45+C*branch(t,1)*math.sin(t)) for t in th])
                  for sign in (-1,1):
                      a, b = sign*0.018, sign*thetaK*0.997
                      th2=linspace(a,b,90)
                      if sign < 0:
                          th2=list(reversed(th2))
                      curves.append([(8.85-C*branch(t,-1)*math.cos(t),
                                      2.45+C*branch(t,-1)*math.sin(t)) for t in th2])
              draw='\n'.join('  \\draw[line width=0.52pt] plot[smooth] coordinates {'+coords(c)+'};' for c in curves)
