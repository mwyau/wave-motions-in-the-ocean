  \\draw[->,line width=0.55pt] (5.0,6.05) -- (9.65,6.05) node[right] {{$x$}};
  \\draw[line width=0.72pt,domain=0:8,samples=80,variable=\\x]
    plot ({{5.10+0.53*\\x}},{{6.78-0.72/(1+exp(-1.5*(\\x-4)))}});
  \\node[left] at (4.95,6.50) {{$U$}};
  \\draw[->,line width=0.55pt] (5.0,4.52) -- (9.65,4.52) node[right] {{$x$}};
  \\draw[line width=0.70pt] plot[smooth] coordinates {{{coords(wave)}}};
  \\node[left] at (4.95,4.52) {{$\\eta$}};
  \\draw[->,line width=0.60pt] (0.75,0.65) -- (5.25,0.65) node[right] {{$k$}};
  \\draw[->,line width=0.60pt] (1.05,0.40) -- (1.05,4.00) node[above] {{$f(k)$}};
  \\draw[line width=0.82pt,domain=0:4.3,samples=120,smooth,variable=\\x]
    plot ({{1.05+0.95*\\x}},{{0.65+1.25*sqrt(\\x*tanh(\\x))}});
  \\draw[line width=0.48pt,domain=0:4.3,variable=\\x] plot ({{1.05+0.95*\\x}},{{0.65+1.25}});
  \\draw[line width=0.48pt,domain=0:4.3,variable=\\x] plot ({{1.05+0.95*\\x}},{{0.65+1.25*(1+0.10*\\x)}});
  \\draw[line width=0.48pt,domain=0:4.3,variable=\\x] plot ({{1.05+0.95*\\x}},{{0.65+1.25*(1+{Ucrit:.6f}*\\x)}});
  \\node[anchor=west] at (5.05,1.90) {{$|U|=0$}};
  \\node[anchor=west] at (2.18,2.62) {{$\\sigma+k|U|$}};
  \\node[anchor=west] at (2.65,3.58) {{$(gk\\tanh kD)^{{1/2}}$}};
  \\node[anchor=east] at (1.00,2.70) {{$|U|$ increases}};
{stars}
\\end{{tikzpicture}}
''')

              sigma, ell, vmax = 1.2, .35, .65
              def Vfun(xx):
                  a=1/(1+math.exp(-1.4*(xx-2.5)))
                  a0=1/(1+math.exp(3.5)); a1=1/(1+math.exp(-3.5))
                  return vmax*(a-a0)/(a1-a0)
              xx=linspace(0,5,120); slopes=[]; yy=[0.0]
              for xv in xx:
                  v=Vfun(xv); K=(sigma-ell*v)**2
                  k=math.sqrt(K*K-ell*ell); cg=.5/math.sqrt(K)
                  cx=cg*k/K; cy=v+cg*ell/K
                  slopes.append(cy/cx)
              for i in range(1,len(xx)):
                  yy.append(yy[-1]+.5*(slopes[i-1]+slopes[i])*(xx[i]-xx[i-1]))
              ray=[(0.85+1.28*xv,3.85+0.46*yv) for xv,yv in zip(xx,yy)]
              Vpts=[(0.85+1.28*xv,0.72+2.10*Vfun(xv)/vmax) for xv in xx]
              xv=3.6; v=Vfun(xv); K=(sigma-ell*v)**2
              k=math.sqrt(K*K-ell*ell); theta=math.degrees(math.atan2(ell,k))
              yp=yy[min(range(len(xx)), key=lambda i:abs(xx[i]-xv))]
              px,py=0.85+1.28*xv,3.85+0.46*yp
              L=2.05; dx=L*math.cos(math.radians(theta)); dy=L*math.sin(math.radians(theta))
              (OUT/'ch03-p063-shear-current-refraction.tikz').write_text(f'''% wave-source: pdf=ChapmanRizzoli3.pdf; page=28; trim=145bp 480bp 110bp 65bp
% Source: Wave Motions in the Ocean, printed p.63 (physical p.28).
% Equation-generated deep-water example with normalized sigma=1.2, ell=0.35,
% g=1 and a smooth display V(x) rising from 0 to 0.65. At every x,
% k^2=(sigma-ell V)^4-ell^2 and ell=K sin(theta) is held constant; the ray is
% integrated from the absolute group velocity U+c'_g. Display profile is illustrative.
\\begin{{tikzpicture}}[x=1cm,y=1cm,>=stealth,line cap=round,line join=round,font=\\small]
  \\draw[->,line width=0.62pt] (0.70,3.70) -- (7.65,3.70) node[right] {{$x$}};
  \\draw[->,line width=0.62pt] (0.85,3.55) -- (0.85,7.20) node[above] {{$y$}};
  \\draw[line width=0.88pt] plot[smooth] coordinates {{{coords(ray)}}};
  \\node[anchor=south] at (1.95,3.95) {{$\\theta_0$}};
  \\coordinate (P) at ({px:.4f},{py:.4f});
  \\draw[->,line width=0.78pt] (P) -- ++({theta:.3f}:2.05) node[above right] {{$\\vec k$}};
  \\draw[line width=0.48pt] (P) -- ++(0:{dx:.4f}) node[midway,below] {{$k$}};
  \\draw[line width=0.48pt] ($(P)+(0:{dx:.4f})$) -- ++(90:{dy:.4f}) node[midway,right] {{$\\ell$}};
  \\draw[line width=0.40pt] ($(P)+(0:0.58)$) arc[start angle=0,end angle={theta:.3f},radius=0.58];
  \\node at ($(P)+({theta/2:.3f}:0.85)$) {{$\\theta$}};
  \\draw[->,line width=0.62pt] (0.70,0.55) -- (7.65,0.55) node[right] {{$x$}};
  \\draw[->,line width=0.62pt] (0.85,0.42) -- (0.85,3.15) node[above] {{$V(x)$}};
  \\draw[line width=0.82pt] plot[smooth] coordinates {{{coords(Vpts)}}};
  \\foreach \\xx in {{3.0,3.8,4.6,5.4,6.2}} \\draw[->,line width=0.45pt] (\\xx,0.55) -- (\\xx,{{0.55+0.25+(\\xx-3.0)*0.33}});
\\end{{tikzpicture}}
''')
          PY

