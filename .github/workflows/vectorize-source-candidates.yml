              (OUT/'ch03-p062-opposing-current-blocking.tikz').write_text(f'''% wave-source: pdf=ChapmanRizzoli3.pdf; page=27; trim=75bp 330bp 55bp 95bp
% Source: Wave Motions in the Ocean, printed p.62 (physical p.27).
