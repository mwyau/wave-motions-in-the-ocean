name: One-time source figure vectorization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  vectorize:
    if: github.event.head_commit.message == 'Run Chapter 3 vectorization task'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out current main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare audited generators
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wave-motions-figure-audit'
          git config user.email '5298134+mwyau@users.noreply.github.com'
          cat > /tmp/vector_helpers.py <<'PY'
          from pathlib import Path
          import math
          import re

          OUT = Path('reconstruction/figures')

          def linspace(a, b, n):
              if n == 1:
                  return [a]
              h = (b-a)/(n-1)
              return [a+i*h for i in range(n)]

          def coords(points):
              return ' '.join(f'({x:.4f},{y:.4f})' for x,y in points)

          def fdisp(k):
              return math.sqrt(k*math.tanh(k))

          def bisect(func, a, b, tol=1e-12):
              fa, fb = func(a), func(b)
              if fa == 0:
                  return a
              if fb == 0:
                  return b
              if fa*fb > 0:
                  raise ValueError('root not bracketed')
              for _ in range(120):
                  m = 0.5*(a+b)
                  fm = func(m)
                  if abs(fm) < tol or (b-a) < tol:
                      return m
                  if fa*fm <= 0:
                      b, fb = m, fm
                  else:
                      a, fa = m, fm
              return 0.5*(a+b)

          def first_opp_root(U):
              prevx, prev = 1e-6, fdisp(1e-6)-(1+U*1e-6)
              for i in range(1,6000):
                  x = 1e-6 + i*(8.0-1e-6)/5999
                  val = fdisp(x)-(1+U*x)
                  if prev*val <= 0:
                      return bisect(lambda k: fdisp(k)-(1+U*k), prevx, x)
                  prevx, prev = x, val
              raise ValueError('opposing-current root not found')

          def refresh_ledger(text):
              states = ('Validated', 'Partial', 'Pending', 'N/A')
              counts = {state: sum(1 for line in text.splitlines()
                                   if line.startswith('|') and f'**{state}**' in line)
                        for state in states}
              total = sum(counts.values())
              repl = (f'Current snapshot across the {total} tracked body/front-matter assets and direct source placements: '
                      f'**{counts["Validated"]} Validated, {counts["Partial"]} Partial, '
                      f'{counts["Pending"]} Pending, {counts["N/A"]} N/A**.')
              text, n = re.subn(
                  r'Current snapshot across the \d+ tracked body/front-matter assets and direct source placements: '
                  r'\*\*\d+ Validated, \d+ Partial, \d+ Pending, \d+ N/A\*\*\.',
                  repl, text, count=1)
              if n != 1:
                  raise SystemExit('could not refresh validation snapshot')
              sec = text.split('## Direct source-PDF crop placements — complete inventory', 1)[1]
              sec = sec.split('## Sizing and acceptance rules', 1)[0]
              direct = sum(1 for line in sec.splitlines() if re.match(r'^\| [1-6] \|', line))
              text, n = re.subn(r'These \d+ placements are real figures',
                                f'These {direct} placements are real figures', text, count=1)
              if n != 1:
                  raise SystemExit('could not refresh direct-placement count')
              return text

          def patch(chapter_replacements, rows, remove_specs, *, first_ch3=False, insert_after=None):
              chapter = Path('reconstruction/chapter3.tex')
              ctext = chapter.read_text()
              for old, new, target in chapter_replacements:
                  if old in ctext:
                      ctext = ctext.replace(old, new, 1)
                  elif target not in ctext:
                      raise SystemExit(f'missing Chapter 3 source-art anchor for {target}')
              chapter.write_text(ctext)

              ledger = Path('reconstruction/FIGURES.md')
              text = ledger.read_text()
              if first_ch3:
                  marker = ('### Chapter 3\n\nThere are no committed replacement/vector assets. '
                            'All retained Chapter 3 figures are direct source-PDF crops; see the placement inventory below.')
                  if rows[0] not in text:
                      if marker not in text:
                          raise SystemExit('missing Chapter 3 empty-table marker')
                      table = ('### Chapter 3\n\n| Asset | Printed page | Status | Equation validation | Scientific audit |\n'
                               '|---|---:|---|---|---|\n' + '\n'.join(rows))
                      text = text.replace(marker, table, 1)
              else:
                  if rows[0] not in text:
                      if insert_after not in text:
                          raise SystemExit('missing Chapter 3 ledger insertion anchor')
                      text = text.replace(insert_after, insert_after + '\n' + '\n'.join(rows), 1)

              for chapter_no, page, pdf, physical, wanted in remove_specs:
                  pat = rf'^\| {chapter_no} \| {page} \| `{re.escape(pdf)}` \| {physical} \|.*\n'
                  found = len(re.findall(pat, text, flags=re.M))
                  if found:
                      if found < wanted:
                          raise SystemExit(f'only {found} direct rows remain for p.{page}, expected {wanted}')
                      text = re.sub(pat, '', text, count=wanted, flags=re.M)
              ledger.write_text(refresh_ledger(text))

