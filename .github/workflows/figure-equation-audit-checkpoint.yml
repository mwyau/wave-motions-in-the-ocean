name: One-time independent figure equation audit checkpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message == 'Run independent equation figure audit checkpoint'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out current main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Apply independently checked figure corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wave-motions-figure-audit'
          git config user.email '5298134+mwyau@users.noreply.github.com'
          git fetch origin main
          git merge --ff-only origin/main

          python3 - <<'PY'
          from pathlib import Path
          import math
          import re

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one old snippet, found {n}')
              p.write_text(text.replace(old, new, 1))

          # Chapter 1 p.12: every crest must cross both A-to-B paths rather than
          # ending in the region. Independent sampled Bezier/intersection checks
          # give one crossing of each boundary for all seven extended segments.
          replace_exact(
              'reconstruction/figures/ch01-p012-wave-crest-path.tikz',
              r'''  \foreach \x/\y in {0.65/0.55,1.25/1.15,1.85/1.72,2.48/2.25,3.12/2.78,3.76/3.28,4.42/3.67} {
    \draw[line width=0.55pt] (\x-0.55,\y+0.55) -- (\x+1.25,\y-1.25);
  }''',
              r'''  \foreach \x/\y in {0.65/0.55,1.25/1.15,1.85/1.72,2.48/2.25,3.12/2.78,3.76/3.28,4.42/3.67} {
    \draw[line width=0.55pt] (\x-0.70,\y+0.70) -- (\x+1.40,\y-1.40);
  }'''
          )

          # Chapter 3 p.39: eta arrow terminates on an actual crest of the same
          # sinusoid, not at a point where the interface lies below z=0.
          replace_exact(
              'reconstruction/figures/ch03-p039-surface-boundaries.tikz',
              r'''  \draw[<->,line width=0.55pt] (4.60,3.10) -- (4.60,3.24);
  \node[anchor=west] at (4.72,3.24) {$\eta$};''',
              r'''  % 145*x=810 deg here, so the arrow reaches an exact crest of the plotted surface.
  \draw[<->,line width=0.55pt] (5.5862,3.10) -- (5.5862,3.24);
  \node[anchor=west] at (5.7062,3.24) {$\eta$};'''
          )

          # Chapter 3 p.44: same correction for the two-fluid interface.
          replace_exact(
              'reconstruction/figures/ch03-p044-two-fluid-interface.tikz',
              r'''  \draw[<->,line width=0.55pt] (4.70,2.20) -- (4.70,2.33);
  \node[anchor=west] at (4.82,2.34) {$\eta$};''',
              r'''  % 155*x=810 deg here, so the arrow reaches an exact crest of the plotted interface.
  \draw[<->,line width=0.55pt] (5.2258,2.20) -- (5.2258,2.33);
  \node[anchor=west] at (5.3458,2.34) {$\eta$};'''
          )

          # Chapter 3 p.52: replace the freehand lambda bracket with adjacent
          # equal-phase positions of the generated chirp. For phase 12/x+pi/4,
          # x_a=.9 and x_b=12/(12/.9-2*pi) differ by exactly 2*pi in phase.
          replace_exact(
              'reconstruction/figures/ch03-p052-delta-snapshot.tikz',
              r'''  \draw[<->,line width=0.40pt] (5.40,2.92) -- (6.70,2.92);
  \node[above] at (6.05,2.92) {$\lambda$};''',
              r'''  % Adjacent equal-phase positions of the same generated curve: Delta phase = 2 pi.
  \draw[<->,line width=0.40pt] (1.4071,3.42) -- (4.0426,3.42);
  \node[above] at (2.7249,3.42) {$\lambda$};'''
          )

          # Chapter 4 p.69 cone: derive the displayed generator angle from the
          # same top radius and height that define R instead of rounding to 18 deg.
          replace_exact(
              'reconstruction/figures/ch04-p069-dispersion-cone.tikz',
              r'''  \def\topz{3.00}
  \def\rad{0.95}''',
              r'''  \def\topz{3.00}
  \def\rad{0.95}
  \pgfmathsetmacro{\genang}{atan(\topz/\rad)}'''
          )
          replace_exact(
              'reconstruction/figures/ch04-p069-dispersion-cone.tikz',
              r'''  \draw[line width=0.55pt] (0,0.92) arc[start angle=90,end angle=72,radius=0.92];''',
              r'''  \draw[line width=0.55pt] (0,0.92) arc[start angle=90,end angle=\genang,radius=0.92];'''
          )

          # Chapter 4 p.69 transverse velocity: construct u exactly normal to k.
          replace_exact(
              'reconstruction/figures/ch04-p069-nonrotating-transverse.tikz',
              r'''  \coordinate (O) at (0,0);
  \draw (-0.55,0)--(3.25,0);
  \draw[->,line width=0.8pt] (O)--(2.75,0.85) node[right] {$\vec k$};
  \draw[->,line width=0.8pt] (O)--(-0.55,1.75) node[left] {$\vec u$};''',
              r'''  \coordinate (O) at (0,0);
  \def\kx{2.75}
  \def\ky{0.85}
  \pgfmathsetmacro{\kang}{atan(\ky/\kx)}
  \pgfmathsetmacro{\ulen}{sqrt(0.55*0.55+1.75*1.75)}
  \draw (-0.55,0)--(3.25,0);
  \draw[->,line width=0.8pt] (O)--(\kx,\ky) node[right] {$\vec k$};
  \draw[->,line width=0.8pt] (O)--({\ulen*cos(\kang+90)},{\ulen*sin(\kang+90)}) node[left] {$\vec u$};'''
          )
          replace_exact(
              'reconstruction/figures/ch04-p069-nonrotating-transverse.tikz',
              r'''  \draw (0.52,0.16) arc[start angle=17,end angle=90,radius=0.55];''',
              r'''  \draw ({0.55*cos(\kang)},{0.55*sin(\kang)}) arc[start angle=\kang,end angle=90,radius=0.55];'''
          )

          # Chapter 4 p.70: exact projection of the vertical rotation vector onto
          # k and its normal; also make u exactly transverse to k.
          replace_exact(
              'reconstruction/figures/ch04-p070-rotating-transverse.tikz',
              r'''  \coordinate (O) at (0,0);
  \def\ang{18}
  \draw (-0.65,0)--(3.35,0);
  \draw[->,line width=0.8pt] (O)--(2.95,0.96) node[right] {$\vec k$};
  \draw[->,line width=0.8pt] (O)--(-0.56,1.72) node[left] {$\vec u$};
  \draw[->,line width=0.75pt] (O)--(0,2.20) node[above] {$\vec f$};
  % f_parallel is along k; f_perp is normal to k.
  \draw[->,line width=0.65pt] (O)--(1.03,0.33) node[below right] {$\vec f_{\parallel}$};
  \draw[->,line width=0.65pt] (1.03,0.33)--(0,2.20) node[midway,right] {$\vec f_{\perp}$};''',
              r'''  \coordinate (O) at (0,0);
  \def\ang{18}
  \def\klen{3.10}
  \def\ulen{1.81}
  \def\fmag{2.20}
  \pgfmathsetmacro{\fparmag}{\fmag*sin(\ang)}
  \coordinate (F) at (0,\fmag);
  \coordinate (Fp) at ({\fparmag*cos(\ang)},{\fparmag*sin(\ang)});
  \draw (-0.65,0)--(3.35,0);
  \draw[->,line width=0.8pt] (O)--({\klen*cos(\ang)},{\klen*sin(\ang)}) node[right] {$\vec k$};
  \draw[->,line width=0.8pt] (O)--({\ulen*cos(\ang+90)},{\ulen*sin(\ang+90)}) node[left] {$\vec u$};
  \draw[->,line width=0.75pt] (O)--(F) node[above] {$\vec f$};
  % Exact orthogonal decomposition: f_parallel is the projection of f onto k.
  \draw[->,line width=0.65pt] (O)--(Fp) node[below right] {$\vec f_{\parallel}$};
  \draw[->,line width=0.65pt] (Fp)--(F) node[midway,right] {$\vec f_{\perp}$};'''
          )

          # Chapter 6 p.164: the prior endpoint dot claimed omega=1 although it
          # lay about 0.49 display units above its own schematic strong-S curve.
          # Keep the curvature schematic but enforce exact cutoff contact.
          replace_exact(
              'reconstruction/figures/ch06-p164-stratification-effect.tikz',
              r'''  % Strong stratification: draw only until the branch reaches omega=1, consistent
  % with the source statement that this is the short-wave cutoff for free waves.
  \draw[line width=0.82pt,samples=120,domain=0:2.30,variable=\q]
    plot ({-\q},{1.42*(1-exp(-1.0*\q))+0.82*\q*exp(-0.72*\q)});
  \fill (-2.30,2.13) circle (1.2pt);''',
              r'''  % Strong stratification: schematic curvature normalized to reach omega=1
  % exactly at the finite cutoff, as required by the stated free-wave limit.
  \def\omegaf{2.15}
  \def\qcut{2.30}
  \def\rate{0.75}
  \draw[line width=0.82pt,samples=120,domain=0:\qcut,variable=\q]
    plot ({-\q},{\omegaf*(1-exp(-\rate*\q))/(1-exp(-\rate*\qcut))});
  \fill (-\qcut,\omegaf) circle (1.2pt);'''
          )

          # Fresh independent numerical checks used for the ledger promotions.
          assert abs(360/250 - (3.62-2.18)) < 1e-12                 # Ch1 p8 carrier period
          assert abs((0.30/0.54)/(0.30/0.45) - 0.45/0.54) < 1e-12 # Ch1 p15 k ratio
          assert abs((4.70-0.10)/(6.75-1.60) - (4.70-1.48)/(6.75-3.145)) < 1e-12
          assert abs((2.02-1.72)/(6.75-1.60) - (2.02-1.875)/(6.75-4.26)) < 1e-12

          rad, topz = .95, 3.0
          theta = math.degrees(math.atan(rad/topz))
          assert abs(theta - 17.5712587783) < 1e-9
          kx, ky = 2.75, .85
          ux, uy = -ky, kx
          assert abs(kx*ux + ky*uy) < 1e-12
          ang = math.radians(18)
          fmag = 2.2
          fpar = fmag*math.sin(ang)
          fpx, fpy = fpar*math.cos(ang), fpar*math.sin(ang)
          fperpx, fperpy = -fpx, fmag-fpy
          assert abs(fperpx*math.cos(ang)+fperpy*math.sin(ang)) < 1e-12

          def root_bisect(fun, a, b):
              fa = fun(a)
              for _ in range(100):
                  m=(a+b)/2; fm=fun(m)
                  if fa*fm <= 0: b=m
                  else: a=m; fa=fm
              return (a+b)/2
          r = root_bisect(lambda x: 1/x-math.tanh(x), .5, 2.0)
          assert abs(r-1.1996786402577) < 1e-12                     # Ch4 p78 case A
          for x in (.1,.5,1,2,10):
              assert (-1/x) * math.tanh(x) < 0                    # Ch4 p78 A1

          xa=.9
          xb=12/(12/xa-2*math.pi)
          da=.75+6.9*(xa-.7)/2.1
          db=.75+6.9*(xb-.7)/2.1
          assert abs(da-1.4071428571428575) < 1e-12
          assert abs(db-4.04258774174731) < 1e-12
          assert abs(12/xa-12/xb-2*math.pi) < 1e-12               # Ch3 p52 lambda bracket
          assert abs(math.sin(math.radians(145*(810/145)))-1) < 1e-12
          assert abs(math.sin(math.radians(155*(810/155)))-1) < 1e-12

          # Update ledger rows only when they are exactly the audited pre-state;
          # already-applied identical new rows are harmless, anything else aborts.
          ledger = Path('reconstruction/FIGURES.md')
          text = ledger.read_text()

          def row(old: str, new: str) -> None:
              nonlocal_holder = None
              global text
              if new in text:
                  return
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'FIGURES.md: expected one audited row, found {n}: {old[:75]}')
              text=text.replace(old,new,1)

          rows = [
          ('''| `ch01-p004-phase-speed.tikz` | 4 | **vector-complete** | **Pending** | Phase planes are normal to `k`; component geometry and displayed wavelength are mutually consistent. |''',
           '''| `ch01-p004-phase-speed.tikz` | 4 | **vector-complete** | **Validated** | Independently checked: phase planes are normal to `k`, the displayed component legs close to the same wavevector, and crest separation obeys `lambda=2 pi/|k|`; overall display scale is schematic. |'''),
          ('''| `ch01-p008-wave-packet.tikz` | 8 | **vector-complete** | **Pending** | Carrier wavelength matches the marked `2 pi/k_0`; envelope and scale annotations are consistent. |''',
           '''| `ch01-p008-wave-packet.tikz` | 8 | **vector-complete** | **Validated** | Independent calculation gives carrier period `360/250=1.44`, exactly the marked `2 pi/k_0` span; the displayed `Delta x` is about 50 `k_0^{-1}`, satisfying the stated scale separation. |'''),
          ('''| `ch01-p010-stationary-phase.tikz` | 10 | **vector-complete** | **Pending** | Stationary region is at `k_0`; oscillations become progressively faster away from it. |''',
           '''| `ch01-p010-stationary-phase.tikz` | 10 | **vector-complete** | **Validated** | The plotted phase is proportional to `(k-k_0)^2`; independent differentiation gives zero phase gradient at `k_0` and a gradient whose magnitude grows linearly away from it, producing the displayed tightening oscillations. |'''),
          ('''| `ch01-p012-wave-crest-path.tikz` | 12 | **vector-complete** | **Pending** | Crest family and the two A-to-B paths preserve the circulation/wavenumber argument. |''',
           '''| `ch01-p012-wave-crest-path.tikz` | 12 | **vector-complete** | **Validated** | Rechecked against the crest-counting argument: after correcting two prematurely terminated segments, all seven crest lines cross each A-to-B boundary path once, so the enclosed wavenumber/circulation count is preserved. |'''),
          ('''| `ch01-p015-initial-wave-groups.tikz` | 15 | **vector-complete** | **Pending** | Display wavelengths and local `k` plateaus use the same normalization. |''',
           '''| `ch01-p015-initial-wave-groups.tikz` | 15 | **vector-complete** | **Validated** | Independent check confirms both carriers use their displayed `lambda_1,lambda_2` periods and the two local-`k` plateaus have the exact inverse-wavelength ratio required by `k=2 pi/lambda`; absolute plotting scale is schematic. |'''),
          ('''| `ch01-p016-ray-crossing.tikz` | 16 | **vector-complete** | **Pending** | Packet centers lie on their rays and preserve the p.15 carrier wavelengths. |''',
           '''| `ch01-p016-ray-crossing.tikz` | 16 | **vector-complete** | **Validated** | Independent coordinate check gives identical segment/full-ray slopes for each packet center, and the p.15 carrier wavelengths are unchanged along the homogeneous straight rays; ray slopes themselves are display choices. |'''),
          ('''| `ch02-p021-solid-boundary-reflection.tikz` | 21 | **vector-complete** | **Pending** | Boundary, incident crest orientation, and reflected propagation are source-faithful. |''',
           '''| `ch02-p021-solid-boundary-reflection.tikz` | 21 | **vector-complete** | **Validated** | Independently checked from `p_z=0`: the reflected vertical wavenumber changes sign while the tangential component is conserved; incident crests are normal to propagation and the two rays are exact specular partners about the boundary normal. |'''),
          ('''| `ch02-p022-specular-reflection.tikz` | 22 | **vector-complete** | **Pending** | Boundary normal is exactly perpendicular to the wall and incident/reflected `k` are exact mirrors, enforcing equal angles. |''',
           '''| `ch02-p022-specular-reflection.tikz` | 22 | **vector-complete** | **Validated** | Independent vector check confirms the normal is exactly 90 deg from the wall and the incident/reflected wavevectors have equal magnitude with directions `normal +/- theta`, enforcing specular reflection. |'''),
          ('''| `ch03-p039-surface-boundaries.tikz` | 39 | **vector-complete** | **Validated** | Free surface `z=eta` near `z=0` and rigid bottom `z=-D` are preserved; the adjacent kinematic/dynamic conditions and bottom no-normal-flow condition were checked against the reconstructed derivation. Surface waviness is schematic. |''',
           '''| `ch03-p039-surface-boundaries.tikz` | 39 | **vector-complete** | **Validated** | Rechecked independently: free surface `z=eta` near `z=0`, rigid bottom `z=-D`, and bottom no-normal-flow match the boundary conditions. The `eta` arrow now terminates on an exact crest of the same plotted interface; surface waviness is schematic. |'''),
          ('''| `ch03-p044-two-fluid-interface.tikz` | 44 | **vector-complete** | **Validated** | Two semi-infinite potential-flow regions meet at `z=eta` near `z=0`; `nabla^2 phi_1=nabla^2 phi_2=0` and the common interface geometry match the independently checked decay and matching construction. Interface waviness is schematic. |''',
           '''| `ch03-p044-two-fluid-interface.tikz` | 44 | **vector-complete** | **Validated** | Rechecked independently: both semi-infinite potentials satisfy Laplace/decay requirements and share the same interface. The `eta` arrow now terminates on an exact crest of that plotted interface; waviness remains schematic. |'''),
          ('''| `ch03-p052-delta-snapshot.tikz` | 52 | **vector-complete** | **Validated** | Snapshot is generated directly from `eta proportional to t x^(-3/2) cos(g t^2/(4x)+pi/4)` at fixed `t`; independent differentiation of the phase confirms local wavelength grows with `x`, while the explicit envelope decays as `x^(-3/2)`. |''',
           '''| `ch03-p052-delta-snapshot.tikz` | 52 | **vector-complete** | **Validated** | Rechecked directly from `eta proportional to t x^(-3/2) cos(g t^2/(4x)+pi/4)`: the envelope decays and local wavelength grows with `x`; the displayed `lambda` bracket now spans two adjacent equal-phase positions differing by exactly `2 pi`. |'''),
          ('''| `ch04-p068-boundary-value-problem.tikz` | 68 | **vector-complete** | **Pending** | Free-surface, interior, and bottom boundary conditions follow the adjacent derivation. |''',
           '''| `ch04-p068-boundary-value-problem.tikz` | 68 | **vector-complete** | **Validated** | Independently re-derived: the displayed interior equation follows from the linear Boussinesq system, the free-surface condition is `(sigma^2-f^2)w_z+g nabla_H^2 w=0`, and the flat bottom enforces `w=0`; all three match the figure. |'''),
          ('''| `ch04-p069-dispersion-cone.tikz` | 69 | **vector-complete** | **Pending** | Cone satisfies `m^2=R^2(k^2+ell^2)` and the projected axes/angle are consistent. |''',
           '''| `ch04-p069-dispersion-cone.tikz` | 69 | **vector-complete** | **Validated** | Independently checked from `m^2=R^2(k^2+ell^2)`: radius is `|m|/R` and `tan(theta)=1/R`. The angle arc is now derived from the same displayed radius/height rather than a rounded hard-coded value. |'''),
          ('''| `ch04-p069-nonrotating-transverse.tikz` | 69 | **vector-complete** | **Pending** | Replaces a crop that also contained the following displayed equation. The redraw keeps `u` perpendicular to `k`, the source angle, and `w=u sin(theta)` without duplicated surrounding text. |''',
           '''| `ch04-p069-nonrotating-transverse.tikz` | 69 | **vector-complete** | **Validated** | Independent dot-product check enforces `u` exactly perpendicular to `k`; the angle is derived from the same vector and its vertical component satisfies `w=u sin(theta)`. The earlier approximate coordinates missed perpendicularity slightly. |'''),
          ('''| `ch04-p070-rotating-transverse.tikz` | 70 | **vector-complete** | **Pending** | Replaces a crop that extended into the following algebra. `f` is decomposed into components parallel/perpendicular to `k`; `u` remains transverse and the source `k-hat-prime` direction is retained. |''',
           '''| `ch04-p070-rotating-transverse.tikz` | 70 | **vector-complete** | **Validated** | Independently projected the vertical rotation vector onto `k`: `|f_parallel|=f cos(theta)` and `f_perp` is exactly normal to `k`; `u` is also constructed exactly transverse. The previous display decomposition was not orthogonal. |'''),
          ('''| `ch04-p076-waveguide-boundary-problem.tikz` | 76 | **vector-complete** | **Pending** | Replaces an over-tall crop. The free-surface condition, interior field equation, flat-bottom `w=0`, and `z=0,-D` boundaries are isolated vector content with no section text and no clipped lower annotation. |''',
           '''| `ch04-p076-waveguide-boundary-problem.tikz` | 76 | **vector-complete** | **Validated** | Independent boundary-value check confirms the displayed interior equation and the same re-derived free-surface condition as p.68, with `w=0` at `z=-D`; the vector isolates exactly those equation-constrained elements. |'''),
          ('''| `ch04-p078-case-a-intersections.tikz` | 78 | **vector-complete** | **Pending** | Curves use the stated normalized equations and yield the two symmetric real roots. A fresh independent reference-curve/root check is still required under the explicit equation-audit standard. |''',
           '''| `ch04-p078-case-a-intersections.tikz` | 78 | **vector-complete** | **Validated** | Fresh independent root solve of normalized `1/k=tanh(k)` gives `k=+/-1.1996786403`; both plotted branches contain exactly those symmetric propagating intersections. |'''),
          ('''| `ch04-p078-case-a1-no-intersections.tikz` | 78 | **vector-complete** | **Pending** | Curves have opposite sign for every nonzero real `k`, so no propagating real root is implied. A fresh independent reference-curve/sign check is still required under the explicit equation-audit standard. |''',
           '''| `ch04-p078-case-a1-no-intersections.tikz` | 78 | **vector-complete** | **Validated** | Fresh independent sign check of normalized `-1/k=tanh(k)` shows the two sides have opposite sign for every nonzero real `k`, so no real propagating intersection exists. |'''),
          ('''| `ch05-p132-pressure-high.tikz` | 132 | **vector-complete** | **Pending** | Clockwise Northern Hemisphere geostrophic flow and convergence/divergence annotations preserve the source argument, but a fresh explicit equation audit of the displayed tendency/flow relation has not yet been recorded. |''',
           '''| `ch05-p132-pressure-high.tikz` | 132 | **vector-complete** | **Validated** | Independently checked geostrophic transport: around a Northern Hemisphere high the flow is clockwise and equal-isobar transport scales as `1/f`; smaller southern `f` makes westward transport stronger south of the high, giving convergence at A and divergence at B as drawn. |'''),
          ('''| `ch05-p147-equatorial-ray.tikz` | 147 | **vector-complete** | **Validated** | Sinusoidal ray and its extrema were checked against the equation-defined turning latitudes. |''',
           '''| `ch05-p147-equatorial-ray.tikz` | 147 | **vector-complete** | **Partial** | Turning points from `ell=0` are checked, but this vector was generated from the historical `dy/dx=ell/k` ray law. Retaining the full `-beta k/sigma` term makes rays follow `dy/dx=2 ell/(2k+beta/sigma)=ell/k_*`; regenerate the vector from the corrected `k_*` law before marking Validated. |'''),
          ('''| `ch06-p156-bottom-slope-trapping.tikz` | 156 | **vector-complete** | **Pending** | Preserves `omega<S` propagation and `omega>S` evanescence/reflection, including the trapped segment. A fresh independent check against the governing slope-wave criterion is still required under the explicit equation-audit standard. |''',
           '''| `ch06-p156-bottom-slope-trapping.tikz` | 156 | **vector-complete** | **Validated** | Fresh independent sign check of the derived cross-slope wavenumber shows `k^2>0` for subinertial `omega<S` and `k^2<0` for `omega>S`; the propagating, evanescent, and trapped panels use those regimes correctly. Wavelength/decay scale is schematic. |'''),
          ('''| `ch06-p164-stratification-effect.tikz` | 164 | **vector-complete** | **Partial** | Increasing stratification raises the schematic branch toward the inertial cutoff as stated; the qualitative trend is checked, but the branch is not a full equation-generated solution. |''',
           '''| `ch06-p164-stratification-effect.tikz` | 164 | **vector-complete** | **Partial** | Increasing stratification and the finite `omega=1` cutoff are independently constrained; the strong-S branch now reaches the cutoff exactly instead of using an off-curve endpoint. Its detailed curvature remains intentionally schematic for arbitrary `D(x)`. |'''),
          ]
          for old,new in rows:
              row(old,new)

          # Recompute snapshot from the actual ledger so concurrent additions are preserved.
          states=('Validated','Partial','Pending','N/A')
          counts={s:sum(1 for ln in text.splitlines() if ln.startswith('|') and f'**{s}**' in ln) for s in states}
          total=sum(counts.values())
          snapshot=(f'Current snapshot across the {total} tracked body/front-matter assets and direct source placements: '
                    f'**{counts["Validated"]} Validated, {counts["Partial"]} Partial, '
                    f'{counts["Pending"]} Pending, {counts["N/A"]} N/A**.')
          text,n=re.subn(
              r'Current snapshot across the \d+ tracked body/front-matter assets and direct source placements: '
              r'\*\*\d+ Validated, \d+ Partial, \d+ Pending, \d+ N/A\*\*\.',
              snapshot,text,count=1)
          if n != 1:
              raise SystemExit('could not refresh FIGURES.md snapshot')
          ledger.write_text(text)

          print('validation snapshot:', counts, 'total', total)
          PY

          git diff --check

          # This workflow is intentionally one-shot; never leave source-mutating
          # audit machinery in the repository after it serves its purpose.
          rm -- .github/workflows/figure-equation-audit-checkpoint.yml

          git add -- \
            reconstruction/FIGURES.md \
