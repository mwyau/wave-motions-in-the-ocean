name: Apply EPUB math rendering fix

on:
  push:
    paths:
      - .github/epub-math-fix.trigger
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || (github.event.issue.number == 11 && github.event.comment.body == '/apply-epub-math-fix')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply EPUB math patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git apply --check .github/epub-math-first-batch.patch
          git apply .github/epub-math-first-batch.patch
          python3 -m py_compile scripts/build-epub.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('scripts/build-epub.py')
          spec = importlib.util.spec_from_file_location('build_epub', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          assert module.normalize_epub_math_tex(r'k,\ell,m') == 'k,{ℓ},m'
          assert module.normalize_epub_math_tex(r'\partial\ell/\partial k') == r'\partial{ℓ}/\partial k'
          assert module.normalize_epub_math_tex(r'p_{\rm atmosphere}') == r'p_{\mathrm{atmosphere}}'
          assert module.normalize_epub_math_tex(r'\elliptic + \ell') == r'\elliptic + {ℓ}'
          PY
          rm -- .github/workflows/apply-epub-math-fix.yml .github/epub-math-first-batch.patch .github/epub-math-fix.trigger
          git add -- scripts/build-epub.py reconstruction/styles/wave-epub.css .github/workflows/apply-epub-math-fix.yml .github/epub-math-first-batch.patch .github/epub-math-fix.trigger
          git diff --cached --check
          git commit -m "Correct EPUB math rendering"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
