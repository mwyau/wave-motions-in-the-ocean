repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-case-conflict
    - id: check-merge-conflict
    - id: check-yaml
    - id: end-of-file-fixer
    - id: fix-byte-order-marker
    - id: mixed-line-ending
    - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        name: Ruff lint
        args: [--fix]
      - id: ruff-format
        name: Ruff format

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--number]
        exclude: '(^README\.md$|^src/(EQUATIONS|FIGURES)\.md$|^src/(equations|figures)/.*\.md$)'
        additional_dependencies:
        - mdformat-gfm
        - mdformat-myst

  - repo: https://github.com/cmhughes/latexindent.pl
    rev: V4.0.2
    hooks:
      - id: latexindent
        files: ^src/.*\.(tex|sty)$
        types: [file]

  - repo: local
    hooks:
      - id: audit-freshness
        name: Update figure and equation audit freshness
        entry: uv run --frozen python scripts/publication.py audit-update
        language: system
        files: '^(src/(chapter[1-6]\.tex|FIGURES\.md|EQUATIONS\.md|figures/|equations/)|scripts/(publication|compare_figures)\.py|skills/|references/chapman-rizzoli-1989/)'

      - id: sync-readme
        name: Synchronize README
        entry: uv run --frozen python scripts/sync_readme.py
        language: system
        pass_filenames: false
        always_run: true
