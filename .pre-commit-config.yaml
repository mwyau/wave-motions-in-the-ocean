repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-case-conflict
    - id: check-merge-conflict
    - id: check-yaml
    - id: end-of-file-fixer
    - id: fix-byte-order-marker
    - id: mixed-line-ending
    - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        name: Ruff lint
        args: [--fix]
      - id: ruff-format
        name: Ruff format

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--number]
        exclude: ^README\.md$
        additional_dependencies:
        - mdformat-gfm
        - mdformat-myst

  - repo: https://github.com/cmhughes/latexindent.pl
    rev: V4.0.2
    hooks:
      - id: latexindent
        files: ^src/.*\.(tex|sty)$
        types: [file]

  - repo: local
    hooks:
      - id: sync-readme
        name: Synchronize README
        entry: python3 scripts/sync_readme.py
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Unit tests
        entry: python3 -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
